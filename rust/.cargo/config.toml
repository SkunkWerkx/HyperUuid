# macOS: a Python/Ruby/PHP extension module must not link the host runtime (libpython,
# libruby, libphp) — the Py*/rb_*/php* symbols resolve from the host process when the
# extension loads, so the linker has to be told to leave them undefined
# (`dynamic_lookup`). maturin arranges this itself for the python feature's release
# wheel build; a plain cargo invocation (this repo's dev loop, CI, and the ruby/php
# features, which have no maturin-equivalent wrapper) does not, so it's declared here.
# Harmless for the default (no extension feature) build too — a cdylib with no
# undefined symbols is unaffected by the flag either way. Linux permits undefined
# symbols in shared libraries by default, which is why only the Darwin targets need
# this. (Learned the hard way in HyperCast's CI bring-up; pre-applied here.)
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

# wasm32-wasip1 is the one target where a host cannot hand this library a pointer into its
# own memory: a wasm guest only sees its own linear memory, so every host that embeds the
# module (GraalWasm in the Java binding, wasmtime in the Ruby/Python/Go ones) has to ask the
# guest for a buffer it can fill. wasi-libc's malloc/free are already linked in (Rust's std
# allocator on this target is dlmalloc behind them); exporting them costs nothing and keeps
# ffi.rs's "plain pointers, no allocator protocol" contract untouched for every native
# platform. Linker flags rather than #[no_mangle] shims, so the C ABI surface stays exactly
# the twelve uuid_* exports plus hyperuuid_version on every other target.
#
# Using the guest's allocator, rather than a host-picked offset past the data segments, is
# load-bearing: dlmalloc claims the tail of the initial memory on first use, and a batch call
# writing there was observed corrupting the host's buffer on the very next allocation.
# Cargo only reads this file from the crate directory (`cargo cdylib` run inside rust/), the
# same way every other target section here already relies on.
[target.wasm32-wasip1]
rustflags = ["-C", "link-arg=--export=malloc", "-C", "link-arg=--export=free"]

# musl (Alpine): every *-linux-musl target defaults to a statically linked C runtime, and
# under that default rustc cannot produce a cdylib at all — `cargo cdylib` stops with "cannot
# produce cdylib ... as the target does not support these crate types". Turning crt-static
# off is what makes it yield libhyperuuid.so on Alpine, dynamically linked against musl's libc
# like any other shared library there.
#
# This is the dev-loop half. The library CI ships additionally links the unwinder statically
# (the forge's musl-native/build-musl.sh, which sets RUSTFLAGS and so supersedes these
# sections), because a plain build keeps a NEEDED entry for libgcc_s.so.1 — absent from the
# bare `alpine`, `python:*-alpine` and `golang:*-alpine` images, where it fails to load.
# A build made with only the flag below needs `apk add libgcc` wherever it runs.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

# wasm32-unknown-emscripten is built for one thing: the static library the NuGet package
# links into a Blazor WebAssembly app (`cargo wasm-staticlib`, below). That library is built
# without Rust's standard library, and a no_std artifact cannot unwind, so panics abort on
# this target — rustc refuses the build otherwise ("unwinding panics are not supported
# without std"). A panic is then the wasm `unreachable` trap from lib.rs's handler.
[target.wasm32-unknown-emscripten]
rustflags = ["-C", "panic=abort"]

[alias]
# The shared library every binding loads: libhyperuuid.so / .dylib / hyperuuid.dll in
# target/release/, and with `--target wasm32-wasip1` the hyperuuid.wasm module the wasm
# backends run. `rustc --crate-type cdylib` rather than a [lib] entry, because Cargo.toml
# declares only the rlib (it has the reason: a listed cdylib broke every
# `default-features = false` consumer off bare metal). A plain `cargo build` therefore
# produces the rlib and no shared library; this is the dev loop's build command, and what
# CI runs spelled out. Extra arguments pass through: `cargo cdylib --features python`.
cdylib = "rustc --release --crate-type cdylib"
# Local-dev builds of the extension features, each in its own target dir. The ruby and php
# features produce a differently-shaped libhyperuuid.so (Init_hyperuuid_native / the PHP module
# entry point) at the same path as the plain cdylib that Fiddle, ctypes-free FFI, P/Invoke,
# FFM, cgo and PHP's ext-ffi all dlopen from target/release/, so building one over the other
# silently breaks the rest. `cargo ruby-ext` / `cargo php-ext` keep them apart; the python feature
# gets the same isolation from python/.cargo/config.toml, since maturin runs cargo from there.
# Output lands in target/ruby/release/ and target/php/release/.
ruby-ext = "rustc --release --crate-type cdylib --features ruby --target-dir target/ruby"
php-ext = "rustc --release --crate-type cdylib --features php --target-dir target/php"
# The Blazor WebAssembly static library: libhyperuuid.a for wasm32-unknown-emscripten, with no
# copy of Rust's standard library inside it. `rustc --crate-type staticlib` rather than a
# [lib] entry, for the same reason as `cargo cdylib` above: the crate type belongs to this
# one invocation. `--no-default-features --features staticlib` is what leaves
# std out and supplies the panic handler in its place; two Hyper* libraries that each
# carried std could not be linked into one app (`duplicate symbol: rust_eh_personality`).
# Output: target/wasm32-unknown-emscripten/release/libhyperuuid.a.
wasm-staticlib = "rustc --release --target wasm32-unknown-emscripten --crate-type staticlib --no-default-features --features staticlib"
# The same no_std static library for any other target: `cargo staticlib --target <triple>`.
# Three bindings link one rather than load the shared library — Swift on Linux and
# WebAssembly, Go's cgo backend, a C# Native AOT publish — and the forge's
# static-libs/build-static-libs.sh runs this for each target, trims the archive to the one
# object that matters and places it where each binding expects it. Built on the `staticlib`
# profile (Cargo.toml), which is release plus `panic = "abort"`.
# Output: target/<triple>/staticlib/libhyperuuid.a.
staticlib = "rustc --profile staticlib --crate-type staticlib --no-default-features --features staticlib"
