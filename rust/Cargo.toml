[package]
name = "hyperuuid"
version = "0.5.0"
edition = "2024"
description = "RFC 9562 UUID v4 (random), v5 (deterministic), v6 and v7 (time-sortable) generation — high-performance, allocation-free, with a real batch API and a Criterion suite benchmarked against the `uuid` crate."
license = "MIT"
readme = "README.md"
repository = "https://github.com/SkunkWerkx/HyperUuid"
keywords = ["uuid", "rfc9562", "guid", "identifier", "ffi"]
categories = ["data-structures", "no-std", "no-std::no-alloc"]

# Only the rlib is declared. The shared library every binding loads is built by naming its
# crate type on the command line (`cargo cdylib`, an alias in .cargo/config.toml), the way
# the static libraries already are. Cargo builds every crate type a dependency lists, and a
# cdylib is a linked artifact that needs std's panic handler: while `cdylib` was listed
# here, a `default-features = false` consumer failed to build on any target able to produce
# one (the host, wasm32-unknown-unknown), and only bare-metal targets worked.
[lib]
crate-type = ["rlib"]

[dependencies]
getrandom = { version = "0.4.3", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311"], optional = true }
magnus = { version = "0.8", features = ["rb-sys"], optional = true }
ext-php-rs = { version = "0.15", optional = true }
no-panic = { version = "0.1", optional = true }

# One crate, three optional native-extension entry points instead of three satellite
# crates each path-depending back on this one. Nothing in a plain `cargo cdylib` (the
# Fiddle/ext-ffi-consumed shared library every non-extension binding dlopens) changes —
# these are additive, off by default, and only one is ever enabled per build invocation
# (each produces a different C entry point — PyInit__native, Init_hyperuuid_native, PHP's
# module struct — under the same crate, not meant to coexist in one binary).
[features]
# On by default so `cargo cdylib` produces the ordinary shared library every binding dlopens
# (a linked artifact needs std's panic handler). `default-features = false` gives a genuine
# `#![no_std]` rlib on every target, which is what the crate's published `no-std` category
# means; see lib.rs.
# getrandom's own `std` feature only adds `impl std::error::Error for getrandom::Error`, so
# it rides along here rather than being pinned on unconditionally. The three extension
# backends all require std through their own dependencies, so they name it explicitly rather
# than relying on the default.
default = ["std"]
std = ["getrandom/std"]
# The no_std static libraries, for the hosts that link the core in rather than load it: a
# Blazor WebAssembly app (the NuGet package, wasm32-unknown-emscripten), a Swift executable
# on Linux or WebAssembly, a Go binary built with cgo, and a C# Native AOT publish. A
# static library is a final artifact as far as panics go, so with `std` off it needs the
# `#[panic_handler]` std would have supplied; this feature is that handler and nothing else
# (see lib.rs). It exists so those libraries carry no copy of Rust's standard library: two
# Hyper* static libraries that each bundled std could not be linked into one program
# (`duplicate symbol: rust_eh_personality`). Off by default, and never for an rlib consumer,
# who supplies a handler of their own.
staticlib = []
python = ["dep:pyo3", "std"]
ruby = ["dep:magnus", "std"]
php = ["dep:ext-php-rs", "std"]
# Proves at link time that the public API cannot panic, the way `ryu` and `itoa` do: every
# generation, parsing and conversion function and every C export carries `#[no_panic]` under
# this feature, which turns any panic path the optimizer leaves in into an undefined symbol.
# The proof only happens when a release-optimized binary that calls the function is linked,
# so it is run by building `examples/no_panic.rs` (CI's check-no-panic job). `now_v7` is the
# one exception: std's own `SystemTime::now` unwraps the OS clock call, which this crate
# cannot reach into.
no-panic = ["dep:no-panic"]

[dev-dependencies]
criterion = "0.8.2"
uuid = { version = "1", features = ["v4", "v5", "v6", "v7"] }

[[bench]]
name = "uuid_benchmarks"
harness = false

[[example]]
name = "no_panic"
required-features = ["no-panic"]

# Size, not speed. Measured on win-x64 (Ruby 3.4, already carrying `-C strip=symbols`): the
# Magnus extension goes 1,102,336 -> 1,040,384 bytes, -5.6%, with .text 842,336 -> 792,704
# and all 14 exports intact. Every leg's artifact shrinks, not just that one, so it reaches
# the gems, wheels and the NuGet payload alike.
#
# Explicitly NOT a performance change, checked rather than hoped: interleaved A/B runs of the
# same 200k-iteration probe put LTO and stock within noise of each other (new_v4 ~356 vs
# ~363 ns/op, new_v7 ~554 vs ~562 across three alternating rounds). An earlier single-shot
# reading suggested a ~12% win; that was cross-session noise and did not survive being run
# back to back. Build time is unaffected at this crate's size (23s against 22s).
#
# Scope worth knowing: Cargo ignores a dependency's profile settings, so this applies to
# builds *of this repo* — every binding's cdylib, the three extension features, `cargo bench`
# — and never to a downstream crates.io consumer, who gets their own workspace's profile.
#
# Cargo only passes `-C lto` for a cdylib built as the invocation's one crate type, which is
# what `cargo cdylib` is: the plain linux-x64 library is 356,440 bytes that way, against
# 432,152 from a manifest that listed `["cdylib", "rlib"]`, at the same speed (v4/v5/v7
# through the C ABI, alternating runs, within noise).
[profile.release]
lto = true
codegen-units = 1

# The profile the `staticlib` feature's libraries are built with (`cargo staticlib`, in
# .cargo/config.toml): release, plus panics that abort. A no_std artifact cannot unwind —
# rustc refuses the build otherwise ("unwinding panics are not supported without std") —
# and a profile carries that to every dependency on every target, where a per-target
# rustflags entry would have to be repeated for each one.
[profile.staticlib]
inherits = "release"
panic = "abort"
