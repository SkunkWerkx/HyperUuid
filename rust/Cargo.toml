[package]
name = "hyperuuid"
version = "0.0.1"
edition = "2024"
description = "RFC 9562 UUID v4 (random), v5 (deterministic), v6 and v7 (time-sortable) generation — high-performance, allocation-free, with a real batch API and a Criterion suite benchmarked against the `uuid` crate."
license = "MIT"
readme = "README.md"
repository = "https://github.com/SkunkWerkx/HyperUuid"
keywords = ["uuid", "rfc9562", "guid", "identifier", "ffi"]
categories = ["data-structures", "no-std"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }

[dev-dependencies]
criterion = "0.8.2"
uuid = { version = "1", features = ["v4", "v5", "v6", "v7"] }

[[bench]]
name = "uuid_benchmarks"
harness = false
