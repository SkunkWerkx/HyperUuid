[package]
name = "hyperuuid-napi"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hyperuuid = { path = "../rust" }
napi = { version = "3", default-features = false, features = ["napi5"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
# catch_unwind on every #[napi] function needs an unwinder to catch with, so this stays
# explicit rather than inherited. The core is proven no-panic, so nothing reaches it in practice.
panic = "unwind"
lto = true
codegen-units = 1
strip = "symbols"

# The WASI build only (`npm run build:wasi`). wasm32-wasip1's std ships no unwinder: rustc
# 1.99.1 refuses `-C panic=unwind` for it, and cargo never passes that flag for a profile
# that says "unwind" (it emits `-C panic` only for abort), so the release profile's unwind
# above is silently the target's abort there. This profile says abort explicitly, so the
# rustc line carries `-C panic=abort` and a verbose build proves the strategy instead of
# relying on a default. Panics abort in the .wasm and `catch_unwind` has nothing to catch;
# the TypeScript README says so.
[profile.wasi]
inherits = "release"
panic = "abort"
