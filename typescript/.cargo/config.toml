# The musl sections repeat rust/.cargo/config.toml's: an addon is a shared library, which
# static-CRT musl cannot produce. The Windows sections below are this crate's own. The rest
# of that file is not needed here: napi_build::setup() (build.rs) gives the macOS link its
# dynamic_lookup, and the wasm target is never built.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

# Windows links the C runtime statically, as napi-rs's own template does: the .node then
# needs no Visual C++ runtime DLLs on the host that loads it, so a bare Windows install of
# Node or Bun loads the addon without the VC++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
