# The local registry run.sh serves the packed tarballs from. @skunkwerkx/* is local only (no uplink, so nothing published to npmjs can leak into a scenario); everything
# else proxies to npmjs, which is how the WASI package's runtime dependencies and the
# consumer's own tools resolve. run.sh passes --listen, and the storage lives under work/.
storage: ./work/storage
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
auth:
  htpasswd:
    file: ./work/htpasswd
    # One publisher: run.sh creates it through the registry's own user endpoint and publishes
    # with its token (npm refuses to publish with no credentials at all, so an anonymous
    # publish rule alone is not enough).
    max_users: 1
packages:
  '@skunkwerkx/*':
    access: $all
    publish: $authenticated
  '**':
    access: $all
    proxy: npmjs
log:
  type: stdout
  format: pretty
  level: warn
