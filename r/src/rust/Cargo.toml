[package]
name = "rcore"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

# The core from crates.io at exactly this package's version, the way any Rust consumer of it
# depends on it, and nothing else. prepare-release bumps the pin with DESCRIPTION, and
# tools/vendor.sh refuses a pin that differs from rust/Cargo.toml: it resolves this version
# from the checkout's rust/ and vendors that source beside the other crates into
# src/rust/vendor.tar.xz, so the package builds offline from the published graph.
[dependencies]
hyperuuid = { version = "=1.1.0", default-features = false, features = ["staticlib"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace]
