[package]
name = "hyperuuid-php-native"
version = "0.1.0"
edition = "2024"
description = "PHP native-extension backend for hyperuuid (benchmark spike) — the Rust core linked directly into a Zend extension via ext-php-rs, to measure against ext-ffi's already-low ~105ns crossing floor."
license = "MIT"
repository = "https://github.com/SkunkWerkx/HyperUuid"
publish = false

[lib]
name = "hyperuuid_php_native"
crate-type = ["cdylib"]

[dependencies]
hyperuuid = { path = "../../rust" }
ext-php-rs = "0.15"
