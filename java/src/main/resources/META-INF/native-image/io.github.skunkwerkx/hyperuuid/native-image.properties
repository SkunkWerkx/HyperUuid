# UuidGenerator.Downcalls holds the FFM downcall handles and nothing that needs the native
# library. Initialized when the image is built, they are constants in the image and Native
# Image compiles the calls through them; left to initialize at run time, every call goes
# through the method-handle interpreter instead, at microseconds apiece.
Args = --initialize-at-build-time=io.github.skunkwerkx.hyperuuid.UuidGenerator$Downcalls
