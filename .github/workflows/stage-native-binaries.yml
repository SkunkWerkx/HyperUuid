name: Stage native binaries after merge

# PHP/Swift/Go have no packing step of their own — whatever's literally in the git tree at a
# tagged commit is what a consumer gets (see php/src/native/README.md for the full story).
# That means the committed binaries under php/src/native/,
# swift/HyperUuidCore.artifactbundle/ and go/staticlib/ go stale the moment rust/
# changes and nothing re-stages them. This closes that
# loop automatically: the moment a PR touching rust/ merges to master, pull the exact binaries
# that PR's own ci.yml run already built and tested, and commit them straight back — so master's
# HEAD is always tag-ready, no separate "prepare release" step, no second CI cycle (ci.yml has
# no push trigger, so this bot commit doesn't spawn another ~80-minute matrix run).
#
# Deliberately a direct push, not a bot-opened PR: a PR here would just be "review a diff of
# binary files nobody can meaningfully read," and it re-adds the manual step this workflow
# exists to remove. The one real assumption this leans on: the merged PR's head SHA's own
# ci.yml run is still the right one to trust — true unless another already-merged PR touched
# rust/ in the gap between "this PR went green" and "this PR got merged," a low-probability
# race for how this repo actually moves, not a structural guarantee.
#
# workflow_dispatch exists purely to dry-run this against an arbitrary already-green commit
# without needing a real PR merge — pass the exact SHA whose ci.yml run you want to pull from.

#
# A third trigger covers the one rust/ change that never arrives as a PR: a release's
# version bump. The libraries embed the crate version, prepare-release.yml direct-pushes the
# bump and dispatches ci.yml against it, and when that dispatched run completes on master
# this workflow stages its output — so the commit a human then tags carries libraries that
# report the version being released. (Any hand-dispatched ci.yml run on master stages the
# same way, which is also the manual route when master needs restaging for another reason.)
# PR runs are deliberately not picked up here: an unmerged PR's libraries have no business
# on master, and the merged case is the pull_request trigger's job.

on:
  pull_request:
    types: [closed]
    paths:
      - "rust/**"
  workflow_run:
    workflows: ["CI — build native, build wasm, test every binding"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Commit SHA to pull native-* artifacts from (must have a successful ci.yml run) and to stage/commit onto master"
        required: true
        type: string

jobs:
  stage-native-binaries:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # gh attestation verify reads this repo's attestations before any binary is committed.
      attestations: read
    steps:
      - name: Resolve the source commit
        id: source
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) echo "sha=${{ inputs.head_sha }}" >> "$GITHUB_OUTPUT" ;;
            workflow_run)      echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT" ;;
            *)                 echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Find that commit's own ci.yml run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "${{ steps.source.outputs.sha }}" --status success --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful ci.yml run found for ${{ steps.source.outputs.sha }} — nothing to stage from." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: false
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      # The static libraries, for the two bindings that link the core in and have no packing
      # step of their own: Swift (swift/HyperUuidCore.artifactbundle) and Go (go/staticlib),
      # each on every platform it builds for. A consumer of either gets
      # whatever archives are committed. The artifact is laid out by repository path; it
      # also carries the C# package's archives, which are packed at release and never
      # committed. Same verify-then-stage gate as the rest.
      - uses: actions/download-artifact@v8
        with:
          name: static-libs
          path: artifacts/static-libs
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      # Committed binaries are the weakest provenance story in this repo: a reviewer can't
      # diff them, and "trust me, CI built it" is exactly what a downstream consumer inside a
      # trust boundary can't accept. So each artifact's SLSA attestation is verified BEFORE it
      # is allowed into the tree — "it's in git" now also means "its provenance checked out at
      # staging time." A failure here stops the commit rather than quietly shipping an
      # unverifiable blob.
      #
      # Several destinations, one set of bytes: git stores these as a single blob each (a
      # static archive Swift and Go both carry hashes to the same object in both trees), so
      # the duplication costs nothing in repository storage. Symlinking them was considered and rejected: //go:embed
      # refuses symlinks outright ("contains no embeddable files"), the Go module proxy's zip
      # format drops them, and a Windows checkout without Developer Mode materializes them as
      # text files, which would break PHP's FFI dlopen in a way that looks like corruption.
      - name: Verify attestations, then stage into php/, swift/, go/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -A LIB_NAMES=(
            [linux-x64]=libhyperuuid.so
            [linux-arm64]=libhyperuuid.so
            [linux-musl-x64]=libhyperuuid.so
            [linux-musl-arm64]=libhyperuuid.so
            [osx-x64]=libhyperuuid.dylib
            [osx-arm64]=libhyperuuid.dylib
            [win-x64]=hyperuuid.dll
            [win-arm64]=hyperuuid.dll
          )
          : > digests.txt
          for rid in "${!LIB_NAMES[@]}"; do
            src="artifacts/native/native-$rid/${LIB_NAMES[$rid]}"
            echo "::group::verify $rid"
            # --signer-repo is not optional here. `--repo X` alone asserts BOTH that the
            # artifact's source repo is X and that the workflow which signed it lives in X.
            # The first is true (source is this repo); the second is not — the signing step
            # is in hyper-build-native.yml, which physically lives in the shared
            # SkunkWerkx/.github forge repo, so Fulcio records that as the build signer.
            # Same job_workflow_ref reality that blocks nuget.org Trusted Publishing from
            # the forge (see hyper-pack-nuget.yml's header). Without this flag every
            # verification fails with a bare `verifying with issuer "sigstore.dev"` and
            # this gate rejects six perfectly good binaries. Confirmed against all six
            # artifacts of run 33518617482: FAIL with --repo alone, PASS with both.
            if ! gh attestation verify "$src" \
                 --repo "$GITHUB_REPOSITORY" --signer-repo SkunkWerkx/.github; then
              echo "::error::No valid build provenance for $rid — refusing to commit it."
              exit 1
            fi
            echo "::endgroup::"
            echo "$(sha256sum "$src" | cut -d' ' -f1)  $rid/${LIB_NAMES[$rid]}" >> digests.txt
          done

          # PHP is the one tree that still takes shared libraries. PHP on Windows is an x64
          # process even on ARM hardware, so an ARM64 DLL under php/ can never be loaded; the
          # one that earlier stagings committed there is removed.
          #
          # install -m 755 rather than cp: download-artifact does not preserve modes, and
          # the two repos' committed libraries had drifted to different ones.
          for rid in "${!LIB_NAMES[@]}"; do
            [ "$rid" = win-arm64 ] && continue
            mkdir -p "php/src/native/$rid"
            install -m 755 "artifacts/native/native-$rid/${LIB_NAMES[$rid]}" "php/src/native/$rid/${LIB_NAMES[$rid]}"
          done
          git rm -r --quiet --ignore-unmatch php/src/native/win-arm64
          # Swift links the core in on every platform now (its bundle, below), so the shared
          # libraries earlier stagings committed for it are loaded by nothing: under
          # HyperUuidNativeLibs (0.6.0 development) and under HyperUuid's own resources
          # (through 0.5.0).
          git rm -r --quiet --ignore-unmatch \
            swift/Sources/HyperUuidNativeLibs \
            swift/Sources/HyperUuid/NativeLibs

          # Go links the core on every platform now (go/staticlib, below), so the shared
          # libraries and the wasm module earlier stagings committed under go/native are
          # loaded by nothing.
          git rm -r --quiet --ignore-unmatch go/native

          # The static libraries: nine for Swift's bundle (glibc and musl Linux, macOS and
          # Windows on two architectures each, and wasm32-wasip1 — the two Windows ones named
          # hyperuuid.lib, as MSVC's linker convention has it), seven for Go (Linux, macOS and
          # Windows — the MSVC archives, which MinGW's linker reads — plus the wasm32-wasip1
          # one TinyGo links, the same bytes as Swift's). All of a
          # tree's or none: a Swift bundle whose info.json names an archive that is not there
          # fails every consumer's build, and a Go build with no archive for its platform
          # does not link. info.json is generated text naming those nine paths and the crate
          # version; it rides along unattested, readable in the diff.
          #
          # And three for Swift's XCFramework: iOS, the iOS simulator and Mac Catalyst, arm64
          # each. That tree is committed whole from the artifact, since nothing of it is
          # source: beside the archives, its Info.plist and each slice's copy of the header
          # and module map are generated text, unattested and readable in the diff like
          # info.json. swift/Package.swift declares the target only when the Info.plist is
          # there, so a tree from before this first ran simply has no iOS support yet.
          # Go's tree takes the four Apple mobile archives as plain files beside its seven:
          # iOS, the iOS simulator, and Mac Catalyst on both architectures.
          declare -A STATIC_TREES=(
            [swift/HyperUuidCore.artifactbundle]=9
            [swift/HyperUuidCoreApple.xcframework]=3
            [go/staticlib]=11
          )
          for tree in "${!STATIC_TREES[@]}"; do
            archives=()
            for archive in artifacts/static-libs/"$tree"/*/libhyperuuid.a artifacts/static-libs/"$tree"/*/hyperuuid.lib; do
              [ -e "$archive" ] && archives+=("$archive")
            done
            if [ "${#archives[@]}" != "${STATIC_TREES[$tree]}" ]; then
              echo "::error::Expected ${STATIC_TREES[$tree]} static libraries under $tree in the static-libs artifact."
              exit 1
            fi
            for archive in "${archives[@]}"; do
              dest="${archive#artifacts/static-libs/}"
              echo "::group::verify $dest"
              if ! gh attestation verify "$archive" \
                   --repo "$GITHUB_REPOSITORY" --signer-repo SkunkWerkx/.github; then
                echo "::error::No valid build provenance for $dest — refusing to commit it."
                exit 1
              fi
              echo "::endgroup::"
              echo "$(sha256sum "$archive" | cut -d' ' -f1)  $dest" >> digests.txt
              mkdir -p "$(dirname "$dest")"
              install -m 644 "$archive" "$dest"
            done
          done
          install -m 644 "artifacts/static-libs/swift/HyperUuidCore.artifactbundle/info.json" \
            "swift/HyperUuidCore.artifactbundle/info.json"
          xcframework=swift/HyperUuidCoreApple.xcframework
          install -m 644 "artifacts/static-libs/$xcframework/Info.plist" "$xcframework/Info.plist"
          for header in artifacts/static-libs/"$xcframework"/*/Headers/HyperUuidCore/*; do
            dest="${header#artifacts/static-libs/}"
            mkdir -p "$(dirname "$dest")"
            install -m 644 "$header" "$dest"
          done
          for slice in "$xcframework"/*/; do
            for file in hyperuuid.h module.modulemap; do
              [ -f "$slice/Headers/HyperUuidCore/$file" ] \
                || { echo "::error::$slice has no Headers/HyperUuidCore/$file in the static-libs artifact."; exit 1; }
            done
          done

          echo "### Staged native binaries (attestations verified)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat digests.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if anything actually changed
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add php/src/native swift/HyperUuidCore.artifactbundle swift/HyperUuidCoreApple.xcframework
          # -f: go/staticlib's archives are in .gitignore, so that this workflow is the only
          # thing that ever adds one — a developer's own build of them stays out of a commit.
          git add -f go/staticlib
          if git diff --cached --quiet; then
            echo "::notice::Staged binaries are byte-identical to what's already committed — nothing to push."
            exit 0
          fi
          git commit \
            -m "chore: stage native binaries from ci.yml run $RUN_ID ($SOURCE_SHA)" \
            -m "Build provenance verified with \`gh attestation verify\` before staging." \
            -m "sha256:" -m "$(cat digests.txt)"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
