name: Stage native binaries for release

# PHP, Swift and Go have no packing step of their own: whatever is in the git tree at a
# tagged commit is what a consumer gets (php/src/native/README.md has the full story). So
# the binaries under php/src/native/, swift/HyperUuidCore.artifactbundle/,
# swift/HyperUuidCoreApple.xcframework/ and go/staticlib/ are committed, and the commit that
# is tagged (B) carries the bytes built from its preparation parent (A).
#
# Those are staged once per release, not once per merge. A PR's ci.yml run is in `pr` mode
# and attests nothing, so it has nothing this workflow would accept; master's binaries are
# simply the last release's until the next one. Nothing on master reads them (every ci.yml
# leg builds and links its own), so they only have to be right at the tagged commit.
#
# The trigger is a release's version bump: prepare-release.yml pushes A and dispatches ci.yml
# (release mode) against it, and when that run completes on master this pulls its attested
# output, verifies every byte of it, and commits it straight back as B with the run, A and
# the Forge commit recorded as trailers release.yml reads. Scheduled runs are not staged.
# workflow_dispatch stages from any already-green, release-mode ci.yml run by commit SHA.
# The body lives in the Forge; its hyper_config.py derives the paths and targets from
# .github/hyper.json.

on:
  workflow_run:
    workflows: ["CI — build native, build wasm, test every binding"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Commit SHA to pull native-* artifacts from (must have a successful ci.yml run) and to stage/commit onto master"
        required: true
        type: string

concurrency:
  group: release-source-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage-native-binaries:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch')
    uses: SkunkWerkx/.github/.github/workflows/hyper-stage-natives.yml@master
    permissions:
      contents: write
      # gh attestation verify reads this repo's attestations before any binary is committed.
      attestations: read
      actions: read
    with:
      source_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.head_sha }}
      event_run_id: ${{ github.event.workflow_run.id }}
