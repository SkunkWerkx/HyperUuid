name: Stage native binaries for release

# Go has no packing step of its own: whatever is in the git tree at a tagged commit is what a
# consumer gets. So the archives under go/staticlib/ are committed, and the commit that is
# tagged (B) carries the bytes built from its preparation parent (A). Swift takes its core
# from two zips on the GitHub Release instead (hyper.json's swift_remote): B writes their
# checksums and the version into the root Package.swift, and the release attaches the same
# zips. PHP stages nothing: PIE installs the extension from zips the release attaches.
#
# Those are staged once per release, not once per merge. A PR's ci.yml run is in `pr` mode
# and attests nothing, so it has nothing this workflow would accept; master's binaries are
# simply the last release's until the next one. Nothing on master reads them (every ci.yml
# leg builds and links its own), so they only have to be right at the tagged commit.
#
# The trigger is a release's version bump: prepare-release.yml pushes A and dispatches ci.yml
# (release mode) against it, and once every job of that run is green its request-staging job
# dispatches this with the run's id (GitHub raises no workflow_run for a run a GITHUB_TOKEN
# started). This waits for the run to complete, pulls its attested output, verifies every byte
# of it, and commits it straight back as B with the run, A and the Forge commit recorded as
# trailers release.yml reads. workflow_run still fires for a ci.yml run a human dispatched;
# the second request for an A already staged is skipped with a notice, not a second B.
# Scheduled runs are not staged. workflow_dispatch by hand stages from any already-green,
# release-mode ci.yml run by commit SHA.
# The body lives in the Forge; its hyper_config.py derives the paths and targets from
# .github/hyper.json.

on:
  workflow_run:
    workflows: ["CI — build native, build wasm, test every binding"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Commit SHA to pull native-* artifacts from (must have a successful ci.yml run) and to stage/commit onto master"
        required: true
        type: string
      ci_run_id:
        description: "The ci.yml run to stage (ci.yml's request-staging job passes its own); empty looks up a successful release-mode run for head_sha"
        required: false
        type: string
        default: ""

concurrency:
  group: release-source-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage-native-binaries:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch')
    uses: SkunkWerkx/.github/.github/workflows/hyper-stage-natives.yml@master
    permissions:
      contents: write
      # gh attestation verify reads this repo's attestations before any binary is committed.
      attestations: read
      actions: read
    with:
      source_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.head_sha }}
      event_run_id: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
