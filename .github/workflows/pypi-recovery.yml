name: PyPI recovery — upload a prepared release's wheels

# One-off, for v1.0.0 only; delete it, and its Trusted Publisher on pypi.org, once the
# release is finalized. release.yml at v1.0.0 calls pypa/gh-action-pypi-publish from inside
# the Forge's publish-pypi composite action, where github.action_repository and action_ref are
# empty (actions/runner#2473), so the action looks for its image at ghcr.io/<this repo>:<tag>
# and fails before uploading. A tag's release.yml cannot change, so this uploads the same
# preserved wheels with the action as a top-level step. Nothing else differs: the same Forge
# commit and scripts verify the inventory, each wheel's build provenance and the release
# attestation, upload only what PyPI lacks, and confirm the public bytes. Afterwards
# release.yml dispatched at the tag finds every wheel served, skips its upload step and goes on
# to the finalizer. PyPI's PEP 740 publish attestations for these wheels name this workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, e.g. v1.0.0"
        required: true
        type: string
      prepared_run_id:
        description: "The tag's release.yml run holding release-packages"
        required: true
        type: string
      forge_revision:
        description: "The Forge commit that run used (the inventory's forge_sha)"
        required: true
        type: string

# Shared with release.yml, so this never runs beside a release run.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pypi-recovery:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.prepared_run_id }}
          FORGE_REVISION: ${{ inputs.forge_revision }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected a vX.Y.Z tag"; exit 1; }
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid prepared_run_id"; exit 1; }
          [[ "$FORGE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected the full Forge commit"; exit 1; }

      # The checkout at B: the committed natives are part of the inventory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ inputs.forge_revision }}
          path: .hyperforge
          persist-credentials: false

      # What release-identity exports, except that B is the tag's commit, not this run's
      # (which is master's head), and A and the CI run come from B's own trailers. The verify
      # below holds the preserved inventory to every one of these values.
      - name: Bind the release identity from the tag
        env:
          TAG: ${{ inputs.tag }}
          FORGE_REVISION: ${{ inputs.forge_revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FORGE_SCRIPTS="$PWD/.hyperforge/.github/scripts"
          eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
          staging=$(git rev-parse HEAD)
          source=$(git log -1 --format='%(trailers:key=Release-Source-SHA,valueonly)' HEAD | tr -d '[:space:]')
          ci_run=$(git log -1 --format='%(trailers:key=Release-CI-Run-ID,valueonly)' HEAD | tr -d '[:space:]')
          [ "$source" = "$(git rev-parse HEAD^)" ] || { echo "::error::$TAG is not a staging commit on its preparation source"; exit 1; }
          [[ "$ci_run" =~ ^[1-9][0-9]*$ ]] || { echo "::error::$TAG carries no Release-CI-Run-ID"; exit 1; }
          {
            echo "GH_TOKEN=$GH_TOKEN"
            echo "REPOSITORY=$GITHUB_REPOSITORY"
            echo "CRATE=$CRATE"
            echo "VERSION=${TAG#v}"
            echo "SOURCE_SHA=$source"
            echo "STAGING_SHA=$staging"
            echo "CI_RUN_ID=$ci_run"
            echo "PACKAGE_RUN_ID=$GITHUB_RUN_ID"
            echo "FORGE_SHA=$FORGE_REVISION"
            echo "FORGE_SCRIPTS=$FORGE_SCRIPTS"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-packages
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}

      - name: Recheck the immutable inventory before authentication
        run: python3 "$FORGE_SCRIPTS/release_inventory.py" verify --registry pypi --workspace .

      - name: Reconcile existing wheels by exact public bytes
        id: pending
        run: python3 "$FORGE_SCRIPTS/release_inventory.py" registry-plan --registry pypi --output pending-pypi

      - name: Publish only missing preserved wheels (Trusted Publishing)
        if: steps.pending.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pending-pypi

      - name: Verify every public wheel matches the prepared bytes
        run: python3 "$FORGE_SCRIPTS/release_inventory.py" registry-confirm --registry pypi
