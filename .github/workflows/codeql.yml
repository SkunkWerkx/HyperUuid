name: CodeQL

# Advanced setup rather than GitHub's default setup, for two reasons: default setup has no path
# filters, and test code is out of scope for the security queries (the excluding is done by
# .github/codeql/codeql-config.yml, which explains why); and its Swift autobuild builds the wrong
# package (see the matrix). Default setup must stay disabled in the repository settings: while it
# is on, GitHub rejects every upload from this workflow.
#
# Everything else mirrors what default setup ran — the same nine languages, the same default
# query suite, the same weekly cadence — and `category` is spelled out below so alerts keep the
# `/language:<lang>` identity they had under default setup instead of being re-raised from
# scratch as new ones.
#
# The cost of the switch is that this file now owns what default setup owned: a language added
# to the repository is unscanned until it is added to the matrix.

# Weekly and on demand, not on pull requests or pushes: the scan is a release gate, run on A by
# the preparation run's `codeql` job (ci.yml's tail), which dispatches it with its run id and
# requires a clean dashboard before B is staged (.github/RELEASING.md), and the weekly run keeps
# the dashboard current between releases. No checkout carries a Swift core, so the Swift leg
# builds against the zips a release-mode ci.yml run attested: the run the dispatch names, or
# the newest green one on master for the weekly scan. Swift alone is why: under CodeQL's tracer a Swift build of this
# library costs 7-8½ minutes however it is invoked (`swift build --target` took 7m37s, `swiftc`
# on the library's sources directly 8m27s; untraced, either takes seconds), a fixed cost of the
# extractor rather than of the code, and not one worth paying on every pull request.
on:
  schedule:
    # Weekly, off the hour and off CI's Monday board.
    - cron: "27 4 * * 2"
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "The release-mode ci.yml run whose attested Swift core the Swift leg builds against; empty takes the newest green one on master"
        required: false
        type: string
        default: ""

# A run for a ref waits for the one before it rather than cancelling it: a run to completion is
# what keeps the code scanning dashboard current.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      # What the CodeQL job needs and nothing more: SARIF upload, the workflow's own metadata, and
      # the default read-only access to the repository.
      security-events: write
      actions: read
      contents: read
      packages: read
      # The Swift leg verifies the core's build provenance before unpacking it.
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # No build to trace.
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: ruby
            build-mode: none
            runner: ubuntu-latest
          # Compiled, with a database built without a build. There is no Kotlin in this
          # repository, so `none` is valid for java-kotlin; the Rust and C# extractors are built
          # for it.
          - language: csharp
            build-mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build-mode: none
            runner: ubuntu-latest
          - language: rust
            build-mode: none
            runner: ubuntu-latest
          # Go and Swift have no no-build mode. Go's autobuild finds go/go.mod and is right.
          - language: go
            build-mode: autobuild
            runner: ubuntu-latest
          # Swift's autobuild picks swift/Benchmarks and spends 10-25 minutes on the benchmark
          # package's dependency tree, reaching the library only through it. The build step
          # below compiles the library alone. macos-latest, not the build legs' xcode-27: on
          # that image (macOS 27, Xcode 27.1) CodeQL 2.27.3's tracer broke SwiftPM's manifest
          # compile with "posix_spawn error: Bad CPU type in executable" (2026-11-01).
          - language: swift
            build-mode: manual
            runner: macos-latest
          # Not scanned: C/C++, whose only files are hyperuuid.h in the CI-built Swift bundles
          # (nothing to compile; the C ABI is Rust's, rust/src/ffi.rs), and PHP, which CodeQL
          # does not support.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # The core left git on 2026-10-30: the root Package.swift links a local core when one is
      # in swift/ and otherwise downloads the release's zips, which the finalizer has not
      # published at preparation time. So the Swift leg does what the Swift suites do: it takes
      # the run's swift-release-assets, verifies each zip's build provenance (signed by the Forge
      # at that run's commit) and unpacks them into swift/ (swift_release.py unpack).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.build-mode == 'manual'
        with:
          repository: SkunkWerkx/.github
          ref: master
          path: .hyperforge
          persist-credentials: false

      - name: Resolve the release-mode run whose core to build against
        id: run
        if: matrix.build-mode == 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$CI_RUN_ID" ]; then
            [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid ci_run_id"; exit 1; }
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '"\(.id) \(.head_sha)"')
          else
            found=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --status success \
              --limit 20 --json databaseId,event,headSha \
              --jq 'map(select(.event == "workflow_dispatch" or .event == "schedule"))[0] // empty | "\(.databaseId) \(.headSha)"')
          fi
          [ -n "$found" ] || { echo "::error::No green release-mode ci.yml run on master to take a core from"; exit 1; }
          echo "id=${found%% *}" >> "$GITHUB_OUTPUT"
          echo "sha=${found##* }" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.build-mode == 'manual'
        with:
          name: swift-release-assets
          path: ${{ runner.temp }}/swift-release-assets
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Stage that run's attested Swift core
        if: matrix.build-mode == 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.run.outputs.sha }}
          FORGE_SCRIPTS: .hyperforge/.github/scripts
        run: |
          set -euo pipefail
          for zip in "$RUNNER_TEMP"/swift-release-assets/*.zip; do
            gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY" --signer-repo SkunkWerkx/.github \
              --source-digest "$SOURCE_SHA"
          done
          python3 "$FORGE_SCRIPTS/swift_release.py" unpack --assets "$RUNNER_TEMP/swift-release-assets"

      # From the root Package.swift, the one consumers resolve; its HyperUuid target is the
      # same sources as swift/Package.swift's, now linking the unpacked core.
      - name: Build the Swift library
        if: matrix.build-mode == 'manual'
        run: swift build --target HyperUuid

      # Builds the autobuild languages and uploads every language's SARIF, once each, under the
      # same `/language:<lang>` category default setup used.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
