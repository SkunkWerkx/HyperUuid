      CRATE: hyperuuid
      VERSION: ${{ needs.find-ci-run.outputs.version }}
      SOURCE_SHA: ${{ needs.find-ci-run.outputs.source_sha }}
      STAGING_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ needs.find-ci-run.outputs.run_id }}
      PACKAGE_RUN_ID: ${{ github.run_id }}
