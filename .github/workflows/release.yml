    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-packages

      - name: Recheck the immutable inventory before authentication
        run: python3 .hyperforge/.github/scripts/release_inventory.py verify --registry ruby

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"

      - name: Reconcile existing gems by exact public bytes
        id: pending
        run: python3 .hyperforge/.github/scripts/release_inventory.py registry-plan --registry ruby --output pending-ruby

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        if: steps.pending.outputs.pending == 'true'

      - name: Publish only missing preserved gems
        if: steps.pending.outputs.pending == 'true'
        run: |
          set -euo pipefail
          for gem in pending-ruby/*.gem; do gem push "$gem"; done

      - name: Verify every public gem matches the prepared bytes
        run: python3 .hyperforge/.github/scripts/release_inventory.py registry-confirm --registry ruby

