name: Release — prepare, verify, preserve, publish, finalize

# The release is two deliberate acts at the same root tag (B, the staging commit).
#
#   1. Pushing the tag runs this workflow with no inputs: it verifies B against its
#      preparation run, packs every registry input, attests each package and the release
#      as a whole (inventory.json plus the release attestation over every shipped file),
#      preserves the complete release-packages artifact, plans every registry upload and
#      proves every Trusted Publisher exchange it can without uploading. Nothing is pushed,
#      no Go tag, no GitHub Release.
#   2. `gh workflow run release.yml --ref vX.Y.Z -f prepared_run_id=<that run>` publishes
#      from the preserved bytes through the recovery path, so every release exercises it.
#
# Recovery is the same dispatch, plus publication_run_id when registry receipts exist. It
# never rebuilds the native matrix and never re-attests; it verifies the preserved bytes
# against the attestations the tag run made. The job bodies live in the Forge: the composite
# actions (SkunkWerkx/.github/.github/actions/*) run from the one Forge commit this run
# resolved, checked out as .hyperforge; the five reusable workflows (the NuGet, crate and
# Maven packing, the crate and Maven publishing) are called at master, which GitHub resolves
# when the run is queued.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Optional assertion of B's Release-CI-Run-ID; never an override"
        required: false
        type: string
      prepared_run_id:
        description: "Exact prior release.yml run at this tag/B holding release-packages"
        required: false
        type: string
      publication_run_id:
        description: "Prior publication attempt with NuGet/Central/crate receipts"
        required: false
        type: string
      maven_deployment_id:
        description: "Exact Central Portal ID to reconcile an upload with a lost response"
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  find-ci-run:
    runs-on: ubuntu-26.04
    outputs:
      run_id: ${{ steps.guard.outputs.run_id }}
      source_sha: ${{ steps.guard.outputs.source_sha }}
      version: ${{ steps.guard.outputs.version }}
      forge_sha: ${{ steps.forge.outputs.revision }}
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # The Forge is called at master. GitHub resolves that to one commit when the run is queued
      # and records it in the run's referenced_workflows; every .hyperforge checkout and the
      # inventory's forge_sha use that commit, so the actions and scripts match the reusable
      # workflows. A recovery run verifies the preserved inventory against it, so recovery needs
      # the Forge's master unchanged since the packaging run.
      # The output is `revision`, not `sha`: CodeQL reads a checkout ref whose step, job or output
      # name contains head, sha, commit, branch or ref as a pull request head, and in this
      # read-only job (the write-permission jobs fall outside that query) it reports the release
      # guard as a cache-poisoning step (actions/cache-poisoning/poisonable-step).
      - name: Resolve the Forge commit this run uses
        id: forge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith("SkunkWerkx/.github/")) | .sha] | unique | .[]')
          [[ "$shas" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected one Forge commit in this run, got: ${shas:-none}"; exit 1; }
          echo "revision=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ steps.forge.outputs.revision }}
          path: .hyperforge
          persist-credentials: false

      - id: guard
        uses: ./.hyperforge/.github/actions/release-guard
        with:
          ci_run_id: ${{ inputs.ci_run_id }}
          prepared_run_id: ${{ inputs.prepared_run_id }}
          forge_sha: ${{ steps.forge.outputs.revision }}
          token: ${{ github.token }}

  nuget-org-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-nuget.yml@master
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      csproj_path: csharp/HyperUuid/HyperUuid.csproj
      runtimes_dir: csharp/HyperUuid/runtimes
      android: true
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}

  crate-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-crate.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write

  maven-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-maven.yml@master
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      java_resources_dir: java/src/main/resources/native
      java_jni: true
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}
    secrets:
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}

  # The gems and the wheels are handled by composite actions, not reusable workflows, because
  # the gems are attested here and RubyGems.org verifies this repository's identity: a
  # composite action keeps the caller's OIDC identity, a reusable workflow carries the Forge's.
  ruby-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/pack-gems
        with:
          run_id: ${{ needs.find-ci-run.outputs.run_id }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          token: ${{ github.token }}

  # The npm tarballs and the R source tarball are attested here for the same reason: npmjs.com
  # registers this repository's OIDC identity, and the inventory records both groups as signed
  # by this repository at B. The CRAN tarball is preserved and never uploaded by any job.
  npm-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/pack-npm
        with:
          run_id: ${{ needs.find-ci-run.outputs.run_id }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          token: ${{ github.token }}

  r-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/pack-r
        with:
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}

  # The C archives, one per platform, for the GitHub Release: the CI run's attested libraries
  # with the header and c/'s package files, attested here because the inventory records the c/
  # group as signed by this repository at B, like the gems.
  c-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/pack-c
        with:
          run_id: ${{ needs.find-ci-run.outputs.run_id }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          token: ${{ github.token }}

  pypi-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/verify-wheels
        with:
          run_id: ${{ needs.find-ci-run.outputs.run_id }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          token: ${{ github.token }}

  # One inventory of every registry input and every native committed at B, attested twice:
  # build provenance for inventory.json, and the release attestation whose subjects are every
  # shipped file and whose predicate is the inventory. Preserved for 90 days as
  # release-packages; a recovery run verifies the preserved bytes and never re-attests.
  publication-gate:
    needs: [find-ci-run, nuget-org-pack, ruby-pack, pypi-pack, npm-pack, r-pack, c-pack, crate-pack, maven-pack]
    if: >-
      always() && !cancelled() && needs.find-ci-run.result == 'success' &&
      (inputs.prepared_run_id != '' ||
       (needs.nuget-org-pack.result == 'success' && needs.ruby-pack.result == 'success' &&
        needs.pypi-pack.result == 'success' && needs.npm-pack.result == 'success' &&
        needs.r-pack.result == 'success' && needs.c-pack.result == 'success' &&
        needs.crate-pack.result == 'success' &&
        needs.maven-pack.result == 'success'))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/release-gate
        with:
          version: ${{ needs.find-ci-run.outputs.version }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          ci_run_id: ${{ needs.find-ci-run.outputs.run_id }}
          forge_sha: ${{ needs.find-ci-run.outputs.forge_sha }}
          prepared_run_id: ${{ inputs.prepared_run_id }}
          token: ${{ github.token }}
          npm_packages: true
          cran_packages: true

  # Every publisher below runs on the tag push with publish off: it plans the upload from the
  # preserved inventory and, where the registry allows it, completes the Trusted Publisher
  # exchange without uploading. Only a workflow_dispatch publishes.
  nuget-org-publish:
    needs: [find-ci-run, publication-gate]
    if: >-
      !cancelled() && needs.find-ci-run.result == 'success' &&
      needs.publication-gate.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/publish-nuget
        with:
          version: ${{ needs.find-ci-run.outputs.version }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          ci_run_id: ${{ needs.find-ci-run.outputs.run_id }}
          forge_sha: ${{ needs.find-ci-run.outputs.forge_sha }}
          publication_run_id: ${{ inputs.publication_run_id || inputs.prepared_run_id }}
          publish: ${{ github.event_name == 'workflow_dispatch' }}
          trusted_publisher_user: ${{ vars.NUGET_TRUSTED_PUBLISHER_USER }}
          token: ${{ github.token }}

  rubygems-publish:
    needs: [find-ci-run, publication-gate]
    if: >-
      !cancelled() && needs.find-ci-run.result == 'success' &&
      needs.publication-gate.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/publish-rubygems
        with:
          version: ${{ needs.find-ci-run.outputs.version }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          ci_run_id: ${{ needs.find-ci-run.outputs.run_id }}
          forge_sha: ${{ needs.find-ci-run.outputs.forge_sha }}
          publication_run_id: ${{ inputs.publication_run_id || inputs.prepared_run_id }}
          publish: ${{ github.event_name == 'workflow_dispatch' }}
          token: ${{ github.token }}

  npm-publish:
    needs: [find-ci-run, publication-gate]
    if: >-
      !cancelled() && needs.find-ci-run.result == 'success' &&
      needs.publication-gate.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/publish-npm
        with:
          version: ${{ needs.find-ci-run.outputs.version }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          ci_run_id: ${{ needs.find-ci-run.outputs.run_id }}
          forge_sha: ${{ needs.find-ci-run.outputs.forge_sha }}
          publication_run_id: ${{ inputs.publication_run_id || inputs.prepared_run_id }}
          publish: ${{ github.event_name == 'workflow_dispatch' }}
          token: ${{ github.token }}

  pypi-publish:
    needs: [find-ci-run, publication-gate]
    if: >-
      !cancelled() && needs.find-ci-run.result == 'success' &&
      needs.publication-gate.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - id: pypi
        uses: ./.hyperforge/.github/actions/publish-pypi
        with:
          version: ${{ needs.find-ci-run.outputs.version }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          ci_run_id: ${{ needs.find-ci-run.outputs.run_id }}
          forge_sha: ${{ needs.find-ci-run.outputs.forge_sha }}
          publication_run_id: ${{ inputs.publication_run_id || inputs.prepared_run_id }}
          token: ${{ github.token }}
      # A step of this workflow, never of the Forge's action: pypa/gh-action-pypi-publish runs
      # its own container image, which it finds through github.action_repository, and nested in
      # a composite action that is empty (actions/runner#2473), so it looked for
      # ghcr.io/<this repo>:<tag> and both v1.0.0 uploads failed before sending anything. The
      # action cannot make the OIDC exchange without uploading, so only a publish dispatch runs
      # it, and its PEP 740 publish attestations name this file, as every release's must.
      - name: Publish only missing preserved wheels and sdist (Trusted Publishing)
        if: steps.pypi.outputs.pending == 'true' && github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pending-pypi
      - name: Verify every public wheel and sdist matches the prepared bytes
        if: github.event_name == 'workflow_dispatch'
        run: python3 "$FORGE_SCRIPTS/release_inventory.py" registry-confirm --registry pypi

  # crates.io Trusted Publishing is registered against this file, release.yml: crates.io
  # matches the OIDC token's workflow_ref claim, which names the top-level workflow, not the
  # Forge's hyper-publish-crate.yml that this job calls. The Forge's package_preparation.py
  # finds this job in run history by its name ("pack-crates / publish"): don't rename it.
  pack-crates:
    needs: [find-ci-run, publication-gate]
    if: >-
      !cancelled() && needs.find-ci-run.result == 'success' &&
      needs.publication-gate.result == 'success'
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-crate.yml@master
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      prepared_run_id: ${{ github.run_id }}
      prepared_artifact_name: verified-crate-package
      publication_run_id: ${{ inputs.publication_run_id || inputs.prepared_run_id }}
      publish: ${{ github.event_name == 'workflow_dispatch' }}

  maven-publish:
    needs: [find-ci-run, publication-gate]
    if: >-
      !cancelled() && needs.find-ci-run.result == 'success' &&
      needs.publication-gate.result == 'success'
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-maven.yml@master
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      java_resources_dir: java/src/main/resources/native
      java_jni: true
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}
      prepared_run_id: ${{ github.run_id }}
      prepared_artifact_name: verified-maven-central-package
      publication_run_id: ${{ inputs.publication_run_id || inputs.prepared_run_id }}
      deployment_id: ${{ inputs.maven_deployment_id }}
      publish: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}

  # The go/vX.Y.Z tag and the GitHub Release (notes from the CHANGELOG's section plus the
  # verification commands), only once every registry has the bytes, and only on a dispatch.
  finalize-release:
    needs: [find-ci-run, publication-gate, nuget-org-publish, rubygems-publish, pypi-publish, npm-publish, pack-crates, maven-publish]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' &&
      needs.find-ci-run.result == 'success' && needs.publication-gate.result == 'success' &&
      needs.nuget-org-publish.result == 'success' && needs.rubygems-publish.result == 'success' &&
      needs.pypi-publish.result == 'success' && needs.npm-publish.result == 'success' &&
      needs.pack-crates.result == 'success' && needs.maven-publish.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/finalize-release
        with:
          version: ${{ needs.find-ci-run.outputs.version }}
          source_sha: ${{ needs.find-ci-run.outputs.source_sha }}
          ci_run_id: ${{ needs.find-ci-run.outputs.run_id }}
          forge_sha: ${{ needs.find-ci-run.outputs.forge_sha }}
          token: ${{ github.token }}
