name: Release — publish to real, public registries

# PR -> ci (see ci.yml), tag -> release: this file is the only place a real, permanent,
# public publish can happen. workflow_dispatch stays enabled for now specifically because
# Trusted Publishing has no local test path at all (the OIDC exchange only exists inside an
# Actions runner) — it's the only way to prove a leg works before composing every binding
# together under a real v0.1.0 tag. Once every leg is proven, workflow_dispatch comes off
# this file entirely so a public publish can only ever happen from a deliberate tag push,
# never a manual button press — see the pack-crates comment below for why that matters.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # This job is the only "build" this file does at all. ci.yml already built and packed
  # everything real (native legs, wasm, PyPI wheels, the NuGet .nupkg) — a tag push just
  # needs to find that run. Every job below this one is authenticate -> download that run's
  # already-packed artifact -> publish, nothing more. Also the correctness gate the old
  # per-leg `needs:` comments used to describe: no successful ci.yml run for this SHA means
  # nothing downstream proceeds.
  #
  # ci.yml has no push trigger (master is branch-protected, and a stray push-to-master run
  # rebuilding/repacking on every trivial change, docs included, wasn't worth it) — so
  # before tagging, dispatch it by hand against master's HEAD:
  #   gh workflow run ci.yml --repo SkunkWerkx/HyperUuid --ref master
  # then wait for it to go green before pushing the tag. Skip that and this job fails fast
  # below rather than silently rebuilding.
  find-ci-run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find ci.yml's run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful ci.yml run found for $GITHUB_SHA — dispatch ci.yml by hand against master's HEAD (gh workflow run ci.yml --ref master) and let it go green before tagging." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  # No pack job here at all — ci.yml already packed the .nupkg. This job is purely
  # auth -> download that artifact -> push. (There was previously a standalone
  # nuget-org-login job here too, but nothing ever depended on it — this job's own login
  # step below already does a fresh OIDC exchange, so the extra job was dead weight and got
  # removed rather than un-paused into a no-op.)
  #
  # Paused for the same reason as pypi-publish/pack-crates below: HyperUuid.csproj is still
  # pinned at the already-published 0.0.6, nothing changed on the NuGet side this release —
  # this tag is a Maven-Central-under-the-new-io.github.skunkwerkx-namespace-only release.
  # Un-pause alongside bumping HyperUuid.csproj's version whenever there's an actual reason
  # to re-publish.
  nuget-org-publish:
    if: false
    needs: find-ci-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v8
        with:
          name: nuget-org-package
          path: nupkg-org
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHER_USER }}

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "nupkg-org/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

  # Ruby leg: hyperuuid.gemspec bumped to the real 0.0.1 — proving RubyGems Trusted
  # Publishing (OIDC) for real, same as every other registry's own first real publish, ahead
  # of the coordinated v0.1.0 release. No pack job here either — ci.yml's ruby-pack-gems
  # already built the real universal ("ruby" platform, pure Fiddle) gem plus 4 precompiled
  # Magnus platform gems (linux-x64/arm64, osx-x64/arm64); this job is purely auth -> download
  # -> push all 5. Deliberately NOT rubygems/release-gem@v1 — that action always builds (and
  # pushes) exactly one gem itself via `bundle exec rake release`, which doesn't fit "publish
  # 5 already-built gem files from a separate job"; configure-rubygems-credentials is the same
  # OIDC exchange release-gem uses internally, called directly so a plain `gem push` per file
  # picks up the resulting credentials.
  rubygems-publish:
    needs: find-ci-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v8
        with:
          name: rubygems-packages
          path: pkg
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: rubygems/configure-rubygems-credentials@main

      - name: Publish to rubygems.org
        run: |
          set -euo pipefail
          for gem in pkg/*.gem; do
            gem push "$gem"
          done
          --skip-duplicate

  # PyPI leg: real multi-platform PyO3 native wheels from day one, no ctypes fallback and no
  # throwaway single-wheel version. abi3-py39 collapses the matrix to one wheel per platform
  # (not per Python version), so 6 legs covers every supported CPython 3.9+ on every
  # platform. Built in ci.yml's own push-to-master run, not here — this job is purely
  # auth -> download -> publish.
  #
  # Paused: python/pyproject.toml is still pinned at 0.0.2, already published and we're happy
  # with that output — nothing changed on the Python side this release, so running this again
  # would just be a guaranteed duplicate-version rejection (PyPI has no --skip-duplicate the
  # way nuget-org-publish does). This tag is a NuGet-only release. Un-pause alongside bumping
  # pyproject.toml's version whenever there's an actual reason to re-publish.
  pypi-publish:
    if: false
    needs: find-ci-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-wheels-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Publishes the rust/ core crate to crates.io — source only, no native artifact needed,
  # so this doesn't depend on find-ci-run the way nuget-org-pack does.
  #
  # Paused for the same reason as pypi-publish above: rust/Cargo.toml is still pinned at
  # 0.0.2, already published, nothing changed there this release — cargo publish has no
  # duplicate-version skip either, it's a hard failure. Un-pause alongside bumping
  # Cargo.toml's version whenever there's an actual reason to re-publish.
  pack-crates:
    if: false
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-crate.yml@master
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Java leg: build.gradle.kts bumped to the real 0.0.1 — proving the Maven Central Publisher
  # Portal token + in-memory GPG signing path for real, same as every other registry's own
  # first real publish, ahead of the coordinated v0.1.0 release.
  #
  # Paused for the same reason as the others: io.github.skunkwerkx:hyperuuid:0.0.1 already
  # published for real at v0.0.8 — Maven Central rejects a duplicate-version republish outright
  # (no --skip-duplicate the way nuget-org-publish has), so re-running this on a later tag would
  # just fail. Un-pause alongside bumping java/build.gradle.kts's version whenever there's an
  # actual reason to re-publish.
  maven-publish:
    if: false
    needs: find-ci-run
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-maven.yml@master
    with:
      crate: hyperuuid
      java_resources_dir: java/src/main/resources/native
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
