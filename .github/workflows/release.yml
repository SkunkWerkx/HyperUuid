    needs: [find-ci-run, publication-gate, nuget-org-publish, rubygems-publish, pypi-publish, pack-crates, maven-publish]
    if: >-
      !cancelled() && needs.find-ci-run.result == 'success' && needs.publication-gate.result == 'success' &&
      needs.nuget-org-publish.result == 'success' && needs.rubygems-publish.result == 'success' &&
      needs.pypi-publish.result == 'success' && needs.pack-crates.result == 'success' && needs.maven-publish.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
