name: Release — prepare, verify, preserve, publish, finalize

# Root v tag is the deliberate release initiation. All five registry publishers
# wait for one complete preserved package inventory. Recovery runs at the SAME
# root tag/B using an exact prepared_run_id; it never rebuilds the native matrix.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Optional assertion of B's Release-CI-Run-ID; never an override"
        required: false
        type: string
      prepared_run_id:
        description: "Exact prior release.yml run at this tag/B holding release-packages"
        required: false
        type: string
      publication_run_id:
        description: "Prior publication attempt with NuGet/Central/crate receipts"
        required: false
        type: string
      maven_deployment_id:
        description: "Exact Central Portal ID to reconcile an upload with a lost response"
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  find-ci-run:
    runs-on: ubuntu-26.04
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      source_sha: ${{ steps.find.outputs.source_sha }}
      version: ${{ steps.subject.outputs.version }}
      forge_sha: ${{ steps.forge.outputs.sha }}
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Require the exact release tag at B
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Run release.yml at the root version tag, including recovery"; exit 1; }
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify the staging commit and its exact preparation run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID_OVERRIDE: ${{ inputs.ci_run_id }}
        run: python3 .github/scripts/release_guard.py record

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id == ''
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: false
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id == ''
        with:
          name: static-libs
          path: artifacts/static-libs
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install object-format-capable symbol readers
        if: inputs.prepared_run_id == ''
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Compare every staged payload with the verified preparation artifacts
        if: inputs.prepared_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.find.outputs.source_sha }}
        run: python3 .github/scripts/release_guard.py compare

      # The Forge is called at master. GitHub resolves that to one commit when the run is queued
      # and records it in the run's referenced_workflows; every .hyperforge checkout and the
      # inventory's forge_sha use that commit, so the scripts match the reusable workflows. A
      # recovery run verifies the preserved inventory against it, so recovery needs the Forge's
      # master unchanged since the packaging run.
      - name: Resolve the Forge commit this run uses
        id: forge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith("SkunkWerkx/.github/")) | .sha] | unique | .[]')
          [[ "$shas" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected one Forge commit in this run, got: ${shas:-none}"; exit 1; }
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ steps.forge.outputs.sha }}
          path: .hyperforge
          persist-credentials: false
      - name: Validate the exact preserved release run
        if: inputs.prepared_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CRATE: hyperuuid
          VERSION: ${{ steps.subject.outputs.version }}
          SOURCE_SHA: ${{ steps.find.outputs.source_sha }}
          STAGING_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ steps.find.outputs.run_id }}
          PACKAGE_RUN_ID: ${{ github.run_id }}
          FORGE_SHA: ${{ steps.forge.outputs.sha }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
        run: python3 .hyperforge/.github/scripts/release_inventory.py run

  nuget-org-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-nuget.yml@master
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      csproj_path: csharp/HyperUuid/HyperUuid.csproj
      runtimes_dir: csharp/HyperUuid/runtimes
      dotnet_version: "11.0.x"
      dotnet_quality: "preview"
      android: true
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}

  crate-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-crate.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write

  maven-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-maven.yml@master
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      java_resources_dir: java/src/main/resources/native
      wasip1_module: true
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}
    secrets:
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}

  ruby-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    runs-on: ubuntu-26.04
    permissions:
      # Explicit, so checkout keeps working if this repo ever stops being public — a
      # permissions block sets every unlisted scope to none.
      contents: read
      id-token: write
      # read: gh attestation verify checks every downloaded binary before it is packed.
      # write: the gems built from them are themselves attested below.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: false
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ruby-native-*
          path: artifacts/ruby-native
          merge-multiple: false
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ruby-wasm-*
          path: artifacts/ruby-wasm
          merge-multiple: false
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      # Nothing downloaded above is inspectable, and nothing here gets rebuilt — the
      # eight plain FFI libs go verbatim into the universal "ruby" platform gem and each
      # Magnus extension goes verbatim into its own precompiled platform gem, the two
      # wasm32-wasip1 archives into the -wasm gem — so `gem push` is the last moment
      # these bytes can still be rejected, and it is irreversible (RubyGems has no
      # unpublish and no duplicate-version overwrite). ci.yml attested all twenty-two
      # (eight libraries, fourteen extensions) at build time via hyper-build-native.yml,
      # and the two archives via hyper-build-wasm.yml; this is the gate that actually
      # spends those attestations instead of just producing them.
      #
      # --signer-repo is not optional. `--repo X` alone asserts BOTH that the artifact's
      # source repo is X and that the workflow which signed it lives in X. Only the first
      # is true — the attest step is in hyper-build-native.yml, which physically lives in
      # the shared SkunkWerkx/.github forge, and that job_workflow_ref is what Fulcio
      # records as the build signer. Omit it and every one fails with a bare `verifying with
      # issuer "sigstore.dev"` that reads like a bad signature but is only an identity
      # mismatch. Same flag, same reason as stage-native-binaries.yml's gate.
      - name: Verify build provenance of every binary about to be packed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in artifacts/native/native-*/* artifacts/ruby-native/ruby-native-*/* \
                   artifacts/ruby-wasm/ruby-wasm-*/*; do
            echo "::group::verify $f"
            if ! gh attestation verify "$f" \
                 --repo "$GITHUB_REPOSITORY" --signer-repo SkunkWerkx/.github \
                 --source-digest "${{ needs.find-ci-run.outputs.source_sha }}"; then
              echo "::error::No valid build provenance for $f — refusing to publish a gem containing it."
              exit 1
            fi
            echo "::endgroup::"
          done

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby

      - name: Build the universal "ruby" platform gem (pure Fiddle, all 8 native libraries bundled)
        working-directory: ruby
        shell: bash
        run: |
          set -euo pipefail
          declare -A LIB_NAMES=(
            [linux-x64]=libhyperuuid.so
            [linux-arm64]=libhyperuuid.so
            [linux-musl-x64]=libhyperuuid.so
            [linux-musl-arm64]=libhyperuuid.so
            [osx-x64]=libhyperuuid.dylib
            [osx-arm64]=libhyperuuid.dylib
            [win-x64]=hyperuuid.dll
            [win-arm64]=hyperuuid.dll
          )
          for rid in "${!LIB_NAMES[@]}"; do
            dest="lib/hyperuuid/native/$rid"
            mkdir -p "$dest"
            cp "../artifacts/native/native-$rid/${LIB_NAMES[$rid]}" "$dest/"
          done
          bundle exec rake build

      - name: Build precompiled platform gems (Magnus)
        working-directory: ruby
        shell: bash
        run: |
          set -euo pipefail
          # Both Windows RIDs map to RubyInstaller's own platform strings, and the `ext=so`
          # default below is already right for both — mingw Ruby's DLEXT is `so`, not `dll`,
          # on either architecture. Every RID named here must have a matching ruby-native-*
          # artifact from the forge or this loop fails at the `cp`, which is the intended
          # failure: a missing extension should stop the release, not silently ship a gem
          # that claims a platform it has no code for.
          #
          # Seven RIDs, one gem each: every one but osx-x64, which has no platform gem — an
          # Intel Mac installs the universal gem and runs on Fiddle, the price of not keeping
          # an Intel runner job for a platform Apple is retiring. The musl extensions come from
          # the forge's musl job (built in each Ruby's Alpine image), under the same
          # ruby-native-{rid}-{abi} names as every other leg.
          #
          # The glibc gems are `-linux-gnu`, not plain `-linux`. RubyGems before 4.0 (Ruby 3.4's
          # 3.6) matches a plain `x86_64-linux` gem on Alpine ahead of `x86_64-linux-musl` —
          # even under `gem install --platform x86_64-linux-musl` — which now that platform
          # gems carry no Fiddle library would be a gem that cannot load. Naming the libc on
          # both sides is what makes every supported RubyGems and Bundler pick right; Nokogiri
          # names its gems the same way for the same reason.
          #
          # All eight libraries the universal gem's step staged are still under
          # lib/hyperuuid/native/ here; native:gem leaves every one of them out of a platform
          # gem, which carries its Magnus extensions and nothing else native. The check after
          # the loop holds it to that.
          declare -A PLATFORMS=(
            [linux-x64]=x86_64-linux-gnu
            [linux-arm64]=aarch64-linux-gnu
            [linux-musl-x64]=x86_64-linux-musl
            [linux-musl-arm64]=aarch64-linux-musl
            [osx-arm64]=arm64-darwin
            [win-x64]=x64-mingw-ucrt
            [win-arm64]=aarch64-mingw-ucrt
          )
          # One extension per Ruby ABI per platform — a Magnus extension is bound to a single
          # Ruby minor, so a platform gem has to be "fat" to cover more than one. Keep this
          # list in step with ruby/Rakefile's ABIS and the forge's per-ABI Ruby trios; the
          # rake task aborts naming the missing file if they drift apart.
          ABIS=(3.4 4.0)
          for rid in "${!PLATFORMS[@]}"; do
            ext=so
            [[ "$rid" == osx-* ]] && ext=bundle
            for abi in "${ABIS[@]}"; do
              mkdir -p "lib/hyperuuid/$abi"
              cp "../artifacts/ruby-native/ruby-native-$rid-$abi/hyperuuid_native.$ext" \
                 "lib/hyperuuid/$abi/hyperuuid_native.$ext"
            done
            bundle exec rake "native:gem[${PLATFORMS[$rid]}]"
            for abi in "${ABIS[@]}"; do rm -rf "lib/hyperuuid/$abi"; done
          done

          # Seven platform gems, each with its two extensions and no Fiddle library — and the
          # universal gem with all eight libraries. A drift in the Rakefile or the gemspec
          # glob fails the release here instead of shipping the wrong contents.
          platform_gems=(pkg/*-*-*.gem)
          [ "${#platform_gems[@]}" -eq "${#PLATFORMS[@]}" ] \
            || { echo "::error::expected ${#PLATFORMS[@]} platform gems in pkg/, found: $(ls pkg)"; exit 1; }
          for gem in pkg/*.gem; do
            files=$(tar -xOf "$gem" data.tar.gz | tar -tzf -)
            natives=$(grep -c '^lib/hyperuuid/native/' <<<"$files" || true)
            exts=$(grep -c '/hyperuuid_native\.' <<<"$files" || true)
            echo "$gem: $natives Fiddle libraries, $exts Magnus extensions"
            # hyperuuid-X.Y.Z.gem is the universal one; a platform gem's name adds -<platform>.
            want="0 ${#ABIS[@]}"
            [[ "$(basename "$gem" .gem)" == *-*-* ]] || want="8 0"
            [ "$natives $exts" = "$want" ] \
              || { echo "::error::$gem carries $natives Fiddle libraries and $exts extensions; expected $want"; exit 1; }
          done


      # The ruby.wasm companion gem: the same lib/ with no fiddle, the extconf rbwasm runs, and
      # one wasm32-wasip1 archive per Ruby minor, gzipped. Packed last so the platform gems'
      # count above never sees it. Keep ABIS in step with the forge's ruby_wasm_abis default
      # and ruby/Rakefile's ABIS; the rake task aborts naming the missing file otherwise.
      - name: Build the ruby.wasm companion gem (hyperuuid-wasm)
        working-directory: ruby
        shell: bash
        run: |
          set -euo pipefail
          ABIS=(3.4 4.0)
          for abi in "${ABIS[@]}"; do
            mkdir -p "ext/hyperuuid_native/$abi"
            cp "../artifacts/ruby-wasm/ruby-wasm-$abi/hyperuuid_native.a" "ext/hyperuuid_native/$abi/"
          done
          bundle exec rake wasm:gem
          gem=(pkg/hyperuuid-wasm-*.gem)
          files=$(tar -xOf "${gem[0]}" data.tar.gz | tar -tzf -)
          echo "$files"
          archives=$(grep -c '^ext/hyperuuid_native/[0-9.]*/hyperuuid_native\.a\.gz$' <<<"$files" || true)
          natives=$(grep -c '^lib/hyperuuid/native/' <<<"$files" || true)
          [ "$archives $natives" = "${#ABIS[@]} 0" ] && grep -qx 'ext/hyperuuid_native/extconf.rb' <<<"$files" \
            || { echo "::error::${gem[0]} carries $archives archives and $natives Fiddle libraries; expected ${#ABIS[@]} and 0, plus the extconf"; exit 1; }

      # Attested BEFORE the push, over ruby/pkg/*.gem — these exact files are what `gem
      # push` uploads, with no repack in between, so the attested digest is the published
      # digest. Ordering it first is the whole point: a failure here stops the release
      # while it is still reversible, unlike NuGet, where nuget.org rewrites the package
      # and forces a second attestation after an irreversible push.
      #
      # No --signer-repo when verifying: this signing step lives in this repo's own
      # release.yml, so Fulcio records one identity for source and signer alike.
      #
      #     gh attestation verify <gem>-<version>[-<platform>].gem --repo <owner>/<repo>
      - name: Attest the built gems
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ruby/pkg/*.gem

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby-packages
          path: ruby/pkg/*.gem
          if-no-files-found: error
          retention-days: 90

  pypi-pack:
    needs: find-ci-run
    if: inputs.prepared_run_id == ''
    runs-on: ubuntu-26.04
    permissions:
      # A permissions block sets every unlisted scope to none, so contents is spelled out
      # for checkout. id-token is PyPI Trusted Publishing; attestations: read is what
      # `gh attestation verify` below needs.
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi-wheels-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      # The last moment these files can still be rejected: a PyPI upload is permanent, and
      # nothing below rebuilds what was downloaded. Three things are held, each a way a
      # release could otherwise go out wrong with every job green: all 25 wheels are
      # here (a missing artifact would publish a release with a platform silently absent),
      # every one is named for the version being released, and every one carries build
      # provenance from that ci.yml run.
      #
      # --signer-repo is not optional, for the same reason as the gem gate above: the
      # attest step is in hyper-build-wheels.yml, which lives in the SkunkWerkx/.github
      # forge, and that is what Fulcio records as the build signer.
      - name: Verify the wheels about to be published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          ls -l dist
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 25 ]; then
            echo "::error::Expected 25 wheels from ci.yml run ${{ needs.find-ci-run.outputs.run_id }}, found ${#wheels[@]}."
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            case "$(basename "$wheel")" in
              hyperuuid-"$want"-*) ;;
              *) echo "::error::$wheel is not a hyperuuid $want wheel — refusing to publish it."; exit 1 ;;
            esac
            echo "::group::verify $wheel"
            if ! gh attestation verify "$wheel" \
                 --repo "$GITHUB_REPOSITORY" --signer-repo SkunkWerkx/.github \
                 --source-digest "${{ needs.find-ci-run.outputs.source_sha }}"; then
              echo "::error::No valid build provenance for $wheel — refusing to publish it."
              exit 1
            fi
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-packages
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 90

  publication-gate:
    needs: [find-ci-run, nuget-org-pack, ruby-pack, pypi-pack, crate-pack, maven-pack]
    if: >-
      always() && !cancelled() && needs.find-ci-run.result == 'success' &&
      (inputs.prepared_run_id != '' ||
       (needs.nuget-org-pack.result == 'success' && needs.ruby-pack.result == 'success' &&
        needs.pypi-pack.result == 'success' && needs.crate-pack.result == 'success' &&
        needs.maven-pack.result == 'success'))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CRATE: hyperuuid
      VERSION: ${{ needs.find-ci-run.outputs.version }}
      SOURCE_SHA: ${{ needs.find-ci-run.outputs.source_sha }}
      STAGING_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ needs.find-ci-run.outputs.run_id }}
      PACKAGE_RUN_ID: ${{ github.run_id }}
      FORGE_SHA: ${{ needs.find-ci-run.outputs.forge_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id == ''
        with:
          name: nuget-org-package
          path: release-packages/nuget
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id == ''
        with:
          name: ruby-packages
          path: release-packages/ruby
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id == ''
        with:
          name: pypi-packages
          path: release-packages/pypi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id == ''
        with:
          name: crate-package
          path: release-packages/crate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id == ''
        with:
          name: maven-central-package
          path: release-packages/maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id != ''
        with:
          name: release-packages
          path: release-packages
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}

      - name: Verify every final package and create the source/run inventory
        if: inputs.prepared_run_id == ''
        run: python3 .hyperforge/.github/scripts/release_inventory.py create

      - name: Attest the complete package inventory
        if: inputs.prepared_run_id == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-packages/inventory.json

      - name: Revalidate complete preserved bytes and every provenance source
        # Fresh files were individually verified by create above; a recovery
        # rechecks every file's attestation as well as the signed inventory.
        run: python3 .hyperforge/.github/scripts/release_inventory.py verify ${{ inputs.prepared_run_id == '' && '--inventory-only' || '' }}

      - name: Preserve the complete verified release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: release-packages
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-crate-package
          path: release-packages/crate
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-maven-central-package
          path: release-packages/maven
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  nuget-org-publish:
    needs: [find-ci-run, publication-gate]
    if: >-
      !cancelled() && needs.find-ci-run.result == 'success' &&
      needs.publication-gate.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CRATE: hyperuuid
      VERSION: ${{ needs.find-ci-run.outputs.version }}
      SOURCE_SHA: ${{ needs.find-ci-run.outputs.source_sha }}
      STAGING_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ needs.find-ci-run.outputs.run_id }}
      PACKAGE_RUN_ID: ${{ github.run_id }}
      FORGE_SHA: ${{ needs.find-ci-run.outputs.forge_sha }}
      PUBLICATION_RUN_ID: ${{ inputs.publication_run_id || inputs.prepared_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.find-ci-run.outputs.forge_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-packages

      - name: Recheck the immutable inventory before authentication
        run: python3 .hyperforge/.github/scripts/release_inventory.py verify --registry nuget

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Reconcile existing NuGet publication
        id: pending
        run: python3 .hyperforge/.github/scripts/release_inventory.py registry-plan --registry nuget --output pending-nuget

      - name: NuGet login (OIDC)
        if: steps.pending.outputs.pending == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHER_USER }}

      - name: Publish the preserved package and symbols
        if: steps.pending.outputs.pending == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "pending-nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: Record accepted package and symbols
        if: steps.pending.outputs.pending == 'true'
        run: python3 .hyperforge/.github/scripts/release_inventory.py nuget-receipt --output nuget-receipt

      - name: Attest successful NuGet receipt
        if: steps.pending.outputs.pending == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nuget-receipt/receipt.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pending.outputs.pending == 'true'
        with:
          name: nuget-publication-receipt
          path: nuget-receipt
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Verify the finalized repository-signed package
        run: python3 .hyperforge/.github/scripts/release_inventory.py nuget-finalized

      - name: Attest the finalized served package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nuget-finalized/*.nupkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-finalized-package
          path: nuget-finalized
          if-no-files-found: error
          retention-days: 90
          overwrite: true

