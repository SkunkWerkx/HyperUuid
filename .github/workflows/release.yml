name: Release — publish to real, public registries

# PR -> ci (see ci.yml), tag -> release: this file is the only place a real, permanent,
# public publish can happen. workflow_dispatch stays enabled for now specifically because
# Trusted Publishing has no local test path at all (the OIDC exchange only exists inside an
# Actions runner) — it's the only way to prove a leg works before composing every binding
# together under a real v0.1.0 tag. Once every leg is proven, workflow_dispatch comes off
# this file entirely so a public publish can only ever happen from a deliberate tag push,
# never a manual button press — see the pack-crates comment below for why that matters.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: >-
          Skip the ci.yml lookup and use this already-green run's artifacts directly. For a
          workflow_dispatch-only fix that never touches anything ci.yml itself builds/tests
          (a publish-job YAML typo, an action version pin, etc.) — re-running the full ~80min
          matrix to re-prove code that didn't change is real waste, not real verification.
          Never used for an actual tag push (tags always go through the real lookup below).
        required: false
        type: string

jobs:
  # This job is the only "build" this file does at all. ci.yml already built and packed
  # everything real (native legs, wasm, PyPI wheels, the NuGet .nupkg) — a tag push just
  # needs to find that run. Every job below this one is authenticate -> download that run's
  # already-packed artifact -> publish, nothing more. Also the correctness gate the old
  # per-leg `needs:` comments used to describe: no successful ci.yml run for this SHA means
  # nothing downstream proceeds.
  #
  # ci.yml packs every real artifact (PyPI wheels, the NuGet .nupkg, the RubyGems platform
  # gems) on every run it does, PR included — so the commit being tagged just needs its own
  # prior green ci.yml run, which its own pull_request run already is in the normal case; no
  # separate pre-release dispatch step. ci.yml has no push trigger of its own (master is
  # branch-protected, and a stray push-to-master run rebuilding/repacking on every trivial
  # change, docs included, wasn't worth it) — if the commit being tagged genuinely has no
  # green ci.yml run yet (e.g. tagging straight off master after a squash-merge changed the
  # SHA), dispatch one by hand first:
  #   gh workflow run ci.yml --repo SkunkWerkx/HyperUuid --ref <branch-or-sha>
  # then wait for it to go green before pushing the tag. Skip that and this job fails fast
  # below rather than silently rebuilding.
  find-ci-run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find ci.yml's run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID_OVERRIDE: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$CI_RUN_ID_OVERRIDE" ]; then
            echo "::notice::Using explicit ci_run_id override ($CI_RUN_ID_OVERRIDE) — skipping the ci.yml lookup for this commit." >&2
            echo "run_id=$CI_RUN_ID_OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful ci.yml run found for $GITHUB_SHA — normally the commit's own PR already has one; if not, dispatch ci.yml by hand against the ref you're tagging (gh workflow run ci.yml --ref <branch-or-sha>) and let it go green before tagging." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  # No pack job here at all — ci.yml already packed the .nupkg. This job is purely
  # auth -> download that artifact -> push. (There was previously a standalone
  # nuget-org-login job here too, but nothing ever depended on it — this job's own login
  # step below already does a fresh OIDC exchange, so the extra job was dead weight and got
  # removed rather than un-paused into a no-op.)
  #
  # Live again for the coordinated v0.1.0 release. NuGet rejects a duplicate-version
  # republish outright (no --skip-duplicate flag on nuget-org-publish's own push step below
  # would save it — that only covers a race against itself, not an already-published
  # version), so this only actually works once HyperUuid.csproj's <Version> is bumped past
  # the already-published 0.0.6 — a real prerequisite, not automatic just because this gate
  # is gone.
  nuget-org-publish:
    needs: find-ci-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v8
        with:
          name: nuget-org-package
          path: nupkg-org
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHER_USER }}

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "nupkg-org/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

  # Ruby leg: hyperuuid.gemspec bumped to the real 0.0.1 — proving RubyGems Trusted
  # Publishing (OIDC) for real, same as every other registry's own first real publish, ahead
  # of the coordinated v0.1.0 release. No pack job here either — ci.yml's ruby-pack-gems
  # already built the real universal ("ruby" platform, pure Fiddle) gem plus 4 precompiled
  # Magnus platform gems (linux-x64/arm64, osx-x64/arm64); this job is purely auth -> download
  # -> push all 5. Deliberately NOT rubygems/release-gem@v1 — that action always builds (and
  # pushes) exactly one gem itself via `bundle exec rake release`, which doesn't fit "publish
  # 5 already-built gem files from a separate job"; configure-rubygems-credentials is the same
  # OIDC exchange release-gem uses internally, called directly so a plain `gem push` per file
  # picks up the resulting credentials.
  rubygems-publish:
    needs: find-ci-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v8
        with:
          name: rubygems-packages
          path: pkg
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: rubygems/configure-rubygems-credentials@main

      - name: Publish to rubygems.org
        run: |
          set -euo pipefail
          for gem in pkg/*.gem; do
            gem push "$gem"
          done

  # PyPI leg: real multi-platform PyO3 native wheels from day one, no ctypes fallback and no
  # throwaway single-wheel version. abi3-py39 collapses the matrix to one wheel per platform
  # (not per Python version), so 6 legs covers every supported CPython 3.9+ on every
  # platform. Built in ci.yml's own push-to-master run, not here — this job is purely
  # auth -> download -> publish.
  #
  # Live again for the coordinated v0.1.0 release. PyPI has no --skip-duplicate — a
  # duplicate-version push is a guaranteed hard rejection — so this only actually works once
  # python/pyproject.toml's version is bumped past the already-published 0.0.2, a real
  # prerequisite, not automatic just because this gate is gone.
  pypi-publish:
    needs: find-ci-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-wheels-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Publishes the rust/ core crate to crates.io — source only, no native artifact needed,
  # so this doesn't depend on find-ci-run the way nuget-org-pack does.
  #
  # Live again for the coordinated v0.1.0 release. cargo publish has no duplicate-version
  # skip either — a hard failure — so this only actually works once rust/Cargo.toml's
  # version is bumped past the already-published 0.0.2 (and Cargo.lock regenerated to match
  # — cargo publish --locked fails on a stale self-referential lock entry), a real
  # prerequisite, not automatic just because this gate is gone.
  pack-crates:
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-crate.yml@master
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Java leg: build.gradle.kts bumped to the real 0.0.1 — proving the Maven Central Publisher
  # Portal token + in-memory GPG signing path for real, same as every other registry's own
  # first real publish, ahead of the coordinated v0.1.0 release.
  #
  # Live again for the coordinated v0.1.0 release. Maven Central rejects a duplicate-version
  # republish outright (no --skip-duplicate), so this only actually works once
  # java/build.gradle.kts's committed version is bumped past the already-published
  # io.github.skunkwerkx:hyperuuid:0.0.1, a real prerequisite, not automatic just because
  # this gate is gone.
  maven-publish:
    needs: find-ci-run
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-maven.yml@master
    with:
      crate: hyperuuid
      java_resources_dir: java/src/main/resources/native
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
