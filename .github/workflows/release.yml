name: Release — publish to real, public registries

# PR -> ci (see ci.yml), tag -> release: this file is the only place a real, permanent,
# public publish can happen. workflow_dispatch stays enabled for now specifically because
# Trusted Publishing has no local test path at all (the OIDC exchange only exists inside an
# Actions runner) — it's the only way to prove a leg works before composing every binding
# together under a real v0.1.0 tag. Once every leg is proven, workflow_dispatch comes off
# this file entirely so a public publish can only ever happen from a deliberate tag push,
# never a manual button press — see the pack-crates comment below for why that matters.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: >-
          Skip the ci.yml lookup and use this already-green run's artifacts directly. For a
          workflow_dispatch-only fix that never touches anything ci.yml itself builds/tests
          (a publish-job YAML typo, an action version pin, etc.) — re-running the full ~80min
          matrix to re-prove code that didn't change is real waste, not real verification.
          Never used for an actual tag push (tags always go through the real lookup below).
        required: false
        type: string

jobs:
  # ci.yml builds and tests every native leg and uploads the reusable, version-agnostic
  # outputs (plain FFI libs, the Magnus extension) — but never anything that bakes a version
  # into itself (a .nupkg, a .gem, a wheel). This job locates that ci.yml run so every
  # publish job below can pull those reusable artifacts from it; the actual version-sensitive
  # packing (NuGet, RubyGems, PyPI) happens fresh, later in this same file, once the tag
  # makes the real version knowable.
  #
  # The tagged commit is essentially never the exact commit ci.yml last ran against — a
  # "prepare release" version-bump commit and/or stage-native-binaries.yml's own binary-
  # refresh commit typically sit on top of it, both deliberately silent direct pushes with
  # no ci.yml run of their own (ci.yml has no push trigger at all). Neither commit changes
  # anything a registry publish reads from a *built* artifact — a version bump changes
  # manifest text a fresh `cargo publish`/`gradlew publish`/`dotnet pack`/`gem build`/
  # `maturin build` call reads directly from the tagged checkout, not from ci.yml's own
  # (unavoidably pre-bump) build; a binary-refresh commit only touches php/swift/go, which
  # no registry job below even looks at. So walking back a bounded number of ancestor
  # commits looking for ci.yml's real run is correct here, not a compromise.
  find-ci-run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Find ci.yml's run for this commit or a recent ancestor
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID_OVERRIDE: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$CI_RUN_ID_OVERRIDE" ]; then
            echo "::notice::Using explicit ci_run_id override ($CI_RUN_ID_OVERRIDE) — skipping the ci.yml lookup for this commit." >&2
            echo "run_id=$CI_RUN_ID_OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for sha in $(git log --format=%H -n 10 "$GITHUB_SHA"); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$sha" --status success --json databaseId --jq '.[0].databaseId')
            if [ -n "$run_id" ]; then
              if [ "$sha" = "$GITHUB_SHA" ]; then
                echo "::notice::Using ci.yml run $run_id from the tagged commit itself." >&2
              else
                echo "::notice::Using ci.yml run $run_id from $sha, an ancestor of the tagged commit." >&2
              fi
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No successful ci.yml run found for $GITHUB_SHA or its last 10 ancestors — dispatch ci.yml by hand against the ref you're tagging (gh workflow run ci.yml --ref <branch-or-sha>) and let it go green before tagging." >&2
          exit 1

  # Packs the .nupkg fresh, right now — deliberately not in ci.yml. A .nupkg bakes its
  # version into its own filename/metadata at pack time, and ci.yml runs before any tag
  # exists, so packing there would always mean a wrong version. This reuses find-ci-run's
  # located run purely for the version-agnostic native binaries + wasm staticlib; the
  # HyperUuid.csproj version it actually packs comes from this tagged checkout directly.
  #
  # NuGet rejects a duplicate-version republish outright (no --skip-duplicate flag on
  # nuget-org-publish's own push step below would save it — that only covers a race against
  # itself, not an already-published version), so this only actually works once
  # HyperUuid.csproj's <Version> is bumped past whatever's already published — a real
  # prerequisite "prepare release" is responsible for, not automatic just because this job
  # runs.
  nuget-org-pack:
    needs: find-ci-run
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-nuget.yml@master
    # attest-build-provenance signs with an OIDC token and records the result; a reusable
    # workflow can never escalate beyond what its caller granted, so these scopes come from here.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      csproj_path: csharp/HyperUuid/HyperUuid.csproj
      runtimes_dir: csharp/HyperUuid/runtimes
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}

  # No pack step here — nuget-org-pack (above) already produced the .nupkg, in this same
  # release.yml run. This job is purely auth -> download that artifact -> push. (There was
  # previously a standalone nuget-org-login job here too, but nothing ever depended on it —
  # this job's own login step below already does a fresh OIDC exchange, so the extra job was
  # dead weight and got removed rather than un-paused into a no-op.)
  nuget-org-publish:
    needs: nuget-org-pack
    runs-on: ubuntu-latest
    permissions:
      # id-token covers both OIDC exchanges this job makes: nuget.org Trusted Publishing for
      # the push, and attest-build-provenance's signing identity for the post-publish
      # attestation below. attestations lets that attestation actually be recorded.
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v8
        with:
          name: nuget-org-package
          path: nupkg-org

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHER_USER }}

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "nupkg-org/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

      # ---- Layer 2: attest the finalized package, after nuget.org has rewritten it ----
      #
      # This cannot happen at pack time. nuget.org applies its own repository signature during
      # validation, which changes the .nupkg's bytes — so an attestation over the pre-push file
      # would never match the copy a consumer downloads, and their `gh attestation verify` would
      # fail in a way indistinguishable from tampering. The only package attestation worth
      # publishing is one taken over the exact artifact the feed serves. (Layer 1 is each native
      # library, attested unmodified as it is built, in hyper-build-native.yml.)
      - name: Resolve package id and version from the pushed .nupkg
        id: pkg
        continue-on-error: true
        run: |
          set -euo pipefail
          nupkg=$(ls nupkg-org/*.nupkg | head -1)
          nuspec=$(unzip -Z1 "$nupkg" | grep -m1 '\.nuspec$')
          unzip -p "$nupkg" "$nuspec" > pkg.nuspec
          id=$(sed -n 's:.*<id>\(.*\)</id>.*:\1:p' pkg.nuspec | head -1)
          ver=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pkg.nuspec | head -1)
          if [ -z "$id" ] || [ -z "$ver" ]; then
            echo "::error::Could not read <id>/<version> out of $nuspec"
            exit 1
          fi
          echo "id=$id"                                                   >> "$GITHUB_OUTPUT"
          echo "version=$ver"                                             >> "$GITHUB_OUTPUT"
          echo "lower_id=$(echo "$id" | tr '[:upper:]' '[:lower:]')"       >> "$GITHUB_OUTPUT"
          echo "lower_version=$(echo "$ver" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "pre_push_sha256=$(sha256sum "$nupkg" | cut -d" " -f1)"     >> "$GITHUB_OUTPUT"

      # Validation (including the repository signing that mutates the file) completes before
      # the flat container will serve the package, so a 200 here means the finalized artifact.
      # Non-fatal, all three: the push above is irreversible, and the pre-push attestation
      # from hyper-pack-nuget.yml already gives consumers a working verification route. A slow
      # nuget.org validation must not turn a successful publish into a red release.
      - name: Download the finalized package back from nuget.org
        continue-on-error: true
        env:
          LOWER_ID: ${{ steps.pkg.outputs.lower_id }}
          LOWER_VERSION: ${{ steps.pkg.outputs.lower_version }}
          FINAL_NAME: ${{ steps.pkg.outputs.id }}.${{ steps.pkg.outputs.version }}.nupkg
        run: |
          set -uo pipefail
          url="https://api.nuget.org/v3-flatcontainer/$LOWER_ID/$LOWER_VERSION/$LOWER_ID.$LOWER_VERSION.nupkg"
          echo "Polling $url"
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o "$FINAL_NAME" -w '%{http_code}' -L "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Finalized package available after $attempt attempt(s)."
              exit 0
            fi
            echo "attempt $attempt: HTTP $code — nuget.org validation still running, retrying in 20s"
            sleep 20
          done
          echo "::error::$url never became available within 20 minutes; validation may still be in progress."
          exit 1

      # Prints both digests so the run itself records *why* layer 2 exists: these two values
      # are expected to differ, and that difference is the repository signature.
      - name: Show the pre-push vs published digests
        continue-on-error: true
        env:
          FINAL_NAME: ${{ steps.pkg.outputs.id }}.${{ steps.pkg.outputs.version }}.nupkg
          PRE_PUSH: ${{ steps.pkg.outputs.pre_push_sha256 }}
        run: |
          set -uo pipefail
          published=$(sha256sum "$FINAL_NAME" | cut -d' ' -f1)

          # nuget.org's repository signature is a single added zip entry (.signature.p7s).
          # Stripping it should reproduce the pre-push digest exactly — which is what makes the
          # pre-push attestation verifiable by a consumer. Prove that here rather than asserting
          # it in a README, so a change in nuget.org's behaviour shows up as a failed claim.
          cp "$FINAL_NAME" stripped.nupkg
          zip -d stripped.nupkg .signature.p7s >/dev/null 2>&1 || true
          stripped=$(sha256sum stripped.nupkg | cut -d' ' -f1)

          {
            echo "### NuGet package attestation"
            echo ""
            echo "| artifact | sha256 | attested by |"
            echo "| --- | --- | --- |"
            echo "| packed, pre-push | \`$PRE_PUSH\` | hyper-pack-nuget.yml |"
            echo "| published (repository-signed) | \`$published\` | this job |"
            echo "| published, .signature.p7s removed | \`$stripped\` | — |"
            echo ""
            if [ "$PRE_PUSH" = "$published" ]; then
              echo "Published bytes are unchanged — nuget.org did not rewrite this package."
            elif [ "$PRE_PUSH" = "$stripped" ]; then
              echo "Confirmed: the only difference is nuget.org's added \`.signature.p7s\` entry."
              echo "Both attestations are therefore usable —"
              echo "verify the downloaded package directly, or \`zip -d <pkg> .signature.p7s\` first"
              echo "to check it against the pre-push attestation."
            else
              echo "::warning::Stripping .signature.p7s did NOT reproduce the pre-push digest."
              echo "nuget.org may have changed how it finalizes packages; the pre-push attestation"
              echo "can no longer be recovered by removing that entry. The published-bytes"
              echo "attestation from this job is unaffected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the published package
        continue-on-error: true
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pkg.outputs.id }}.${{ steps.pkg.outputs.version }}.nupkg

  # Ruby leg: builds the gems fresh, right here — deliberately not in ci.yml. A .gem bakes
  # its version into its own filename/metadata at build time, and ci.yml runs before any tag
  # exists, so building it there would always mean a wrong version. Reuses find-ci-run's
  # located run purely for the version-agnostic native binaries (Fiddle fallback) + Magnus
  # extension; the gemspec version it actually builds against comes from this tagged
  # checkout directly. Deliberately NOT rubygems/release-gem@v1 — that action always builds
  # (and pushes) exactly one gem itself via `bundle exec rake release`, which doesn't fit
  # "build and publish 5 gems in one job"; configure-rubygems-credentials is the same OIDC
  # exchange release-gem uses internally, called directly so a plain `gem push` per file
  # picks up the resulting credentials.
  #
  # RubyGems rejects a duplicate-version republish outright (no --skip-duplicate on `gem
  # push`), so this only actually works once hyperuuid.gemspec's version is bumped past
  # whatever's already published — a real prerequisite "prepare release" is responsible for.
  rubygems-publish:
    needs: find-ci-run
    runs-on: ubuntu-latest
    permissions:
      # Explicit, so checkout keeps working if this repo ever stops being public — a
      # permissions block sets every unlisted scope to none.
      contents: read
      id-token: write
      # read: gh attestation verify checks every downloaded binary before it is packed.
      # write: the gems built from them are themselves attested below.
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: false
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v8
        with:
          pattern: ruby-native-*
          path: artifacts/ruby-native
          merge-multiple: false
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      # The wasm32-wasip1 module rides in every gem beside the six native libraries: the
      # universal gem's third backend (wasmtime, when the platform has no Fiddle library or
      # HYPERUUID_WASM=1 asks for it) and the same fallback inside each platform gem.
      - uses: actions/download-artifact@v8
        with:
          name: wasm-wasip1-module
          path: artifacts/wasm-wasip1-module
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      # Nothing downloaded above is inspectable, and nothing here gets rebuilt — the six
      # plain FFI libs go verbatim into the universal "ruby" platform gem and each Magnus
      # extension goes verbatim into its own precompiled platform gem — so `gem push` is
      # the last moment these bytes can still be rejected, and it is irreversible
      # (RubyGems has no unpublish and no duplicate-version overwrite). ci.yml attested all
      # ten at build time via hyper-build-native.yml; this is the gate that actually spends
      # those attestations instead of just producing them.
      #
      # --signer-repo is not optional. `--repo X` alone asserts BOTH that the artifact's
      # source repo is X and that the workflow which signed it lives in X. Only the first
      # is true — the attest step is in hyper-build-native.yml, which physically lives in
      # the shared SkunkWerkx/.github forge, and that job_workflow_ref is what Fulcio
      # records as the build signer. Omit it and all ten fail with a bare `verifying with
      # issuer "sigstore.dev"` that reads like a bad signature but is only an identity
      # mismatch. Same flag, same reason as stage-native-binaries.yml's gate.
      - name: Verify build provenance of every binary about to be packed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in artifacts/native/native-*/* artifacts/ruby-native/ruby-native-*/* artifacts/wasm-wasip1-module/*; do
            echo "::group::verify $f"
            if ! gh attestation verify "$f" \
                 --repo "$GITHUB_REPOSITORY" --signer-repo SkunkWerkx/.github; then
              echo "::error::No valid build provenance for $f — refusing to publish a gem containing it."
              exit 1
            fi
            echo "::endgroup::"
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby

      - name: Build the universal "ruby" platform gem (pure Fiddle, all 6 platforms bundled)
        working-directory: ruby
        shell: bash
        run: |
          set -euo pipefail
          declare -A LIB_NAMES=(
            [linux-x64]=libhyperuuid.so
            [linux-arm64]=libhyperuuid.so
            [osx-x64]=libhyperuuid.dylib
            [osx-arm64]=libhyperuuid.dylib
            [win-x64]=hyperuuid.dll
            [win-arm64]=hyperuuid.dll
          )
          for rid in "${!LIB_NAMES[@]}"; do
            dest="lib/hyperuuid/native/$rid"
            mkdir -p "$dest"
            cp "../artifacts/native/native-$rid/${LIB_NAMES[$rid]}" "$dest/"
          done
          mkdir -p lib/hyperuuid/native/wasm32-wasip1
          cp ../artifacts/wasm-wasip1-module/hyperuuid.wasm lib/hyperuuid/native/wasm32-wasip1/
          bundle exec rake build

      - name: Build precompiled platform gems (Magnus)
        working-directory: ruby
        shell: bash
        run: |
          set -euo pipefail
          # Both Windows RIDs map to RubyInstaller's own platform strings, and the `ext=so`
          # default below is already right for both — mingw Ruby's DLEXT is `so`, not `dll`,
          # on either architecture. Every RID named here must have a matching ruby-native-*
          # artifact from the forge or this loop fails at the `cp`, which is the intended
          # failure: a missing extension should stop the release, not silently ship a gem
          # that claims a platform it has no code for.
          declare -A PLATFORMS=(
            [linux-x64]=x86_64-linux
            [linux-arm64]=aarch64-linux
            [osx-x64]=x86_64-darwin
            [osx-arm64]=arm64-darwin
            [win-x64]=x64-mingw-ucrt
            [win-arm64]=aarch64-mingw-ucrt
          )
          # One extension per Ruby ABI per platform — a Magnus extension is bound to a single
          # Ruby minor, so a platform gem has to be "fat" to cover more than one. Keep this
          # list in step with ruby/Rakefile's ABIS and the forge's per-ABI Ruby trios; the
          # rake task aborts naming the missing file if they drift apart.
          ABIS=(3.4 4.0)
          for rid in "${!PLATFORMS[@]}"; do
            ext=so
            [[ "$rid" == osx-* ]] && ext=bundle
            for abi in "${ABIS[@]}"; do
              mkdir -p "lib/hyperuuid/$abi"
              cp "../artifacts/ruby-native/ruby-native-$rid-$abi/hyperuuid_native.$ext" \
                 "lib/hyperuuid/$abi/hyperuuid_native.$ext"
            done
            bundle exec rake "native:gem[${PLATFORMS[$rid]}]"
            for abi in "${ABIS[@]}"; do rm -rf "lib/hyperuuid/$abi"; done
          done


      # Attested BEFORE the push, over ruby/pkg/*.gem — these exact files are what `gem
      # push` uploads, with no repack in between, so the attested digest is the published
      # digest. Ordering it first is the whole point: a failure here stops the release
      # while it is still reversible, unlike NuGet, where nuget.org rewrites the package
      # and forces a second attestation after an irreversible push.
      #
      # No --signer-repo when verifying: this signing step lives in this repo's own
      # release.yml, so Fulcio records one identity for source and signer alike.
      #
      #     gh attestation verify <gem>-<version>[-<platform>].gem --repo <owner>/<repo>
      - name: Attest the built gems
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ruby/pkg/*.gem

      - uses: rubygems/configure-rubygems-credentials@main

      - name: Publish to rubygems.org
        working-directory: ruby
        run: |
          set -euo pipefail
          for gem in pkg/*.gem; do
            gem push "$gem"
          done

      # Turns "rubygems.org stores an uploaded .gem verbatim" from a reasonable belief into
      # a per-release measurement: re-fetch each gem from the CDN and compare it to the
      # bytes just attested. Non-fatal — the push above is irreversible, and a CDN that has
      # not caught up yet must not turn a good release red — but a genuine mismatch would
      # mean the attestation no longer describes what a consumer downloads, which is worth
      # a loud warning rather than silence.
      - name: Confirm rubygems.org serves the attested bytes
        continue-on-error: true
        working-directory: ruby
        run: |
          set -uo pipefail
          {
            echo "### RubyGems package attestations"
            echo ""
            echo "| gem | attested sha256 | served by rubygems.org |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for gem in pkg/*.gem; do
            name=$(basename "$gem")
            attested=$(sha256sum "$gem" | cut -d' ' -f1)
            served="(not available within 150s)"
            for attempt in $(seq 1 10); do
              if curl -fsSL -o served.gem "https://rubygems.org/downloads/$name"; then
                served=$(sha256sum served.gem | cut -d' ' -f1)
                break
              fi
              sleep 15
            done
            if [ "$attested" = "$served" ]; then
              echo "| \`$name\` | \`$attested\` | identical |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$name\` | \`$attested\` | \`$served\` |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::rubygems.org is not serving the attested bytes for $name."
            fi
          done
          rm -f served.gem

  # PyPI leg: real multi-platform PyO3 native wheels from day one, no ctypes fallback and no
  # throwaway single-wheel version. abi3-py39 collapses the matrix to one wheel per platform
  # (not per Python version), so 6 legs covers every supported CPython 3.9+ on every
  # platform. Built fresh, right here — deliberately not in ci.yml, and unlike every other
  # registry in this file, not reusable from ci.yml's run either: a wheel bakes its version
  # into its own filename and metadata at build time (confirmed directly, not assumed —
  # maturin has no version-override flag), and maturin's PyO3-bindings mode *is* the compile
  # step, there's no "pack an already-built .so into a wheel" mode the way NuGet/RubyGems
  # have. So this is the one registry that pays for a second, small compile — same 6
  # real-hardware legs build-native already uses, just for a wheel instead of a plain test
  # build, and only at actual release time, not on every PR.
  #
  # PyPI has no --skip-duplicate — a duplicate-version push is a guaranteed hard rejection —
  # so this only actually works once python/pyproject.toml's version (dynamic, sourced from
  # rust/Cargo.toml) is bumped past whatever's already published, a real prerequisite
  # "prepare release" is responsible for.
  pypi-build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-26-intel
            rid: osx-x64
            target: x86_64-apple-darwin
            manylinux: ""
          - os: macos-latest
            rid: osx-arm64
            target: aarch64-apple-darwin
            manylinux: ""
          - os: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
            manylinux: ""
          - os: windows-11-arm
            rid: win-arm64
            target: aarch64-pc-windows-msvc
            manylinux: ""
    runs-on: ${{ matrix.os }}
    # attest-build-provenance mints an OIDC token to sign with and records the result.
    # A permissions block sets every unlisted scope to none, so contents has to be spelled
    # out too for checkout.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      # The wheel's wasmtime backend module, built here from the same tagged checkout the
      # wheel itself is built from (this leg never reuses ci.yml's artifacts, see above), so
      # the two halves of one wheel come from one source tree. From inside rust/, where cargo
      # reads the crate's .cargo/config.toml export flags.
      - name: Build wasm32-wasip1 module
        working-directory: rust
        run: cargo build --release --target wasm32-wasip1

      - name: Stage wasm32-wasip1 module into the package
        shell: bash
        run: |
          mkdir -p python/src/hyperuuid/native/wasm32-wasip1
          cp rust/target/wasm32-wasip1/release/hyperuuid.wasm python/src/hyperuuid/native/wasm32-wasip1/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux != '' && matrix.manylinux || 'off' }}
          args: --release --out dist

      # Unlike every other artifact in this file, the wheel needs no verification gate
      # anywhere downstream — it is built right here, in this workflow, from this tagged
      # checkout, and pypi-publish consumes it directly. There is nothing to re-verify
      # because nothing was inherited. What it does need is an attestation, for the
      # consumer's sake: `pip download` hands over a wheel with a compiled extension module
      # inside it, and this is the only compiled artifact in the repo that a consumer
      # receives sealed inside the package rather than as a file of its own.
      #
      # This does not duplicate what pypi-publish already does. gh-action-pypi-publish
      # emits PEP 740 attestations, which live on PyPI and are checked by PyPI-side
      # tooling; this is a GitHub/Sigstore build-provenance attestation in the transparency
      # log, checked with `gh attestation verify` — the same route every other artifact
      # here uses, so one command covers the whole repo instead of two per ecosystem.
      #
      # Note the verifying command has no --signer-repo, and that is not an oversight. The
      # signing step is right here in this repo's own release.yml, so Fulcio records this
      # repo as both source and build signer — the two halves agree, unlike everything
      # hyper-build-native.yml signs from the forge:
      #
      #     gh attestation verify <wheel> --repo <owner>/<repo>
      - name: Attest wheel build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: python/dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheels-${{ matrix.rid }}
          path: python/dist/*.whl

  pypi-publish:
    needs: pypi-build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Publishes the rust/ core crate to crates.io — source only, no native artifact needed,
  # so this doesn't depend on find-ci-run the way nuget-org-pack does.
  #
  # Live again for the coordinated v0.1.0 release. cargo publish has no duplicate-version
  # skip either — a hard failure — so this only actually works once rust/Cargo.toml's
  # version is bumped past the already-published 0.0.2 (and Cargo.lock regenerated to match
  # — cargo publish --locked fails on a stale self-referential lock entry), a real
  # prerequisite, not automatic just because this gate is gone.
  pack-crates:
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-crate.yml@master
    # Handed down to the reusable workflow, which attests what it publishes and cannot
    # escalate past what this job was granted.
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Java leg: build.gradle.kts bumped to the real 0.0.1 — proving the Maven Central Publisher
  # Portal token + in-memory GPG signing path for real, same as every other registry's own
  # first real publish, ahead of the coordinated v0.1.0 release.
  #
  # Live again for the coordinated v0.1.0 release. Maven Central rejects a duplicate-version
  # republish outright (no --skip-duplicate), so this only actually works once
  # java/build.gradle.kts's committed version is bumped past the already-published
  # io.github.skunkwerkx:hyperuuid:0.0.1, a real prerequisite, not automatic just because
  # this gate is gone.
  maven-publish:
    needs: find-ci-run
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-maven.yml@master
    # Handed down to the reusable workflow, which attests what it publishes and cannot
    # escalate past what this job was granted.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      java_resources_dir: java/src/main/resources/native
      wasip1_module: true
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
