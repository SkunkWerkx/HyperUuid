name: Release — publish to real, public registries

# PR -> ci (see ci.yml), tag -> release: this file is the only place a real, permanent,
# public publish can happen. workflow_dispatch stays enabled for now specifically because
# Trusted Publishing has no local test path at all (the OIDC exchange only exists inside an
# Actions runner) — it's the only way to prove a leg works before composing every binding
# together under a real v0.1.0 tag. Once every leg is proven, workflow_dispatch comes off
# this file entirely so a public publish can only ever happen from a deliberate tag push,
# never a manual button press — see the pack-crates comment below for why that matters.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    with:
      project: HyperUuid
      crate: hyperuuid
      pure_env: HYPERUUID_PURE
      csharp_test_project: csharp/HyperUuid.Tests/HyperUuid.Tests.csproj
      csharp_runtimes_dir: csharp/HyperUuid/runtimes
      java_resources_dir: java/src/main/resources/native

  # NuGet leg paused while PyPI gets built out — nuget.info flagged a real, unresolved
  # question about whether Deterministic/Compiler Flags survive building HyperUuid.csproj
  # twice (normal + browser-wasm) in the same job sharing one obj/ directory, worth digging
  # into properly rather than half-attention alongside PyPI work. v0.0.2 is already live and
  # unaffected by this pause. Un-gating: flip every if: false below back on together, since
  # they're a connected chain (login -> pack -> publish).
  nuget-org-login:
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHER_USER }}

  build-wasm:
    if: false
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wasm.yml@master
    with:
      crate: hyperuuid

  nuget-org-pack:
    if: false
    needs: [build-native, build-wasm]
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-nuget.yml@master
    with:
      crate: hyperuuid
      csproj_path: csharp/HyperUuid/HyperUuid.csproj
      runtimes_dir: csharp/HyperUuid/runtimes

  nuget-org-publish:
    if: false
    needs: nuget-org-pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v8
        with:
          name: nuget-org-package
          path: nupkg-org

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHER_USER }}

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "nupkg-org/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # PyPI leg: real multi-platform PyO3 native wheels from day one, no ctypes fallback and no
  # throwaway single-wheel version. abi3-py39 collapses the matrix to one wheel per platform
  # (not per Python version), so 6 legs covers every supported CPython 3.9+ on every
  # platform. Source-only (maturin builds straight from rust/Cargo.toml's python feature) —
  # `needs: build-native` is a correctness gate (don't publish untested code), not an
  # artifact dependency. Deliberately independent of the paused NuGet chain above.
  pypi-build-wheels:
    needs: build-native
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wheels.yml@master
    with:
      python_source_dir: python

  pypi-publish:
    needs: pypi-build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Publishes the rust/ core crate to crates.io — source only, no native artifact needed,
  # so this doesn't depend on build-native the way pack-nuget-org does.
  # Disabled: rust/Cargo.toml is still pinned at 0.0.1, already published — a run right now
  # would just burn a job on a guaranteed duplicate-version rejection. Flip back to true
  # once Cargo.toml is bumped past 0.0.1 (its own CI-proving run) or at the real v0.1.0 cut.
  # This is exactly the kind of accidental-trigger this file's workflow_dispatch note above
  # is about: once every leg is proven, removing workflow_dispatch here means a stray manual
  # run can never accidentally attempt this (or any other real publish) at all.
  pack-crates:
    if: false
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-crate.yml@master
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
