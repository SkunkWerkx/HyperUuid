      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-packages

      - name: Verify the final release inventory
        run: python3 .hyperforge/.github/scripts/release_inventory.py verify --inventory-only

      - name: Create or validate the Go tag and GitHub Release at B
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 .hyperforge/.github/scripts/release_inventory.py finalize
