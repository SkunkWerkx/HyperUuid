name: CI — build native, build wasm, test every binding

# The build/test matrix lives in HyperForge (SkunkWerkx/.github) as the canonical Hyper*
# pipeline — 6 real-hardware legs, the Rust core built fresh per leg, every binding's
# suite run against it. Ruby's suite runs twice (forced Fiddle fallback + Magnus extension
# backend); Python has no fallback — PyO3 only, via maturin develop.
#
# CI's job is build, test, and upload reusable artifacts — nothing version-specific. Every
# native leg builds+tests fresh, and the raw, version-agnostic outputs (the plain FFI
# libhyperuuid.so/.dylib/.dll, the compiled Ruby Magnus extension) get uploaded here for
# later reuse. What deliberately does NOT happen here: anything that bakes a version number
# into a shippable package (a PyPI wheel's own filename/metadata, a .nupkg, a .gem) — CI runs
# long before any release tag exists, so there's no correct version to bake in yet. That
# packing happens once, for real, in release.yml, at actual tag time, when the version is
# genuinely known — see release.yml's own header for the full shape (find-ci-run reuses this
# file's version-agnostic artifacts; the version-sensitive packing happens fresh there).
#
# No push trigger, deliberately (not because master is branch-protected — checked via
# `gh api repos/.../branches/master/protection`, it isn't, despite this having been assumed
# here before): a stray run rebuilding/retesting on every trivial direct push (stage-native-
# binaries.yml's own binary-refresh commits included) would just be wasted compute for a
# result nobody's waiting on.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    with:
      project: HyperUuid
      crate: hyperuuid
      pure_env: HYPERUUID_PURE
      # HyperForge's own default (8.0.x) stays put for other repos — HyperUuid.csproj's floor
      # is net10.0 specifically because net8.0's WASM P/Invoke-table generator scans the wrong
      # (non-browser) copy of a multi-RID-asset package, an upstream bug fixed in .NET 10 (see
      # HyperUuid.targets' own comment for the full real-headless-Chromium-verified story).
      dotnet_version: "10.0.x"
      csharp_test_project: csharp/HyperUuid.Tests/HyperUuid.Tests.csproj
      # A jar has no per-platform package selection like NuGet's RID folders, and the
      # csproj's runtimes/**/native wildcard stages at pack time — so both bindings take
      # the pipeline's explicit per-leg placement for in-repo testing.
      csharp_runtimes_dir: csharp/HyperUuid/runtimes
      java_resources_dir: java/src/main/resources/native
      # go_windows stays default-true: the purego fallback carries the Windows legs.

  # C#/NuGet's WASM support isn't optional or spike-only anymore (needed for real, for Norse
  # Architecture), so it's built on every PR too, not just at release time.
  build-wasm:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wasm.yml@master
    with:
      crate: hyperuuid

  # rust/Cargo.toml publishes categories = ["no-std"], and rust/src/lib.rs is #![no_std]
  # whenever its default-on `std` feature is off. `default = ["std"]` means every other cargo
  # invocation in this pipeline compiles the *std* configuration — HyperForge's
  # `cargo build --release`, its `cargo test --release`, and all three `--features` extension
  # builds. Not one of them would notice a `use std::` creeping back into the core (it compiles
  # clean under std — at worst an unused-import warning nothing fails on), or a dependency
  # feature that drags std in, which is the shape this crate was actually in before: it pinned
  # `getrandom`'s `std` feature on unconditionally. Either way the published claim quietly
  # stops being true with the whole matrix green. It was live and false once already, at
  # v0.1.0, which is what this exists to keep from recurring. `--no-default-features` against
  # a real bare-metal target is the only invocation that compiles the other configuration at
  # all — see lib.rs's own comment for why the feature has to stay default-on (the cdylib
  # every binding dlopens needs std's panic handler and allocator).
  #
  # RUSTFLAGS is the HyperUuid-specific part, and the reason this job lives here rather than
  # in HyperForge alongside the shared build matrix: off std there's no OS for `getrandom` to
  # read entropy from, so it compile_error!s unless pointed at a backend the consumer brings.
  # `cargo check` doesn't link, so naming the custom backend is enough on its own — no dummy
  # __getrandom_v03_custom symbol needed to satisfy it.
  #
  # Static analysis only, no native build needed, so this doesn't depend on build-native.
  check-no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - name: cargo check (no_std, bare metal)
        working-directory: rust
        env:
          RUSTFLAGS: --cfg getrandom_backend="custom"
        run: cargo check --no-default-features --target thumbv7em-none-eabi

  # Doc-comment coverage on every real public API surface, every PR — the same bar
  # C#/Java/Rust get from a compiler flag (CS1591+TreatWarningsAsErrors, javadoc -Xwerror,
  # #![deny(missing_docs)]), applied here with the closest per-language equivalent. Each is
  # scoped to the language's own actual public surface, excluding internal FFI plumbing
  # (Runtime/NativePlatform-style helpers) that isn't part of the documented API — the same
  # public/internal boundary those three languages get for free from the compiler. Static
  # analysis only, no native build needed, so these don't depend on build-native.
  lint-docs-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # go-version-file only tells setup-go where to read the Go version from — its
          # built-in module cache separately needs cache-dependency-path pointed at go.sum,
          # or it searches the repo root by default and finds nothing (go.mod/go.sum both
          # live under go/, not the root) — real "Restore cache failed" warning otherwise.
          cache-dependency-path: go/go.sum
      - run: go install github.com/mgechev/revive@v1.16.0
      - working-directory: go
        run: revive -config revive.toml ./...

  lint-docs-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.5
      - working-directory: python
        run: ruff check src

  lint-docs-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ffi
      - working-directory: php
        run: composer install --no-progress --prefer-dist
      - working-directory: php
        run: vendor/bin/phpcs

  lint-docs-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby
      - working-directory: ruby
        run: bundle exec rake docs:check

  lint-docs-swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: "6.3"
      - name: Install SwiftLint
        run: |
          set -euo pipefail
          curl -sL -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          mkdir swiftlint_bin
          unzip -q swiftlint.zip -d swiftlint_bin
      - name: Lint
        working-directory: swift
        run: |
          set -euo pipefail
          # swiftlint's precompiled binary needs the installed toolchain's own
          # libsourcekitdInProc.so — its path isn't a fixed, documented convention across
          # setup-swift installs, so locate it relative to the swift binary SwiftyLab/setup-swift
          # actually put on PATH (e.g. /opt/hostedtoolcache/swift-<ver>/<ver>/x86_64/usr/bin/swift,
          # confirmed from a real run's log) rather than a blind whole-filesystem `find /`, which
          # hung for minutes scanning a GH-hosted runner's huge preinstalled toolchain set.
          swift_bin="$(command -v swift)"
          echo "swift binary: $swift_bin"
          toolchain_usr="$(dirname "$(dirname "$swift_bin")")"
          echo "toolchain usr dir: $toolchain_usr"
          lib_path="$(find "$toolchain_usr" -name libsourcekitdInProc.so 2>/dev/null | head -1)"
          echo "libsourcekitdInProc.so: ${lib_path:-not found}"
          if [ -z "$lib_path" ]; then
            echo "::error::libsourcekitdInProc.so not found under $toolchain_usr" >&2
            exit 1
          fi
          export LINUX_SOURCEKIT_LIB_PATH="$(dirname "$lib_path")"
          ../swiftlint_bin/swiftlint lint --strict Sources
