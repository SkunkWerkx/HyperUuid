name: CI — build native, build wasm, test every binding

# The build/test matrix lives in HyperForge (SkunkWerkx/.github) as the canonical Hyper*
# pipeline — 5 real-hardware legs plus the two musl RIDs in Alpine containers (and osx-x64
# cross-built on the Apple silicon runner, the core's own suite run under Rosetta), the Rust core
# built fresh per leg, every binding's suite run against it. Ruby's suite runs on the
# Magnus extension once per Ruby ABI on seven RIDs — the musl ones in each Ruby's Alpine
# image; osx-x64 is cross-built, with no Magnus extension and no binding suite — and once
# more forced onto the Fiddle fallback; Python
# has no fallback — PyO3 only, staged and tested per leg.
#
# CI's job is build, test, and upload reusable artifacts. Every native leg builds+tests
# fresh, and the raw outputs (the plain FFI libhyperuuid.so/.dylib/.dll, the compiled Ruby
# Magnus extension) get uploaded here for later reuse, as do the nine PyPI wheels, which
# are built, installed and called into on every run (build-wheels below). The .nupkg and
# the gems are still packed in release.yml, at tag time, from this run's libraries.
#
# None of it is version-agnostic: each native library reports the crate version it was
# built at (`hyperuuid_version()`), and a wheel carries it in its file name. So the run a
# release reuses has to be one that ran against the version-bump commit, which is why
# prepare-release.yml dispatches this workflow after it pushes the bump — see release.yml's
# find-ci-run for the gate.
#
# No push trigger, deliberately (not because master is branch-protected — checked via
# `gh api repos/.../branches/master/protection`, it isn't, despite this having been assumed
# here before): a stray run rebuilding/retesting on every trivial direct push (stage-native-
# binaries.yml's own binary-refresh commits included) would just be wasted compute for a
# result nobody's waiting on. The version bump is the one push that does need a run, and
# prepare-release.yml asks for it explicitly.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    # A reusable workflow can never escalate beyond what the calling job was granted, so the
    # two scopes attest-build-provenance needs have to be handed down from here — id-token to
    # mint the OIDC token it signs with, attestations to record the result. contents stays
    # read: nothing in the called workflow writes to the repo.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      project: HyperUuid
      crate: hyperuuid
      pure_env: HYPERUUID_PURE
      # Four more static libraries in the static-libs artifact: iOS, the iOS simulator and
      # Mac Catalyst (test-apple-mobile, below, is what links and runs them).
      apple_mobile: true
      # Turns the package's Native AOT claim into a per-platform receipt: publish on all five
      # legs, fail on any ILxxxx/AOTxxxx trim diagnostic, then actually run the produced
      # binary and require exit 0. The log uploads as aot-report-{rid}. The smoke test
      # exercises the real surface — including the non-throwing Try* path and the raw-byte
      # span transforms — so this covers the AOT-sensitive parts, not just NewV4().
      csharp_aot_project: csharp/HyperUuid.AotSmokeTest/HyperUuid.AotSmokeTest.csproj
      # The forge's ruby_version default (4.0, the current release) is the primary ABI; this
      # adds a second Magnus build+suite against 3.4 so each platform gem can ship both. A
      # Magnus extension is bound to one Ruby minor — unlike PyO3's abi3 wheels, which is why
      # Python needs no equivalent input. Keep this in step with ruby/Rakefile's ABIS and
      # release.yml's own ABIS list; the rake task aborts naming the missing file if they
      # drift. Ruby 3.4 goes EOL 2028-03-31 — clear this line then and 3.4 consumers fall
      # back to the universal Fiddle gem, which is exactly what it's there for.
      ruby_compat_version: "3.4"
      # attest_native defaults to true in the forge — each native library gets SLSA
      # provenance tying it to this run and commit. It matters here specifically because the
      # Rust build is deterministic locally but NOT bit-reproducible across machines (a local
      # rustc build and a runner's differ in hash and size), so rebuild-and-compare isn't a
      # check a consumer can actually perform. The permissions block above is what makes it
      # work; without those scopes the step fails rather than silently skipping.
      # HyperForge's own default (8.0.x) stays put for other repos. HyperUuid's package floor
      # is net10.0, the current LTS; Blazor WebAssembly is supported on .NET 11 and later only
      # (HyperUuid.targets has the reason).
      dotnet_version: "10.0.x"
      csharp_test_project: csharp/HyperUuid.Tests/HyperUuid.Tests.csproj
      # A jar has no per-platform package selection like NuGet's RID folders, and the
      # csproj's runtimes/**/native wildcard stages at pack time — so both bindings take
      # the pipeline's explicit per-leg placement for in-repo testing.
      csharp_runtimes_dir: csharp/HyperUuid/runtimes
      java_resources_dir: java/src/main/resources/native
      # The core as a wasm32-wasip1 module too, and the Java suite a second time through its
      # in-process GraalWasm backend. The module is what the jar carries beside the native
      # libraries so a JVM on a platform with no native build still has a working backend.
      wasip1_module: true

  # C#/NuGet's WASM support isn't optional or spike-only anymore (needed for real, for Norse
  # Architecture), so it's built on every PR too, not just at release time.
  build-wasm:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wasm.yml@master
    # Handed down for the same reason as build-native's: the ruby.wasm job attests the
    # archives the companion gem ships.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      project: HyperUuid
      # Every browser target runs in headless Chrome, not just built: the Blazor smoke app
      # linking the archive above, the crate itself for wasm32-unknown-unknown, and the Go
      # binding compiled by TinyGo with this commit's wasm32-wasip1 archive linked in. And
      # the Magnus extension, built for each Ruby minor the -wasm gem carries, linked into a
      # ruby.wasm interpreter and run under Node and in headless Chrome; those archives are
      # uploaded as ruby-wasm-{minor} for release.yml.
      blazor_check: csharp/HyperUuid.WasmSmokeTest/check.sh
      rust_browser_test: rust/browser-test
      go_tinygo_smoke: go/internal/tinygosmoke
      ruby_wasm_smoke: ruby/wasm-smoke

  # The nine PyPI wheels, on every run rather than only at the tag: built by maturin,
  # installed on their own platform (the musl ones on a bare Alpine image, osx-x64 under
  # Rosetta, the Pyodide one in Pyodide under Node and in headless Chrome, where the whole
  # pytest suite runs too), called into, attested and uploaded as pypi-wheels-{rid}. release.yml
  # publishes these exact files. A wheel that cannot be installed therefore fails the pull
  # request; while they were built in release.yml, 0.4.0's osx-x64 wheel failed its first
  # install with four registries already published.
  build-wheels:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wheels.yml@master
    # Same two scopes build-native hands down, for the same reason: the forge attests each
    # wheel and cannot escalate past what this job was granted.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid

  # rust/Cargo.toml publishes categories = ["no-std"], and rust/src/lib.rs is #![no_std]
  # whenever its default-on `std` feature is off. `default = ["std"]` means every other cargo
  # invocation in this pipeline compiles the *std* configuration — HyperForge's
  # cdylib build, its `cargo test --release`, and all three `--features` extension
  # builds. Not one of them would notice a `use std::` creeping back into the core (it compiles
  # clean under std — at worst an unused-import warning nothing fails on), or a dependency
  # feature that drags std in, which is the shape this crate was actually in before: it pinned
  # `getrandom`'s `std` feature on unconditionally. Either way the published claim quietly
  # stops being true with the whole matrix green. It was live and false once already, at
  # v0.1.0, which is what this exists to keep from recurring. `--no-default-features` against
  # a real bare-metal target is the only invocation that compiles the other configuration at
  # all for a consumer — see lib.rs's own comment for why the feature stays default-on (the
  # extensions and the test harness need std).
  #
  # RUSTFLAGS is the HyperUuid-specific part, and the reason this job lives here rather than
  # in HyperForge alongside the shared build matrix: off std there's no OS for `getrandom` to
  # read entropy from, so it compile_error!s unless pointed at a backend the consumer brings.
  # `cargo check` doesn't link, so naming the custom backend is enough on its own — no dummy
  # __getrandom_v03_custom symbol needed to satisfy it.
  #
  # Static analysis only, no native build needed, so this doesn't depend on build-native.
  check-no-std:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown
      - name: cargo check (no_std, bare metal)
        working-directory: rust
        env:
          RUSTFLAGS: --cfg getrandom_backend="custom"
        run: cargo check --no-default-features --target thumbv7em-none-eabi

      # The check above only ever passed because a bare-metal target cannot produce a
      # cdylib. Through 0.4.0 the manifest listed one, cargo builds every crate type a
      # dependency lists, and a no_std cdylib has no panic handler — so a
      # `default-features = false` consumer failed on every target that can produce one,
      # which is the developer's own machine and the browser. The manifest now declares
      # only the rlib; this builds a consumer the way one would actually depend on the
      # crate, on both, so the crate type cannot come back unnoticed. The host needs no
      # RUSTFLAGS (getrandom reads the OS); wasm32-unknown-unknown has no OS, so it gets the
      # same custom backend the bare-metal check names.
      - name: A default-features = false consumer builds on the host and for wasm32-unknown-unknown
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/no-std-consumer"
          mkdir -p "$consumer/src"
          printf '%s\n' '[package]' 'name = "no-std-consumer"' 'version = "0.0.0"' 'edition = "2024"' '' \
            '[dependencies]' "hyperuuid = { path = \"$GITHUB_WORKSPACE/rust\", default-features = false }" \
            > "$consumer/Cargo.toml"
          printf '%s\n' '#![no_std]' 'pub use hyperuuid as core_under_test;' > "$consumer/src/lib.rs"
          cargo build --manifest-path "$consumer/Cargo.toml"
          RUSTFLAGS='--cfg getrandom_backend="custom"' \
            cargo build --manifest-path "$consumer/Cargo.toml" --target wasm32-unknown-unknown

      # The stronger half of the claim, ported from HyperCast: the crate publishes
      # `no-std::no-alloc`, so a bare-metal consumer supplies an entropy backend and a panic
      # handler and no `#[global_allocator]`. The cargo check above does NOT cover that.
      # Without `extern crate alloc` declared, `Vec` and friends aren't in scope and any
      # accidental use already fails it; but adding the declaration deliberately would
      # compile clean, because `cargo check` never links and a missing allocator only ever
      # surfaces at link time — which for an rlib never comes. So the regression to guard is
      # the declaration itself.
      #
      # Anchored to the start of a line on purpose: lib.rs explains, in a comment, that there
      # is no `extern crate alloc` here, and an unanchored grep reads that sentence as the
      # thing it forbids. The three extension modules are excluded: each sits behind a
      # feature that pulls in std anyway.
      - name: assert the core links no allocator
        working-directory: rust
        run: |
          set -euo pipefail
          if grep -rnE '^[[:space:]]*extern crate alloc' src \
               --exclude=python_ext.rs --exclude=ruby_ext.rs --exclude=php_ext.rs; then
            echo '::error::The core declared "extern crate alloc". hyperuuid publishes the no-std::no-alloc category (see rust/README.md no_std section) — either drop the allocation or update that claim.' >&2
            exit 1
          fi
          echo "no allocator dependency in the core"

  # The crate's generation, parsing and conversion functions and every C export carry
  # `#[no_panic]` under the `no-panic` feature, the way `ryu` and `itoa` prove theirs: any panic
  # path the optimizer leaves in becomes an undefined symbol, so the link fails naming the
  # function. That only happens when a release-optimized binary that calls the function is
  # linked, and the cdylib does not count (it drops every function no export reaches), so this
  # builds the example that calls each one. A panic that crossed the C ABI would abort the host
  # process outright, or trap the wasm instance, rather than surface as an error code. It runs on
  # Windows as well because `now_v7` reads the clock differently there: `clock_gettime` directly
  # on Unix, std's `SystemTime::now` on Windows, and this is what proves std's path panic-free.
  # Static analysis only, so like the job above this doesn't depend on build-native.
  check-no-panic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: the public API and the C exports link with no panic path
        working-directory: rust
        run: cargo build --release --example no_panic --features no-panic

  # Every binding declares the core's C ABI by hand: C#'s LibraryImports, Java's downcalls,
  # Go's cgo prototypes, the Swift header, PHP's cdef, Ruby's Fiddle handles, and the Python
  # and Ruby extensions' registrations under their own spelling. This holds each of them to
  # the export list in rust/src/ffi.rs (.github/scripts/check_exports.py), so an export added
  # to the core and missed in one binding fails here, in seconds, not on the one leg whose
  # suite happens to call it.
  check-exports:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python .github/scripts/check_exports.py

  # The shared library every binding loads is built without std (`cargo cdylib`; the
  # `cdylib` feature in rust/Cargo.toml has why), which leaves it carrying what std used to
  # bring by itself: the C runtime it links, and a hidden `rust_eh_personality` for core's
  # unwind tables should one ever be linked in. Both are per-platform — `.hidden` on ELF,
  # `.private_extern` on Mach-O, msvcrt on Windows — and a gap in either is a library that
  # links but will not load, so every platform the forge ships is built and loaded here
  # rather than assumed. Each leg checks the export surface is the 13 C ABI symbols and
  # nothing else where the platform's nm can list it, then loads it through Python's ctypes
  # and calls every export (.github/scripts/cdylib_smoke.py), so the library is dlopen'd and
  # called exactly as a host would. The musl legs build in Alpine and also hold the library
  # to a single NEEDED entry: musl's libc.
  check-cdylib:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, rid: linux-x64, lib: libhyperuuid.so }
          - { os: ubuntu-26.04-arm, rid: linux-arm64, lib: libhyperuuid.so }
          - { os: macos-latest, rid: osx-arm64, lib: libhyperuuid.dylib }
          - { os: windows-latest, rid: win-x64, lib: hyperuuid.dll }
          - { os: windows-11-arm, rid: win-arm64, lib: hyperuuid.dll }
          - { os: ubuntu-26.04, rid: linux-musl-x64, lib: libhyperuuid.so, musl: true }
          - { os: ubuntu-26.04-arm, rid: linux-musl-arm64, lib: libhyperuuid.so, musl: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.musl }}
      - uses: actions/setup-python@v7
        if: ${{ !matrix.musl }}
        with:
          python-version: "3.x"

      - name: Build the no_std shared library
        if: ${{ !matrix.musl }}
        working-directory: rust
        run: cargo cdylib

      - name: Exports are the 13 C ABI symbols, and nothing else
        if: ${{ !matrix.musl && runner.os != 'Windows' }}
        working-directory: rust
        run: |
          set -euo pipefail
          lib="target/release/${{ matrix.lib }}"
          if [ "$RUNNER_OS" = macOS ]; then
            exports=$(nm -gU "$lib" | awk '$2 == "T" {print $3}' | sed 's/^_//' | sort)
          else
            exports=$(nm -D --defined-only "$lib" | awk '$2 == "T" {print $3}' | sort)
          fi
          echo "$exports"
          count=$(echo "$exports" | wc -l | tr -d ' ')
          extra=$(echo "$exports" | grep -v -E '^(uuid_[a-z0-9_]+|hyperuuid_version)$' || true)
          if [ "$count" != 13 ] || [ -n "$extra" ]; then
            echo "::error::expected the 13 C ABI exports and nothing else, found $count${extra:+ (unexpected: $extra)}"
            exit 1
          fi

      - name: Load it and call every export
        if: ${{ !matrix.musl }}
        shell: bash
        run: python .github/scripts/cdylib_smoke.py "rust/target/release/${{ matrix.lib }}" rust/Cargo.toml

      - name: Build, check, load and call it in Alpine
        if: ${{ matrix.musl }}
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" python:3-alpine sh -euc '
            apk add --no-cache build-base curl >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null 2>&1
            . "$HOME/.cargo/env"
            mkdir /work
            (cd /src && tar cf - --exclude=./rust/target ./rust ./.github/scripts) | tar xf - -C /work
            cd /work/rust
            cargo cdylib
            lib=target/release/libhyperuuid.so
            needed=$(readelf -d "$lib" | sed -n "s/.*(NEEDED).*\[\(.*\)\]/\1/p" | tr "\n" " ")
            echo "NEEDED: $needed"
            case "$needed" in
              "libc.musl-"*".so.1 ") ;;
              *) echo "::error::$lib must depend on musl libc and nothing else, found: $needed"; exit 1 ;;
            esac
            apk del build-base >/dev/null
            python /work/.github/scripts/cdylib_smoke.py "$lib" Cargo.toml
          '

  # iOS and Mac Catalyst, for the three bindings that reach them. Neither platform loads a
  # library: the core is linked into the app, from the static libraries build-native's
  # build-static-libs job cross-compiles and attests (the forge's apple_mobile input), which
  # are the bytes stage-native-binaries.yml commits for Swift and release.yml packs for C#.
  # This job is the one place they are linked into something and run, and it needs what no
  # build-native leg carries: Xcode, a simulator, and the .NET ios and maccatalyst workloads.
  #
  #  * Swift takes them from swift/HyperUuidCoreApple.xcframework, which swift/Package.swift
  #    declares only when it is there. The binding's suite runs on an iOS simulator and as a
  #    Mac Catalyst process, and the package is built for an iOS device. It also runs once
  #    more for macOS itself, and the root manifest is built: with the XCFramework present
  #    the manifest declares a second binary target and puts a platform condition on the
  #    first, which is the package a macOS consumer resolves from a tag and the one shape of
  #    it build-native's macOS leg, whose tree has no XCFramework yet, never sees.
  #  * C# takes them from csharp/HyperUuid/staticlibs/{rid}/ through build/HyperUuid.targets.
  #    HyperUuid.AppleSmokeTest is the Native AOT smoke test's Program.cs as an app: run as a
  #    Mac Catalyst process, installed and launched in the simulator, and built for an iOS
  #    device with signing off. No runner has a device, so that last one is proved as far as
  #    a link goes: the app's executable must define the core's symbols.
  #
  #  * Go takes them from go/staticlib/, picked by build tag (lint-docs-go checks the picking
  #    for every platform). The suite runs in the simulator through Go's own wrapper,
  #    misc/ios/go_ios_exec.go, which is how the Go project tests its iOS port; the test that
  #    reads rust/Cargo.toml is skipped there, since the wrapper carries the module into the
  #    simulator and that file is outside it. A device build is linked and inspected. Mac
  #    Catalyst is not linked from Go here: the same archive is linked and run by Swift and
  #    C# above, and Go's part of it is the selection.
  #
  # The simulator hands back neither an exit code nor a console to a launched app, so the C#
  # app also writes what it prints to a file in its container (SmokeLog.cs) and that file is
  # what is checked.
  test-apple-mobile:
    needs: build-native
    runs-on: macos-latest
    env:
      APP_ID: io.github.skunkwerkx.hyperuuid.applesmoketest
      SMOKE_PROJECT: csharp/HyperUuid.AppleSmokeTest/HyperUuid.AppleSmokeTest.csproj
      SMOKE_BIN: csharp/HyperUuid.AppleSmokeTest/bin/Release
    steps:
      - uses: actions/checkout@v7

      # Over the checkout: the artifact is laid out by repository path, so the XCFramework
      # lands whole under swift/ and the C# archives under csharp/HyperUuid/staticlibs/.
      - uses: actions/download-artifact@v8
        with:
          name: static-libs
          path: .

      - name: What is installed, and what was staged
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          (cd swift && xcodebuild -list)
          find swift/HyperUuidCoreApple.xcframework -type f | sort
          ls csharp/HyperUuid/staticlibs/{ios-arm64,iossimulator-arm64,maccatalyst-arm64,maccatalyst-x64}/libhyperuuid.a
          ls go/staticlib/{ios_arm64,iossimulator_arm64,maccatalyst_arm64,maccatalyst_amd64}/libhyperuuid.a

      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1])]
          for runtime in sorted((r for r in devices if "SimRuntime.iOS" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator on this image")')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Swift — macOS, with the XCFramework declared
        run: |
          set -euo pipefail
          described=$(cd swift && swift package describe)
          grep -q "HyperUuidCoreApple" <<<"$described" \
            || { echo "::error::swift/Package.swift did not declare the XCFramework target"; exit 1; }
          (cd swift && swift test)
          swift build

      - name: Swift — the suite on the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild test -scheme HyperUuid -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"

      - name: Swift — the suite as a Mac Catalyst process
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild test -scheme HyperUuid -destination "platform=macOS,variant=Mac Catalyst"

      - name: Swift — the package builds for an iOS device
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild build -scheme HyperUuid -destination "generic/platform=iOS"

      - uses: actions/setup-go@v7
        if: ${{ !cancelled() }}
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go — the suite in the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          # `go test` hands a cross-built test binary to go_{GOOS}_{GOARCH}_exec when one is
          # on PATH; Go's wrapper installs it in the booted simulator and runs it there.
          # clangwrap.sh is Go's own too, and targets the simulator SDK.
          mkdir -p "$RUNNER_TEMP/go-ios"
          go build -o "$RUNNER_TEMP/go-ios/go_ios_arm64_exec" "$(go env GOROOT)/misc/ios/go_ios_exec.go"
          export PATH="$RUNNER_TEMP/go-ios:$PATH"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 CC="$(go env GOROOT)/misc/ios/clangwrap.sh" \
            go test -tags iossimulator -skip '^TestNativeVersionMatchesTheCrate$' -v . | tee "$RUNNER_TEMP/go-ios/test.log"
          grep -q '^ok' "$RUNNER_TEMP/go-ios/test.log"

      - name: Go — an iOS device build links the core in
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-ios"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 \
            CC="$(xcrun --sdk iphoneos --find clang) -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=12.0" \
            go test -c -o "$RUNNER_TEMP/go-ios/hyperuuid-device.test" .
          nm "$RUNNER_TEMP/go-ios/hyperuuid-device.test" > "$RUNNER_TEMP/go-ios/device-symbols.txt"
          grep -q " [Tt] _uuid_new_v7\$" "$RUNNER_TEMP/go-ios/device-symbols.txt" \
            || { echo "::error::the iOS device test binary does not define uuid_new_v7; the core was not linked in"; exit 1; }
          echo "the iOS device test binary defines the core's exports"

      - uses: actions/setup-dotnet@v6
        if: ${{ !cancelled() }}
        with:
          dotnet-version: "10.0.x"

      # Pinned to a workload set whose iOS and Mac Catalyst SDKs are 26.5: each .NET for iOS
      # release refuses an Xcode older than its own, and from 10.0.401.1 that is Xcode 27,
      # which the macos-latest image does not carry yet (26.6 is its newest). An Xcode newer
      # than the workload's is accepted, so lift the pin once the image has Xcode 27.
      - name: Install the .NET iOS and Mac Catalyst workloads
        if: ${{ !cancelled() }}
        run: dotnet workload install ios maccatalyst --version 10.0.401

      - name: C# — a Mac Catalyst app, built and run
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          dotnet build "$SMOKE_PROJECT" -c Release -f net10.0-maccatalyst -r maccatalyst-arm64
          app=$(find "$SMOKE_BIN/net10.0-maccatalyst/maccatalyst-arm64" -maxdepth 1 -name '*.app')
          log="$TMPDIR/hyperuuid-smoke.log"
          rm -f "$log"
          "$app/Contents/MacOS/HyperUuid.AppleSmokeTest"
          cat "$log"
          grep -q "native: available=True version=$want" "$log"
          grep -q "ALL NATIVE AOT CHECKS PASSED" "$log"

      - name: C# — an iOS app, installed and launched in the simulator
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          udid="${{ steps.sim.outputs.udid }}"
          dotnet build "$SMOKE_PROJECT" -c Release -f net10.0-ios -r iossimulator-arm64
          app=$(find "$SMOKE_BIN/net10.0-ios/iossimulator-arm64" -maxdepth 1 -name '*.app')
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$APP_ID"
          log="$(xcrun simctl get_app_container "$udid" "$APP_ID" data)/tmp/hyperuuid-smoke.log"
          # The app exits when Program.cs returns; its last line, pass or fail, ends the wait.
          for _ in $(seq 1 60); do
            grep -q -E "ALL NATIVE AOT CHECKS PASSED|^FAIL" "$log" 2>/dev/null && break
            sleep 2
          done
          cat "$log"
          grep -q "native: available=True version=$want" "$log"
          grep -q "ALL NATIVE AOT CHECKS PASSED" "$log"

      - name: C# — an iOS device app links the core in
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet build "$SMOKE_PROJECT" -c Release -f net10.0-ios -r ios-arm64 -p:EnableCodeSigning=false
          app=$(find "$SMOKE_BIN/net10.0-ios/ios-arm64" -maxdepth 1 -name '*.app')
          nm -g "$app/HyperUuid.AppleSmokeTest" > device-symbols.txt
          for symbol in hyperuuid_version uuid_new_v4 uuid_new_v7 uuid_new_v7_batch; do
            grep -q " T _$symbol\$" device-symbols.txt \
              || { echo "::error::the iOS device app does not define $symbol; the core was not linked in"; exit 1; }
          done
          echo "the iOS device app defines the core's exports"

  # Formatting and lints for the crate, every PR. clippy runs over each configuration that
  # compiles different code — the default (with tests, benches and the example), the
  # bare-metal no_std rlib, the no_std shared library, the python extension, and Android,
  # whose entropy path (entropy.rs: ChaCha20 for batches, no pool) nothing else here compiles
  # — with warnings as errors. The ruby and php features need their interpreters' headers to
  # compile at all; the forge builds both on every leg, and they were clean when this job
  # was added. Static analysis only, so it doesn't depend on build-native.
  lint-rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown,aarch64-linux-android
      - name: cargo fmt --check
        working-directory: rust
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path browser-test/Cargo.toml
      - name: cargo clippy
        working-directory: rust
        run: |
          cargo clippy --all-targets -- -D warnings
          RUSTFLAGS='--cfg getrandom_backend="custom"' \
            cargo clippy --no-default-features --target thumbv7em-none-eabi -- -D warnings
          cargo clippy --no-default-features --features cdylib -- -D warnings
          cargo clippy --features python -- -D warnings
          cargo clippy --target aarch64-linux-android -- -D warnings
          cargo clippy --manifest-path browser-test/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

  # rust-version in rust/Cargo.toml is a promise to every crates.io consumer, and nothing
  # else would notice it going stale: the library and the no_std shared library are built
  # on exactly that toolchain, read from the manifest so the two cannot drift apart. The
  # tests are not part of the promise and use newer APIs.
  check-msrv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: cargo check on rust-version
        working-directory: rust
        run: |
          cargo check --lib
          cargo check --lib --no-default-features --features cdylib

  # The crate's public API against the latest release on crates.io: a breaking change with
  # a version that does not say so fails here, naming the item. Default features only — the
  # extension features are this repo's own plumbing and need interpreter headers to build.
  # A release bump goes in the same PR as the change (the libraries embed the version), so
  # the version this compares is the one the PR will publish.
  check-semver:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: rust/Cargo.toml
          feature-group: default-features

  # Doc-comment coverage on every real public API surface, every PR — the same bar
  # C#/Java/Rust get from a compiler flag (CS1591+TreatWarningsAsErrors, javadoc -Xwerror,
  # #![deny(missing_docs)]), applied here with the closest per-language equivalent. Each is
  # scoped to the language's own actual public surface, excluding internal FFI plumbing
  # (Runtime/NativePlatform-style helpers) that isn't part of the documented API — the same
  # public/internal boundary those three languages get for free from the compiler. Static
  # analysis only, no native build needed, so these don't depend on build-native.
  lint-docs-go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # go-version-file only tells setup-go where to read the Go version from — its
          # built-in module cache separately needs cache-dependency-path pointed at go.sum,
          # or it searches the repo root by default and finds nothing (go.mod/go.sum both
          # live under go/, not the root) — real "Restore cache failed" warning otherwise.
          cache-dependency-path: go/go.sum
      - run: go install github.com/mgechev/revive@v1.16.0
      - working-directory: go
        run: revive -config revive.toml ./...
      # Which archive each platform's build links, iOS, Mac Catalyst and the two that must
      # not compile included; the script has why this needs holding to a table.
      - name: Every Go build selects its own platform's archive
        run: .github/scripts/check_go_archives.sh
      # revive does not check layout; gofmt is the formatter, over every file in the module.
      - name: gofmt
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted (run gofmt -w .): $unformatted"
            exit 1
          fi

  lint-docs-python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.5
      # Docstrings and formatting over the whole package — src, tests and bench_uuid.py
      # (pyproject.toml's [tool.ruff]).
      - working-directory: python
        run: ruff check .
      - working-directory: python
        run: ruff format --check .

  lint-docs-php:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ffi
      - working-directory: php
        run: composer install --no-progress --prefer-dist
      - working-directory: php
        run: vendor/bin/phpcs

  lint-docs-ruby:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby
      - working-directory: ruby
        run: bundle exec rake docs:check
      # The formatter (.rubocop.yml: layout only) over every Ruby file in the gem.
      - working-directory: ruby
        run: bundle exec rubocop

  lint-docs-swift:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # `swiftlint-static`, not the `swiftlint` beside it in the same download. The dynamic
      # binary links libxml2.so.2, which Ubuntu 26.04 no longer ships (it carries
      # libxml2.so.16), and wants a Swift toolchain's libsourcekitdInProc.so found for it as
      # well. The static one needs neither, so this job installs no Swift at all. It cannot
      # run SourceKit-backed rules, and does not have to: `missing_docs`, the only rule
      # swift/.swiftlint.yml enables, is syntax-only and reports the same violations from
      # both binaries.
      - name: Install SwiftLint
        run: |
          set -euo pipefail
          curl -sSfL -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          mkdir swiftlint_bin
          unzip -q swiftlint.zip -d swiftlint_bin
      - name: Lint
        working-directory: swift
        run: ../swiftlint_bin/swiftlint-static lint --strict Sources

  # The formatters with no doc linter to ride beside: each checks every file of its
  # language — library, tests, benchmarks, smoke tests — against the committed config, and
  # fails on drift. (Rust's is lint-rust's cargo fmt; Go's, Python's, PHP's and Ruby's run
  # in the lint-docs jobs above.)
  format-csharp:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-quality: preview
      # csharp/.editorconfig: tabs, LF, a final newline.
      - working-directory: csharp
        run: dotnet format whitespace HyperUuid.slnx --verify-no-changes

  format-java:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Spotless with palantir-java-format (java/build.gradle.kts).
      - working-directory: java
        run: ./gradlew --no-daemon spotlessCheck

  format-swift:
    runs-on: ubuntu-26.04
    # swift-format ships in the toolchain, so the formatter is the version of the Swift the
    # matrix builds with (the forge's swift_version).
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      # swift/.swift-format: 4-space indent, 120 columns, every lint rule off — layout only.
      - working-directory: swift
        run: >-
          swift format lint --strict --recursive
          Package.swift Sources Tests
          StaticSmokeTest/Package.swift StaticSmokeTest/Sources
          Benchmarks/Package.swift Benchmarks/Benchmarks
