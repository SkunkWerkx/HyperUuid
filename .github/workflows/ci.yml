name: CI — build native, build wasm, test every binding

# The build/test matrix lives in HyperForge (SkunkWerkx/.github) as the canonical Hyper*
# pipeline — 6 real-hardware legs, the Rust core built fresh per leg, every binding's
# suite run against it. Ruby's suite runs twice (forced Fiddle fallback + Magnus extension
# backend); Python has no fallback — PyO3 only, via maturin develop.
#
# PR -> ci, tag -> release: this file is where every real build happens — the native legs,
# wasm, and (on workflow_dispatch only) every registry's actual shippable, packed artifact
# (PyPI wheels, the NuGet .nupkg). release.yml never builds or packs anything itself: a tag
# push just finds this file's already-green run for that commit, authenticates to each
# registry, downloads the artifact this file already produced, and publishes it — see
# find-ci-run in release.yml. That split is also why packing is gated off pull_request: a
# PR's packed artifact would never be tagged, so building it there is compute spent on
# nothing.
#
# No push trigger — master is branch-protected (no direct pushes), so there's no commit
# landing there outside a PR merge to key a run off of. That means find-ci-run has nothing
# to locate unless someone dispatches this workflow by hand against master's HEAD before
# tagging a release — a deliberate manual step, not an oversight (a stray push-to-master run
# building/packing on every trivial change, docs included, was worse).

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    with:
      project: HyperUuid
      crate: hyperuuid
      pure_env: HYPERUUID_PURE
      # HyperForge's own default (8.0.x) stays put for other repos — HyperUuid.csproj's floor
      # is net10.0 specifically because net8.0's WASM P/Invoke-table generator scans the wrong
      # (non-browser) copy of a multi-RID-asset package, an upstream bug fixed in .NET 10 (see
      # HyperUuid.targets' own comment for the full real-headless-Chromium-verified story).
      dotnet_version: "10.0.x"
      csharp_test_project: csharp/HyperUuid.Tests/HyperUuid.Tests.csproj
      # A jar has no per-platform package selection like NuGet's RID folders, and the
      # csproj's runtimes/**/native wildcard stages at pack time — so both bindings take
      # the pipeline's explicit per-leg placement for in-repo testing.
      csharp_runtimes_dir: csharp/HyperUuid/runtimes
      java_resources_dir: java/src/main/resources/native
      # go_windows stays default-true: the purego fallback carries the Windows legs.
      # The real PyO3 wheel (maturin, manylinux-compliant) and the compiled Ruby Magnus
      # extension only get built+uploaded here on the manual "about to release" trigger — a
      # PR's own wheel/gem would never get published, so building them there is wasted wall
      # clock, not extra validation (the plain cargo build/test steps every PR already gets
      # prove the extension compiles and passes its own tests regardless of this flag).
      release_artifacts: ${{ github.event_name == 'workflow_dispatch' }}

  # C#/NuGet's WASM support isn't optional or spike-only anymore (needed for real, for Norse
  # Architecture), so it's built on every PR too, not just at release time.
  build-wasm:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wasm.yml@master
    with:
      crate: hyperuuid

  # Same workflow_dispatch-only gating as build-native's own release_artifacts, for the same
  # reason — this one was missing it (ran on every PR) until caught.
  nuget-org-pack:
    if: github.event_name == 'workflow_dispatch'
    needs: [build-native, build-wasm]
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-nuget.yml@master
    with:
      crate: hyperuuid
      csproj_path: csharp/HyperUuid/HyperUuid.csproj
      runtimes_dir: csharp/HyperUuid/runtimes

  # Packages the real RubyGems artifacts: one universal "ruby" platform gem (pure Fiddle,
  # bundles all 6 platforms' native libs, zero compile needed — the same shape as every other
  # binding's own "works everywhere" install) plus one precompiled platform-tagged gem per
  # Magnus-supported platform (linux-x64/arm64, osx-x64/arm64 — not Windows, Magnus doesn't
  # target it, the universal gem's Fiddle path already covers it). Pure packaging, no
  # compilation happens here — build-native's own job already built every native lib this
  # needs (release_artifacts: true) — so unlike the C#/Java/Go legs this doesn't need a native
  # runner per platform, one ubuntu-latest job staging everything is enough, the same reasoning
  # nuget-org-pack above already uses for its own RID staging.
  ruby-pack-gems:
    if: github.event_name == 'workflow_dispatch'
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: false

      - uses: actions/download-artifact@v8
        with:
          pattern: ruby-native-*
          path: artifacts/ruby-native
          merge-multiple: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby

      - name: Build the universal "ruby" platform gem (pure Fiddle, all 6 platforms bundled)
        working-directory: ruby
        shell: bash
        run: |
          set -euo pipefail
          declare -A LIB_NAMES=(
            [linux-x64]=libhyperuuid.so
            [linux-arm64]=libhyperuuid.so
            [osx-x64]=libhyperuuid.dylib
            [osx-arm64]=libhyperuuid.dylib
            [win-x64]=hyperuuid.dll
            [win-arm64]=hyperuuid.dll
          )
          for rid in "${!LIB_NAMES[@]}"; do
            dest="lib/hyperuuid/native/$rid"
            mkdir -p "$dest"
            cp "../artifacts/native/native-$rid/${LIB_NAMES[$rid]}" "$dest/"
          done
          bundle exec rake build

      - name: Build precompiled platform gems (Magnus)
        working-directory: ruby
        shell: bash
        run: |
          set -euo pipefail
          declare -A PLATFORMS=(
            [linux-x64]=x86_64-linux
            [linux-arm64]=aarch64-linux
            [osx-x64]=x86_64-darwin
            [osx-arm64]=arm64-darwin
          )
          for rid in "${!PLATFORMS[@]}"; do
            ext=so
            [[ "$rid" == osx-* ]] && ext=bundle
            cp "../artifacts/ruby-native/ruby-native-$rid/hyperuuid_native.$ext" "lib/hyperuuid_native.$ext"
            bundle exec rake "native:gem[${PLATFORMS[$rid]}]"
            rm "lib/hyperuuid_native.$ext"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: rubygems-packages
          path: ruby/pkg/*.gem

  # Doc-comment coverage on every real public API surface, every PR — the same bar
  # C#/Java/Rust get from a compiler flag (CS1591+TreatWarningsAsErrors, javadoc -Xwerror,
  # #![deny(missing_docs)]), applied here with the closest per-language equivalent. Each is
  # scoped to the language's own actual public surface, excluding internal FFI plumbing
  # (Runtime/NativePlatform-style helpers) that isn't part of the documented API — the same
  # public/internal boundary those three languages get for free from the compiler. Static
  # analysis only, no native build needed, so these don't depend on build-native.
  lint-docs-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - run: go install github.com/mgechev/revive@v1.16.0
      - working-directory: go
        run: revive -config revive.toml ./...

  lint-docs-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.5
      - working-directory: python
        run: ruff check src

  lint-docs-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ffi
      - working-directory: php
        run: composer install --no-progress --prefer-dist
      - working-directory: php
        run: vendor/bin/phpcs

  lint-docs-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby
      - working-directory: ruby
        run: bundle exec rake docs:check

  lint-docs-swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: "6.3"
      - name: Install SwiftLint
        run: |
          set -euo pipefail
          curl -sL -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          mkdir swiftlint_bin
          unzip -q swiftlint.zip -d swiftlint_bin
      - name: Lint
        working-directory: swift
        run: |
          set -euo pipefail
          # swiftlint's precompiled binary needs the installed toolchain's own
          # libsourcekitdInProc.so — its path isn't a fixed, documented convention across
          # setup-swift installs, so locate it relative to the swift binary SwiftyLab/setup-swift
          # actually put on PATH (e.g. /opt/hostedtoolcache/swift-<ver>/<ver>/x86_64/usr/bin/swift,
          # confirmed from a real run's log) rather than a blind whole-filesystem `find /`, which
          # hung for minutes scanning a GH-hosted runner's huge preinstalled toolchain set.
          swift_bin="$(command -v swift)"
          echo "swift binary: $swift_bin"
          toolchain_usr="$(dirname "$(dirname "$swift_bin")")"
          echo "toolchain usr dir: $toolchain_usr"
          lib_path="$(find "$toolchain_usr" -name libsourcekitdInProc.so 2>/dev/null | head -1)"
          echo "libsourcekitdInProc.so: ${lib_path:-not found}"
          if [ -z "$lib_path" ]; then
            echo "::error::libsourcekitdInProc.so not found under $toolchain_usr" >&2
            exit 1
          fi
          export LINUX_SOURCEKIT_LIB_PATH="$(dirname "$lib_path")"
          ../swiftlint_bin/swiftlint lint --strict Sources
