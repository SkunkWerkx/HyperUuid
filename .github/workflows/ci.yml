name: CI — build native, build wasm, test every binding

# The build/test matrix lives in HyperForge (SkunkWerkx/.github) as the canonical Hyper*
# pipeline — 5 real-hardware legs plus the two musl RIDs in Alpine containers (and osx-x64
# cross-built on the Apple silicon runner, the core's own suite run under Rosetta), the Rust core
# built fresh per leg, every binding's suite run against it. Ruby's suite runs on the
# Magnus extension once per Ruby ABI on seven RIDs — the musl ones in each Ruby's Alpine
# image; osx-x64 is cross-built, with no Magnus extension and no binding suite — and once
# more forced onto the Fiddle fallback; Python
# has no fallback — PyO3 only, staged and tested per leg.
#
# CI's job is build, test, and upload reusable artifacts. Every native leg builds+tests
# fresh, and the raw outputs (the plain FFI libhyperuuid.so/.dylib/.dll, the compiled Ruby
# Magnus extension) get uploaded here for later reuse, as do the 17 PyPI wheels, which
# are built, installed and called into on every run (build-wheels below). The .nupkg and
# the gems are still packed in release.yml, at tag time, from this run's libraries.
#
# None of it is version-agnostic: each native library reports the crate version it was
# built at (`hyperuuid_version()`), and a wheel carries it in its file name. So the run a
# release reuses has to be one that ran against the version-bump commit, which is why
# prepare-release.yml dispatches this workflow after it pushes the bump — see release.yml's
# find-ci-run for the gate.
#
# No push trigger, deliberately (not because master is branch-protected — checked via
# `gh api repos/.../branches/master/protection`, it isn't, despite this having been assumed
# here before): a stray run rebuilding/retesting on every trivial direct push (stage-native-
# binaries.yml's own binary-refresh commits included) would just be wasted compute for a
# result nobody's waiting on. The version bump is the one push that does need a run, and
# prepare-release.yml asks for it explicitly.

on:
  pull_request:
  workflow_dispatch:
  # The whole release-mode board once a week, so arm64, musl, iOS, the wheels and the second
  # Ruby ABI are exercised between releases instead of first on release day.
  schedule:
    - cron: "0 6 * * 1"

# Least privilege for the whole board: every job below reads the repository and nothing more.
# The five HyperForge build jobs need id-token and attestations on top of that (SLSA provenance
# for what they build), and request-staging needs actions to start stage-native-binaries.yml;
# each declares those itself — a job-level `permissions:` replaces this block rather than
# adding to it, so the writes never reach another job. This is also what
# quietens CodeQL's actions/missing-workflow-permissions, which otherwise fires once per job.
permissions:
  contents: read

# A new push to a PR supersedes its running board; anything else runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-static:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-static.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      project: HyperUuid
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      apple_mobile: true
      android: true

  build-android:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-android.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      crate: hyperuuid
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}

  test-swift-static:
    needs: build-static
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-swift-static.yml@master
    permissions:
      contents: read
    with:
      project: HyperUuid

  # The C archives the release attaches, packed from this run's libraries the way the tag
  # run packs them, and each one built against through CMake and pkg-config on a runner that
  # executes it (c/smoke/run.sh).
  test-c:
    needs: [build-native, build-static, build-android]
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-c.yml@master
    permissions:
      contents: read
    with:
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}

  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    # A reusable workflow can never escalate beyond what the calling job was granted, so the
    # two scopes attest-build-provenance needs have to be handed down from here — id-token to
    # mint the OIDC token it signs with, attestations to record the result. contents stays
    # read: nothing in the called workflow writes to the repo.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: every leg and suite, nothing only a release needs (see the forge's README).
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      project: HyperUuid
      crate: hyperuuid
      pure_env: HYPERUUID_PURE
      # Turns the package's Native AOT claim into a per-platform receipt: publish on all five
      # legs, fail on any ILxxxx/AOTxxxx trim diagnostic, then actually run the produced
      # binary and require exit 0. The log uploads as aot-report-{rid}. The smoke test
      # exercises the real surface — including the non-throwing Try* path and the raw-byte
      # span transforms — so this covers the AOT-sensitive parts, not just NewV4().
      csharp_aot_project: csharp/HyperUuid.AotSmokeTest/HyperUuid.AotSmokeTest.csproj
      csharp_aot_frameworks: "net10.0 net11.0"
      # The forge's ruby_version default (4.0, the current release) is the primary ABI; this
      # adds a second Magnus build+suite against 3.4 so each platform gem can ship both. A
      # Magnus extension is bound to one Ruby minor — unlike PyO3's abi3 wheels, which is why
      # Python needs no equivalent input. Keep this in step with ruby/Rakefile's ABIS, the
      # Forge's ruby.abis default (RUBY_ABIS in hyper_config.py, which its pack-gems action
      # packs) and hyper-build-wasm.yml's ruby_wasm_abis default; `rake native:gem` aborts
      # naming the missing file if they drift. Ruby 3.4 goes EOL 2028-03-31 — clear this line
      # then and 3.4 consumers fall back to the universal Fiddle gem, which is exactly what
      # it's there for.
      ruby_compat_version: "3.4"
      # The floor composer.json declares; a pr-mode run builds and tests the PHP extension on
      # it on linux-x64 beside the newest minor (release builds every minor in the Forge's
      # php_versions). Explicit because the Forge's default (8.2) serves the siblings.
      php_floor_version: "8.3"
      # attest_native defaults to true in the forge — each native library gets SLSA
      # provenance tying it to this run and commit. It matters here specifically because the
      # Rust build is deterministic for one toolchain and build image but NOT bit-reproducible
      # across images (with the same rustc and linker, a local build and a runner's differ in
      # hash and size; csharp/README.md has the measurement), so rebuild-and-compare isn't a
      # check a consumer can actually perform. The permissions block above is what makes it
      # work; without those scopes the step fails rather than silently skipping.
      # The suite and the AOT smoke test run on net10.0 and net11.0 on every desktop and musl
      # leg: the forge installs the global.json SDK plus the 10.0 runtime and publishes once
      # per framework. iOS, Mac Catalyst and Android stay .NET 11 (HYPERUUID003); Blazor
      # WebAssembly takes both.
      csharp_test_project: csharp/HyperUuid.Tests/HyperUuid.Tests.csproj
      csharp_extra_runtime: "10.0"
      # A jar has no per-platform package selection like NuGet's RID folders, and the
      # csproj's runtimes/**/native wildcard stages at pack time — so both bindings take
      # the pipeline's explicit per-leg placement for in-repo testing.
      csharp_runtimes_dir: csharp/HyperUuid/runtimes
      java_resources_dir: java/src/main/resources/native
      # JDK 21 is the jar's floor (JNI on 21–24), shipped beside the primary 25; it reaches
      # EOL at Temurin on 2029-12-31, then this input and `java_jni` go.
      java_jni: true
      jdk_floor_version: "21"
      # The TypeScript addon (uploaded and attested as node-{rid} for release.yml's npm-pack)
      # and R CMD check --as-cran. Both default false in the Forge until the siblings carry
      # these bindings; the Node, Bun and R versions are the Forge's defaults.
      node: true
      r: true

  # C#/NuGet's WASM support is a shipped surface (Norse Architecture needs it), so it's
  # built on every PR, not just at release time.
  build-wasm:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wasm.yml@master
    # Handed down for the same reason as build-native's: the ruby.wasm job attests the
    # archives the companion gem ships.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: every leg and suite, nothing only a release needs (see the forge's README).
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hyperuuid
      project: HyperUuid
      # Every browser target runs in headless Chrome, not just built: the Blazor smoke app
      # linking the archive above, the crate itself for wasm32-unknown-unknown, and the Go
      # binding's smoke package compiled by TinyGo, its core being Go source (translated by
      # wasm2go from the crate's wasm32-wasip1 build and committed). The Go suite itself runs
      # on WebAssembly too: under TinyGo on wasip1 (wasmtime, the corpus mounted, with a
      # negative control without the mount), and under stock Go on js/wasm (Node) and
      # wasip1/wasm (wasmtime). And
      # in release mode (weekly and release, not PRs) the Magnus extension, built for each
      # Ruby minor the -wasm gem carries, linked into a ruby.wasm interpreter and run under
      # Node and in headless Chrome; those archives are uploaded as ruby-wasm-{minor} for
      # release.yml.
      blazor_check: csharp/HyperUuid.WasmSmokeTest/check.sh
      rust_browser_test: rust/browser-test
      go_wasm_suite: true
      go_tinygo_smoke: go/internal/tinygosmoke
      ruby_wasm_smoke: ruby/wasm-smoke
      # The TypeScript binding's WebAssembly fallback: the napi-rs module built for threadless
      # wasm32-wasip1, the whole suite run against it with the native addon refused, the WASI
      # npm package packed as the release packs it and run bundled into a page in headless
      # Chrome; the module and its loaders are attested and uploaded as node-wasm32-wasip1,
      # which pack-npm and test-npm-package below consume. First job in that workflow: the
      # newest code fails first.
      node_wasi: true

  # The 17 PyPI wheels, on every run rather than only at the tag: built by maturin,
  # installed on their own platform and on each interpreter they serve, free-threaded ones
  # included (the musl ones on Alpine, osx-x64 under Rosetta, the Pyodide one in Pyodide
  # under Node and in headless Chrome, where the whole pytest suite runs too), called
  # into, attested and uploaded as pypi-wheels-{rid}. release.yml publishes these exact
  # files. A wheel that cannot be installed therefore fails the pull request; while they
  # were built in release.yml, 0.4.0's osx-x64 wheel failed its first install with four
  # registries already published. With `sdist` in `.github/hyper.json`, the source
  # distribution too: built, `pip install`ed at exactly `rust-version` on manylinux2014 and
  # Alpine (one minor lower must fail), attested and uploaded as `pypi-wheels-sdist`.
  build-wheels:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wheels.yml@master
    # Same two scopes build-native hands down, for the same reason: the forge attests each
    # wheel and cannot escalate past what this job was granted.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: the Pyodide wheel and its in-browser suite only; the native wheels are packaging.
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hyperuuid

  # Every static check on the core and every binding's lint and formatter, once, in the Forge
  # (hyper-check-core.yml): no_std and no-panic proofs, the C ABI held to rust/src/ffi.rs
  # (.github/scripts/check_exports.py and the cdylib built on every RID, dlopen'd and called by
  # .github/scripts/cdylib_smoke.py), the conformance corpus re-derived by corpus/oracle.py, the
  # workflow-contract, ABI-probe and text-file tests in .github/scripts/tests (the last holds
  # every tracked text file to UTF-8, no BOM and LF), rustfmt and clippy, the MSRV,
  # cargo-semver-checks against the last crates.io release, and actionlint over this directory. The inputs below are what is HyperUuid
  # about it: off std there is no OS for `getrandom` to read, so the no_std builds name the custom
  # backend, clippy also runs the Android configuration, whose entropy path (entropy.rs:
  # ChaCha20 for batches, no pool) nothing else compiles, and `extra_features: uuid1` with the
  # `no_panic_command` override put the `uuid` interop feature through clippy, the MSRV check
  # and the no-panic link, which links a second time with `--cfg hyperuuid_words_walk` for the
  # WebAssembly batch walk (rust/src/v7.rs, `fill_batch`), and `big_endian` runs the core's
  # suite, corpus included, on s390x under QEMU, and `lint_java_jni` runs the JNI crate's std
  # tests and its no_std build.
  # None of it waits on build-native.
  check-core:
    uses: SkunkWerkx/.github/.github/workflows/hyper-check-core.yml@master
    permissions:
      contents: read
    with:
      no_std_rustflags: --cfg getrandom_backend="custom"
      extra_features: uuid1
      no_panic_command: cargo build --release --example no_panic --features no-panic,uuid1 && RUSTFLAGS="--cfg hyperuuid_words_walk" cargo build --release --example no_panic --features no-panic,uuid1
      big_endian: s390x-unknown-linux-gnu
      clippy_targets: aarch64-linux-android
      lint_node: true
      lint_r: true
      lint_java_jni: true


  # iOS and Mac Catalyst, for the three bindings that reach them. Neither platform loads a
  # library: the core is linked into the app, from the static libraries build-static
  # cross-compiles and attests (the forge's apple_mobile input), which
  # are the bytes the release attaches for Swift (zipped) and release.yml packs for C#.
  # This job is the one place they are linked into something and run, and it needs what no
  # build-native leg carries: Xcode, a simulator, and the .NET ios and maccatalyst workloads.
  #
  #  * Swift takes them from swift/HyperUuidCoreApple.xcframework, which swift/Package.swift
  #    declares only when it is there. The binding's suite runs on an iOS simulator and as a
  #    Mac Catalyst process, and the package is built for an iOS device. It also runs once
  #    more for macOS itself, and the root manifest is built, both with this run's bundle and
  #    XCFramework in the tree: with the XCFramework present the manifest declares a second
  #    binary target and puts a platform condition on the first, which is the package a macOS
  #    consumer resolves from a tag (there from the release's zips).
  #  * C# takes them from csharp/HyperUuid/staticlibs/{rid}/ through build/net10.0/HyperUuid.targets.
  #    HyperUuid.AppleSmokeTest is the Native AOT smoke test's SmokeTest.Run() as an app: run as a
  #    Mac Catalyst process, installed and launched in the simulator, and built for an iOS
  #    device with signing off. No runner has a device, so that last one is proved as far as
  #    a link goes: the app's executable must define the core's symbols.
  #
  #  * Go takes none: its core is Go source (go/internal/core), so the suite here proves the
  #    translated core on iOS, not a link. It runs in the simulator through Go's own
  #    wrapper, misc/ios/go_ios_exec.go, which is how the Go project tests its iOS port; the
  #    test that reads rust/Cargo.toml is skipped there, since the wrapper carries the module
  #    into the simulator and that file is outside it, and the corpus is staged as
  #    go/testdata/corpus (corpus_test.go looks there too) for the same reason. Go requires
  #    external linking on ios/arm64, so both the simulator run and the device build go
  #    through a C compiler (Go's clangwrap.sh, the iPhoneOS SDK's clang), with nothing of
  #    the core's for it to link. The device build is built and kept, not run: no runner has
  #    a device. Mac Catalyst is not a Go target.
  #
  # The simulator hands back neither an exit code nor a console to a launched app, so the C#
  # app also writes what it prints to a file in its container (SmokeLog.cs) and that file is
  # what is checked.
  test-apple-mobile:
    needs: build-static
    # Start when the static archives are ready; release mode only.
    if: github.event_name != 'pull_request'
    # The .NET 11 RC2 ios and maccatalyst workloads (27.0.x) are built against Xcode 27.0 and
    # refuse any other version; macos-latest (macOS 26) tops out at Xcode 26.6. The xcode-27
    # image tracks the Xcode 27 major, not a point release: it ships 27.1 as its default and
    # does not carry 27.0, so the three dotnet builds below pass
    # ValidateXcodeVersion=false (dotnet/macios, docs/building-apps/build-properties.md) and
    # the smoke tests themselves prove the 27.0 to 27.1 skip is harmless. Drop the property
    # once a .NET 11 workload accepts the image's Xcode.
    runs-on: xcode-27
    env:
      APP_ID: io.github.skunkwerkx.hyperuuid.applesmoketest
      SMOKE_PROJECT: csharp/HyperUuid.AppleSmokeTest/HyperUuid.AppleSmokeTest.csproj
      SMOKE_BIN: csharp/HyperUuid.AppleSmokeTest/bin/Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Over the checkout: the artifact is laid out by repository path, so the XCFramework
      # lands whole under swift/ and the C# archives under csharp/HyperUuid/staticlibs/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-libs
          path: .

      - name: What is installed, and what was staged
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          (cd swift && xcodebuild -list)
          find swift/HyperUuidCoreApple.xcframework -type f | sort
          ls csharp/HyperUuid/staticlibs/{ios-arm64,iossimulator-arm64,maccatalyst-arm64,maccatalyst-x64}/libhyperuuid.a

      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1])]
          for runtime in sorted((r for r in devices if "SimRuntime.iOS" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator on this image")')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Swift — macOS, with the XCFramework declared
        run: |
          set -euo pipefail
          described=$(cd swift && swift package describe)
          grep -q "HyperUuidCoreApple" <<<"$described" \
            || { echo "::error::swift/Package.swift did not declare the XCFramework target"; exit 1; }
          (cd swift && swift test)
          swift build

      - name: Swift — the suite on the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild test -scheme HyperUuid -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"

      - name: Swift — the suite as a Mac Catalyst process
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild test -scheme HyperUuid -destination "platform=macOS,variant=Mac Catalyst"

      - name: Swift — the package builds for an iOS device
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild build -scheme HyperUuid -destination "generic/platform=iOS"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !cancelled() }}
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go — the suite in the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          # `go test` hands a cross-built test binary to go_{GOOS}_{GOARCH}_exec when one is
          # on PATH; Go's wrapper installs it in the booted simulator and runs it there.
          # clangwrap.sh is Go's own too, and targets the simulator SDK. The wrapper predates
          # modules: it copies the package into the app by its path under GOROOT or GOPATH and
          # stops if it is under neither, so it alone runs with the workspace as its GOPATH
          # (go test keeps the real one, and its module cache).
          mkdir -p "$RUNNER_TEMP/go-ios/bin" testdata
          cp -R ../corpus testdata/corpus
          go build -o "$RUNNER_TEMP/go-ios/go_ios_exec" "$(go env GOROOT)/misc/ios/go_ios_exec.go"
          printf '#!/bin/sh\nGOPATH=%q exec %q "$@"\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP/go-ios/go_ios_exec" \
            > "$RUNNER_TEMP/go-ios/bin/go_ios_arm64_exec"
          chmod +x "$RUNNER_TEMP/go-ios/bin/go_ios_arm64_exec"
          export PATH="$RUNNER_TEMP/go-ios/bin:$PATH"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 CC="$(go env GOROOT)/misc/ios/clangwrap.sh" \
            go test -skip '^TestNativeVersionMatchesTheCrate$' -v . | tee "$RUNNER_TEMP/go-ios/test.log"
          grep -q '^ok' "$RUNNER_TEMP/go-ios/test.log"

      - name: Go — an iOS device build of the suite
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          # The device SDK's clang, because Go's ios/arm64 port links externally; the
          # binary is the proof, there is no device to run it on.
          mkdir -p "$RUNNER_TEMP/go-ios"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 \
            CC="$(xcrun --sdk iphoneos --find clang) -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=12.0" \
            go test -c -o "$RUNNER_TEMP/go-ios/hyperuuid-device.test" .
          [ -s "$RUNNER_TEMP/go-ios/hyperuuid-device.test" ] \
            || { echo "::error::the iOS device build of the Go suite produced no binary"; exit 1; }
          echo "the Go suite builds for an iOS device"

      # The SDK global.json names, as build-native's legs take it.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !cancelled() }}
        with:
          global-json-file: global.json

      - name: Install the .NET iOS and Mac Catalyst workloads
        if: ${{ !cancelled() }}
        run: dotnet workload install ios maccatalyst

      - name: C# — a Mac Catalyst app, built and run
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-maccatalyst -r maccatalyst-arm64 -p:ValidateXcodeVersion=false
          app=$(find "$SMOKE_BIN/net11.0-maccatalyst/maccatalyst-arm64" -maxdepth 1 -name '*.app')
          log="$TMPDIR/hyperuuid-smoke.log"
          rm -f "$log"
          "$app/Contents/MacOS/HyperUuid.AppleSmokeTest"
          cat "$log"
          grep -q "native: available=True version=$want" "$log"
          grep -q "ALL NATIVE AOT CHECKS PASSED" "$log"

      - name: C# — an iOS app, installed and launched in the simulator
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          udid="${{ steps.sim.outputs.udid }}"
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-ios -r iossimulator-arm64 -p:ValidateXcodeVersion=false
          app=$(find "$SMOKE_BIN/net11.0-ios/iossimulator-arm64" -maxdepth 1 -name '*.app')
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$APP_ID"
          log="$(xcrun simctl get_app_container "$udid" "$APP_ID" data)/tmp/hyperuuid-smoke.log"
          # The app exits when Program.cs returns; its last line, pass or fail, ends the wait.
          for _ in $(seq 1 60); do
            grep -q -E "ALL NATIVE AOT CHECKS PASSED|^FAIL" "$log" 2>/dev/null && break
            sleep 2
          done
          cat "$log"
          grep -q "native: available=True version=$want" "$log"
          grep -q "ALL NATIVE AOT CHECKS PASSED" "$log"

      - name: C# — an iOS device app links the core in
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-ios -r ios-arm64 -p:EnableCodeSigning=false -p:ValidateXcodeVersion=false
          app=$(find "$SMOKE_BIN/net11.0-ios/ios-arm64" -maxdepth 1 -name '*.app')
          nm -g "$app/HyperUuid.AppleSmokeTest" > device-symbols.txt
          for symbol in hyperuuid_version uuid_new_v4 uuid_new_v7 uuid_new_v7_batch; do
            grep -q " T _$symbol\$" device-symbols.txt \
              || { echo "::error::the iOS device app does not define $symbol; the core was not linked in"; exit 1; }
          done
          echo "the iOS device app defines the core's exports"

      # The net10.0 apps the targets file refuses; the three net11.0 builds above are the
      # control, since they import the same file and build. The probe builds an Exe because
      # the Apple SDK's Xcode check (_ValidateXcodeVersion) runs only for one: a class library
      # builds on any Xcode, so without OutputType=Exe the probe would pass with the gate gone,
      # while with it the gate must win over the Xcode error (proven both ways locally on
      # Xcode 27.1, where a gate-less net10.0-ios Exe fails "requires Xcode 26.0").
      - name: C# — net10.0-ios and net10.0-maccatalyst stop with HYPERUUID003
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          gate=csharp/HyperUuid.PlatformGateTest/HyperUuid.PlatformGateTest.csproj
          gate_dir=csharp/HyperUuid.PlatformGateTest
          for probe in "net10.0-ios|iOS" "net10.0-maccatalyst|Mac Catalyst"; do
            tfm="${probe%%|*}"
            platform="${probe#*|}"
            rm -rf "${gate_dir:?}/bin" "${gate_dir:?}/obj"
            if dotnet build "$gate" -p:GateFramework="$tfm" -p:OutputType=Exe -tl:off > "gate-$tfm.log" 2>&1; then
              echo "::error::$tfm built; the gate did not stop it"; cat "gate-$tfm.log"; exit 1
            fi
            grep -qF "error HYPERUUID003" "gate-$tfm.log" \
              || { echo "::error::$tfm failed, but not with HYPERUUID003"; cat "gate-$tfm.log"; exit 1; }
            grep -qF "$platform needs .NET 11 or later: target ${tfm/net10.0/net11.0}." "gate-$tfm.log" \
              || { echo "::error::$tfm: the HYPERUUID003 text does not name $platform"; cat "gate-$tfm.log"; exit 1; }
            echo "$tfm stops with HYPERUUID003"
          done

  # Android, in an emulator, for the three bindings that reach it: C#, Go and Swift.
  #
  # C#: HyperUuid.AndroidSmokeTest, which runs the Native AOT smoke test's SmokeTest.Run()
  # from an Activity, against the package as a MAUI app would take it — packed here from
  # build-android's shared libraries and build-static's static-libs archives, and
  # restored from a local folder, so that what is proven is the .nupkg's own layout (NuGet's
  # runtimes/{rid}/native/ into the APK's lib/{abi}/, and build/net10.0/HyperUuid.targets
  # handing a Native AOT publish its archive), not a project reference's.
  #
  # Four APKs: CoreCLR (.NET 11's Android runtime; Mono is not supported there) and
  # Native AOT, each for android-x64 and android-arm64. The x64 pair runs in an x86_64
  # emulator whose image uses 16 KB pages, as Android 15 devices may, so a library aligned
  # for 4 KB would fail to load there; nothing hosted runs arm64 Android, so the arm64 pair is
  # inspected instead, the same way test-apple-mobile treats an iOS device build. Each
  # CoreCLR APK must carry libhyperuuid.so for its ABI and pass zipalign -P 16 (the check
  # Google Play applies), and each Native AOT APK must not carry it at all, because the core
  # is linked into the app; the x64 one then passing in the emulator is the proof that it was.
  #
  # Go and Swift: each binding's whole suite, corpus replay included, cross-compiled for
  # Android (Swift against this run's archives, which the static-libs artifact lands in the
  # Swift bundle; Go from its translated core, linked through the NDK's clang only because
  # Go itself requires external linking on android/amd64) and run on the same emulator
  # through adb, by the two scripts that also run it locally: android_build_suite.sh and
  # android_device_test.sh. Go
  # runs with -test.short and Swift skips them on Android: the two 1 GiB v7 batch tests,
  # which an emulator's memory is no place for (every other leg runs them). The aarch64
  # builds are linked, not run. Swift's SDK for Android needs Swift 6.3 or later.
  test-android:
    needs: [build-static, build-android]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      SMOKE_PROJECT: csharp/HyperUuid.AndroidSmokeTest/HyperUuid.AndroidSmokeTest.csproj
      SMOKE_DIR: csharp/HyperUuid.AndroidSmokeTest
      APP_ID: io.github.skunkwerkx.hyperuuid.androidsmoketest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-android-*
          path: artifacts

      # Over the checkout, laid out by repository path: the Android archives land in
      # csharp/HyperUuid/staticlibs/android-{rid}/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-libs
          path: .

      - name: Stage runtimes/android-{rid}/native/
        run: |
          set -euo pipefail
          for rid in android-arm64 android-x64; do
            mkdir -p "csharp/HyperUuid/runtimes/$rid/native"
            cp "artifacts/native-$rid/libhyperuuid.so" "csharp/HyperUuid/runtimes/$rid/native/"
            [ -f "csharp/HyperUuid/staticlibs/$rid/libhyperuuid.a" ] \
              || { echo "::error::static-libs has no csharp/HyperUuid/staticlibs/$rid/libhyperuuid.a"; exit 1; }
          done

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The android workload's build tasks run on a JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install the .NET android workload
        run: dotnet workload install android

      - name: Pack HyperUuid into a local feed
        run: |
          set -euo pipefail
          version="0.0.0-android.${{ github.run_id }}"
          echo "HYPERUUID_VERSION=$version" >> "$GITHUB_ENV"
          echo "HYPERUUID_FEED=$RUNNER_TEMP/feed" >> "$GITHUB_ENV"
          dotnet pack csharp/HyperUuid/HyperUuid.csproj -c Release -o "$RUNNER_TEMP/feed" -p:Version="$version"
          unzip -l "$RUNNER_TEMP/feed/HyperUuid.$version.nupkg" | tee "$RUNNER_TEMP/nupkg.txt"
          for path in runtimes/android-arm64/native/libhyperuuid.so runtimes/android-x64/native/libhyperuuid.so \
                      staticlibs/android-arm64/libhyperuuid.a staticlibs/android-x64/libhyperuuid.a; do
            grep -q " $path\$" "$RUNNER_TEMP/nupkg.txt" || { echo "::error::the package has no $path"; exit 1; }
          done

      # Each build from a clean tree, since the CoreCLR and Native AOT builds of one RID share
      # bin/ and obj/; the signed APK is copied out under a name that says which it is.
      - name: Build the four APKs
        run: |
          set -euo pipefail
          mkdir -p apks
          for rid in android-x64 android-arm64; do
            for runtime in coreclr aot; do
              rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
              aot=false
              [ "$runtime" = aot ] && aot=true
              dotnet publish "$SMOKE_PROJECT" -c Release -r "$rid" -p:PublishAot="$aot" \
                -p:HyperUuidVersion="$HYPERUUID_VERSION" -p:RestoreAdditionalProjectSources="$HYPERUUID_FEED"
              apk="$(find "$SMOKE_DIR/bin" -name "$APP_ID-Signed.apk" | head -1)"
              [ -n "$apk" ] || { echo "::error::no signed APK for $runtime $rid"; exit 1; }
              cp "$apk" "apks/$runtime-$rid.apk"
            done
          done
          ls -l apks

      # The same file reaches the four APKs above from the package, and they build on net11.0
      # (the control); on net10.0 it stops the build.
      - name: C# — net10.0-android stops with HYPERUUID003
        run: |
          set -euo pipefail
          gate_dir=csharp/HyperUuid.PlatformGateTest
          rm -rf "${gate_dir:?}/bin" "${gate_dir:?}/obj"
          if dotnet build csharp/HyperUuid.PlatformGateTest/HyperUuid.PlatformGateTest.csproj -p:GateFramework=net10.0-android -tl:off > gate-android.log 2>&1; then
            echo "::error::net10.0-android built; the gate did not stop it"; cat gate-android.log; exit 1
          fi
          grep -qF "error HYPERUUID003" gate-android.log \
            || { echo "::error::net10.0-android failed, but not with HYPERUUID003"; cat gate-android.log; exit 1; }
          grep -qF "Android needs .NET 11 or later: target net11.0-android." gate-android.log \
            || { echo "::error::the HYPERUUID003 text does not name Android and net11.0-android"; cat gate-android.log; exit 1; }
          echo "net10.0-android stops with HYPERUUID003"

      - name: Inspect the APKs
        run: |
          set -euo pipefail
          zipalign="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -1)"
          for rid in android-x64 android-arm64; do
            case "$rid" in android-x64) abi=x86_64 ;; android-arm64) abi=arm64-v8a ;; esac
            unzip -l "apks/coreclr-$rid.apk" | grep -q " lib/$abi/libhyperuuid.so\$" \
              || { echo "::error::the CoreCLR $rid APK has no lib/$abi/libhyperuuid.so"; exit 1; }
            "$zipalign" -c -P 16 -v 4 "apks/coreclr-$rid.apk" | grep "libhyperuuid.so"
            for runtime in coreclr aot; do
              "$zipalign" -c -P 16 4 "apks/$runtime-$rid.apk" \
                || { echo "::error::the $runtime $rid APK fails zipalign -P 16"; exit 1; }
            done
            if unzip -l "apks/aot-$rid.apk" | grep -q "/libhyperuuid.so\$"; then
              echo "::error::the Native AOT $rid APK carries libhyperuuid.so; the core should be linked into the app"
              exit 1
            fi
            echo "$rid: the CoreCLR APK carries lib/$abi/libhyperuuid.so; the Native AOT APK links the core in; both pass zipalign -P 16"
          done

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # After the APKs: setup-swift puts its toolchain's clang first on PATH.
      - uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: "6.4"

      - name: Go and Swift — cross-build the suites for Android
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for arch in x86_64 aarch64; do
            .github/scripts/android_build_suite.sh go "$arch" "stage/go-$arch"
            .github/scripts/android_build_suite.sh swift "$arch" "stage/swift-$arch"
          done

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the x64 APKs and the Go and Swift suites in an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis_ps16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # One command per line: the action runs each on its own and fails on the first that does.
          script: |
            .github/scripts/android_smoke.sh "$APP_ID" "$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)" apks/coreclr-android-x64.apk apks/aot-android-x64.apk
            .github/scripts/android_device_test.sh stage/go-x86_64 ./hyperuuid.test -test.v -test.short
            .github/scripts/android_device_test.sh stage/swift-x86_64 ./HyperUuidPackageTests.xctest

  # The .NET 10 half of the C# package, on Linux: packed from this run's libraries and taken
  # back out of a local feed, so that what is proven is the .nupkg's own layout. Four things:
  #  * the layout (lib/net10.0 and lib/net11.0, the targets file under build/net10.0 only);
  #  * the Native AOT smoke test published and run from the package on net10.0 and net11.0,
  #    with the core linked in (no libhyperuuid.so beside the executable, none NEEDED, and a
  #    libc.so NEEDED line as the positive control that the readelf dump lists dependencies);
  #  * its control: the same package with build/ and buildTransitive/ stripped publishes a
  #    libhyperuuid.so beside the executable, so the check above can see a lost static link;
  #  * the floor (net9.0 does not restore) and the gate, which admits Blazor WebAssembly on
  #    net10.0 and net11.0: evaluated, and built only to show HYPERUUID002, because this job
  #    installs no wasm workload.
  # The runner image's SDK is not assumed to be the only one: the job logs which are there.
  test-nuget-package:
    needs: [build-static, build-native]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SMOKE_PROJECT: csharp/HyperUuid.AotSmokeTest/HyperUuid.AotSmokeTest.csproj
      SMOKE_DIR: csharp/HyperUuid.AotSmokeTest
      GATE_PROJECT: csharp/HyperUuid.PlatformGateTest/HyperUuid.PlatformGateTest.csproj
      GATE_DIR: csharp/HyperUuid.PlatformGateTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x64
          path: artifacts

      # Over the checkout, laid out by repository path: the archive lands in
      # csharp/HyperUuid/staticlibs/linux-x64/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-libs
          path: .

      - name: Stage runtimes/linux-x64/native/
        run: |
          set -euo pipefail
          mkdir -p csharp/HyperUuid/runtimes/linux-x64/native
          cp artifacts/libhyperuuid.so csharp/HyperUuid/runtimes/linux-x64/native/
          [ -f csharp/HyperUuid/staticlibs/linux-x64/libhyperuuid.a ] \
            || { echo "::error::static-libs has no csharp/HyperUuid/staticlibs/linux-x64/libhyperuuid.a"; exit 1; }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Which SDKs are here
        run: |
          set -euo pipefail
          dotnet --version
          dotnet --list-sdks

      - name: Pack HyperUuid into a local feed and check its layout
        run: |
          set -euo pipefail
          version="0.0.0-pkg.${{ github.run_id }}"
          echo "HYPERUUID_VERSION=$version" >> "$GITHUB_ENV"
          echo "HYPERUUID_FEED=$RUNNER_TEMP/feed" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages" >> "$GITHUB_ENV"
          dotnet pack csharp/HyperUuid/HyperUuid.csproj -c Release -o "$RUNNER_TEMP/feed" -p:Version="$version"
          unzip -l "$RUNNER_TEMP/feed/HyperUuid.$version.nupkg" | tee "$RUNNER_TEMP/nupkg.txt"
          for path in lib/net10.0/HyperUuid.Managed.dll lib/net11.0/HyperUuid.Managed.dll \
                      build/net10.0/HyperUuid.targets buildTransitive/net10.0/HyperUuid.targets \
                      runtimes/linux-x64/native/libhyperuuid.so staticlibs/linux-x64/libhyperuuid.a; do
            grep -q " $path\$" "$RUNNER_TEMP/nupkg.txt" || { echo "::error::the package has no $path"; exit 1; }
          done
          if grep -q " build/net11.0/\| buildTransitive/net11.0/" "$RUNNER_TEMP/nupkg.txt"; then
            echo "::error::the package carries a build/net11.0 or buildTransitive/net11.0 folder; the targets file is under net10.0 only"
            exit 1
          fi

      # Package mode: the smoke test takes the .nupkg from the feed, so NuGet makes the
      # targets import. One TFM at a time (without -f a multi-targeted publish fails with
      # NETSDK1129), from a clean tree, since the two share bin/ and obj/.
      - name: Native AOT from the package, on net10.0 and net11.0
        run: |
          set -euo pipefail
          for tfm in net10.0 net11.0; do
            rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
            dotnet publish "$SMOKE_PROJECT" -c Release -f "$tfm" -r linux-x64 -p:PublishAot=true \
              -p:HyperUuidVersion="$HYPERUUID_VERSION" -p:RestoreAdditionalProjectSources="$HYPERUUID_FEED" \
              -o "aot-out/$tfm"
            if [ -e "aot-out/$tfm/libhyperuuid.so" ]; then
              echo "::error::$tfm: aot-out/$tfm carries libhyperuuid.so; the core should be linked into the executable"
              exit 1
            fi
            # readelf writes to a file, so a missing or unreadable executable fails the step
            # (set -e) instead of reading as "nothing NEEDED"; the libc line is the positive
            # control that the dump really lists dynamic dependencies.
            readelf -d "aot-out/$tfm/HyperUuid.AotSmokeTest" > "aot-needed-$tfm.txt"
            grep -q 'NEEDED.*libc\.so' "aot-needed-$tfm.txt" \
              || { echo "::error::$tfm: readelf lists no NEEDED libc.so; the dump cannot be trusted"; cat "aot-needed-$tfm.txt"; exit 1; }
            if grep -q 'NEEDED.*libhyperuuid\.so' "aot-needed-$tfm.txt"; then
              echo "::error::$tfm: the executable needs libhyperuuid.so at run time"
              exit 1
            fi
            "aot-out/$tfm/HyperUuid.AotSmokeTest" | tee "aot-run-$tfm.log"
            grep -q "ALL NATIVE AOT CHECKS PASSED" "aot-run-$tfm.log"
            echo "$tfm: the core is linked in and the smoke test passes"
          done

      # The control for the step above: without build/ and buildTransitive/ nothing hands
      # the publish its archive, and it quietly falls back to the shared library beside the
      # executable. If it did not, the check above could not see a lost static link.
      - name: Control — a package without its targets falls back to the shared library
        run: |
          set -euo pipefail
          nobuild="$HYPERUUID_VERSION.nobuild"
          dotnet pack csharp/HyperUuid/HyperUuid.csproj -c Release -o "$HYPERUUID_FEED" -p:Version="$nobuild"
          zip -d "$HYPERUUID_FEED/HyperUuid.$nobuild.nupkg" 'build/*' 'buildTransitive/*'
          rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
          dotnet publish "$SMOKE_PROJECT" -c Release -f net10.0 -r linux-x64 -p:PublishAot=true \
            -p:HyperUuidVersion="$nobuild" -p:RestoreAdditionalProjectSources="$HYPERUUID_FEED" \
            -o aot-out/nobuild
          [ -e aot-out/nobuild/libhyperuuid.so ] \
            || { echo "::error::the check in the previous step cannot see a lost static link"; exit 1; }
          echo "without its targets the publish carries libhyperuuid.so beside the executable"

      - name: The floor is .NET 10
        run: |
          set -euo pipefail
          rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
          if dotnet restore "$SMOKE_PROJECT" -p:TargetFrameworks=net9.0 \
               -p:HyperUuidVersion="$HYPERUUID_VERSION" -p:RestoreAdditionalProjectSources="$HYPERUUID_FEED" > restore-net9.log 2>&1; then
            echo "::error::net9.0 restored the package; the floor is net10.0"; cat restore-net9.log; exit 1
          fi
          grep -qF "NU1202: Package HyperUuid " restore-net9.log \
            || { echo "::error::the net9.0 restore failed, but not with NU1202"; cat restore-net9.log; exit 1; }
          echo "net9.0 does not restore the package (NU1202)"

      # The wasm archive is built with -Zbuild-std (on stable, RUSTC_BOOTSTRAP=1) for a feature set both .NET 10's and .NET 11's
      # wasm toolchains accept, so the gate stands aside for Blazor on both. Evaluation shows the
      # gate's answer; the build is to show HYPERUUID002, since this job installs no wasm
      # workload. The Android evaluation is the control: the property is read, and does flag.
      - name: The gate admits Blazor WebAssembly on .NET 10 and 11
        run: |
          set -euo pipefail
          control="$(dotnet msbuild "$GATE_PROJECT" -getProperty:_HyperUuidNet10Unsupported -p:GateFramework=net10.0-android)"
          [ "$control" = Android ] || { echo "::error::the gate does not flag net10.0-android (got '$control'); the reads below prove nothing"; exit 1; }
          for f in net10.0 net11.0; do
            rm -rf "${GATE_DIR:?}/bin" "${GATE_DIR:?}/obj"
            flag="$(dotnet msbuild "$GATE_PROJECT" -getProperty:_HyperUuidNet10Unsupported -p:GateFramework="$f" -p:RuntimeIdentifier=browser-wasm)"
            [ -z "$flag" ] || { echo "::error::the gate flags $f + browser-wasm: $flag"; exit 1; }
            if dotnet build "$GATE_PROJECT" -p:GateFramework="$f" -p:RuntimeIdentifier=browser-wasm -p:WasmNativeWorkloadAvailable=false -tl:off > "gate-wasm-$f.log" 2>&1; then
              echo "::error::$f + browser-wasm built without the wasm workload"; cat "gate-wasm-$f.log"; exit 1
            fi
            grep -qF "error HYPERUUID002" "gate-wasm-$f.log" \
              || { echo "::error::$f + browser-wasm failed, but not with HYPERUUID002"; cat "gate-wasm-$f.log"; exit 1; }
            if grep -qF "HYPERUUID003" "gate-wasm-$f.log"; then
              echo "::error::$f + browser-wasm raised HYPERUUID003"; cat "gate-wasm-$f.log"; exit 1
            fi
            echo "$f + browser-wasm passes the gate (and stops at HYPERUUID002 without the workload)"
          done

  # The npm packages as a consumer gets them, on the three desktop OSes (a native pass on an OS
  # proves nothing about WASI initialisation and file resolution there; Windows' preopen and
  # path handling, macOS's resolution). Each leg first runs the whole conformance suite against
  # the WASI module built above, with the native addon refused (NAPI_RS_FORCE_WASI=error), so
  # byte-buffer mutation, batches, timestamps and error propagation are proven on the module
  # on that OS, not just that it loads; then packs the ten tarballs with the Forge's
  # npm_package.py, the release's own pack body, from the run's node-<rid> artifacts, and
  # serves them from a local Verdaccio to the installation scenarios in
  # typescript/consumer-tests/run.sh (its header lists them): a plain install loads native
  # with the WASI package present and an empty stderr; --omit=optional, a deleted native and
  # a forced run load wasm32-wasip1; three negative controls fail or report unavailability
  # the documented way; on Linux also npm/cli#4828's damaged lockfile, the exact Node floor
  # in node:22.13.0-alpine with engine-strict, an emulated s390x host (QEMU, so no native
  # package fits; big-endian, so the smoke's checks pass and the documented exit hang is
  # asserted, not hidden) and two bundlers. Bun runs the forced-WASI suite too, and its result is
  # recorded in the step summary without failing the job: Bun's node:wasi cannot initialise
  # the module today (the design spec's Bun decision); native Bun stays green in build-native.
  # The Forge is checked out at master here, as release.yml does, for the pack script; the
  # workflow calls above resolve the same way.
  test-npm-package:
    needs: [build-native, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the Forge at master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: master
          path: .hyperforge
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-*
          path: artifacts/node
          merge-multiple: false

      # The module and its loaders beside binding.js, where the loader's first WASI candidate
      # looks; no .node is built or downloaded into the checkout, and the forced mode never
      # consults one anyway.
      - name: The conformance suite against the WASI module, native refused
        shell: bash
        working-directory: typescript
        run: |
          set -euo pipefail
          npm ci
          cp ../artifacts/node/node-wasm32-wasip1/* .
          ls -l hyperuuid.wasm32-wasip1.wasm
          NAPI_RS_FORCE_WASI=error npm test
          npm run typecheck

      - name: The same on Bun, recorded
        id: bun
        shell: bash
        working-directory: typescript
        continue-on-error: true
        run: |
          set -euo pipefail
          NAPI_RS_FORCE_WASI=error npm run test:bun

      - name: Record Bun's result
        shell: bash
        env:
          BUN_OUTCOME: ${{ steps.bun.outcome }}
          OS: ${{ matrix.os }}
        run: |
          echo "- Bun $(bun --version) forced-WASI suite on $OS: $BUN_OUTCOME (recorded, never a failure of this job)" >> "$GITHUB_STEP_SUMMARY"

      # PR mode has no osx-x64 build (hyper-build-native skips it), so the pack leaves that
      # platform package out by name, as test-c does; the root still pins all eight, and npm
      # tolerates an optional dependency whose packument is missing. A release skips nothing.
      - name: Pack the ten tarballs as the release does
        shell: bash
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            release) skip=() ;;
            pr) skip=(--skip osx-x64) ;;
            *) echo "::error::mode must be release or pr, not $MODE"; exit 1 ;;
          esac
          python3 ".hyperforge/.github/scripts/npm_package.py" pack --package typescript --artifacts artifacts/node --out npm-packages "${skip[@]}"
          ls -l npm-packages

      - name: The consumer-test harness
        shell: bash
        working-directory: typescript/consumer-tests
        run: npm ci

      # s390x for the emulated-host scenario; the floor and lockfile scenarios need Docker and
      # the pinned npm, which only this leg has.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.os == 'ubuntu-26.04'
        with:
          platforms: s390x

      # SKIP_NATIVES names the platform package the pack left out, so the mac-lockfile guard
      # (which otherwise wants all eight in the registry) excludes it in PR mode.
      - name: Every installation scenario
        if: matrix.os == 'ubuntu-26.04'
        shell: bash
        env:
          SKIP_NATIVES: ${{ github.event_name == 'pull_request' && 'darwin-x64' || '' }}
        run: bash typescript/consumer-tests/run.sh "$GITHUB_WORKSPACE/npm-packages" all

      - name: The installation scenarios this OS can run
        if: matrix.os != 'ubuntu-26.04'
        shell: bash
        env:
          SKIP_NATIVES: ${{ github.event_name == 'pull_request' && 'darwin-x64' || '' }}
        run: >-
          bash typescript/consumer-tests/run.sh "$GITHUB_WORKSPACE/npm-packages"
          negative-unpublished plain omit-optional absent-native forced-wasi
          negative-deleted-package negative-deleted-wasm bundlers

  # A release's run is dispatched by prepare-release.yml with a GITHUB_TOKEN, and GitHub raises
  # no workflow_run for a run that token started, so stage-native-binaries.yml would never hear
  # that it finished. workflow_dispatch is one of the two events the token may raise: once every
  # job above is green, this asks staging for this exact run. Staging waits for the run to
  # complete and holds it to the same checks as ever; a run a human dispatched also raises
  # workflow_run, and whichever staging request comes second finds A staged and skips. Pull
  # requests and the weekly schedule never stage, and only this job may start a workflow.
  request-staging:
    needs: [build-static, build-android, test-swift-static, build-native, build-wasm, build-wheels,
            check-core, test-apple-mobile, test-android, test-nuget-package, test-npm-package, test-c]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Ask stage-native-binaries.yml to stage this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run stage-native-binaries.yml --repo "$GITHUB_REPOSITORY" --ref master
          -f head_sha="$GITHUB_SHA" -f ci_run_id="$GITHUB_RUN_ID"
