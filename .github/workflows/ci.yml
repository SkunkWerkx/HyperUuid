name: CI — build native, build wasm, test every binding

# The build/test matrix lives in HyperForge (SkunkWerkx/.github) as the canonical Hyper*
# pipeline — 6 real-hardware legs, the Rust core built fresh per leg, every binding's
# suite run against it. Ruby's suite runs twice (forced Fiddle fallback + Magnus extension
# backend); Python has no fallback — PyO3 only, via maturin develop.
#
# PR -> ci, tag -> release: this file is where every real build happens — the native legs,
# wasm, and (on push to master only) every registry's actual shippable, packed artifact
# (PyPI wheels, the NuGet .nupkg). release.yml never builds or packs anything itself: a tag
# push just finds this file's already-green run for that commit, authenticates to each
# registry, downloads the artifact this file already produced, and publishes it — see
# find-ci-run in release.yml. That split is also why packing only happens on push to master,
# not on every PR: a PR's packed artifact would never be tagged, so building it there is
# compute spent on nothing.
#
# Runs on push to master, not just pull_request, specifically so the commit that actually
# gets tagged has its own CI run and artifacts under its own SHA — a PR run validates the
# PR's head SHA (or an ephemeral merge ref), never the SHA that lands on master.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    with:
      project: HyperUuid
      crate: hyperuuid
      pure_env: HYPERUUID_PURE
      csharp_test_project: csharp/HyperUuid.Tests/HyperUuid.Tests.csproj
      # A jar has no per-platform package selection like NuGet's RID folders, and the
      # csproj's runtimes/**/native wildcard stages at pack time — so both bindings take
      # the pipeline's explicit per-leg placement for in-repo testing.
      csharp_runtimes_dir: csharp/HyperUuid/runtimes
      java_resources_dir: java/src/main/resources/native
      # go_windows stays default-true: the purego fallback carries the Windows legs.

  # C#/NuGet's WASM support isn't optional or spike-only anymore (needed for real, for Norse
  # Architecture), so it's built on every PR too, not just at release time.
  build-wasm:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wasm.yml@master
    with:
      crate: hyperuuid

  # Real multi-platform PyO3 wheels, built here (not release.yml) so release.yml never runs
  # maturin itself — it just finds this run and downloads what's already built. Gated to
  # push-to-master: a PR's wheels would never get published, so building them there is
  # wasted wall clock, not extra validation (build-native's own PyO3 leg already proves the
  # extension compiles and passes its tests on every PR).
  pypi-build-wheels:
    if: github.event_name == 'push'
    needs: build-native
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wheels.yml@master
    with:
      python_source_dir: python

  nuget-org-pack:
    needs: [build-native, build-wasm]
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-nuget.yml@master
    with:
      crate: hyperuuid
      csproj_path: csharp/HyperUuid/HyperUuid.csproj
      runtimes_dir: csharp/HyperUuid/runtimes
