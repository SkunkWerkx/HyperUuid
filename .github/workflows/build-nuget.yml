name: Build native libraries and pack NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-native:
    strategy:
      fail-fast: false
      # Runner labels checked against GitHub's current retirement schedule as of Aug 2026;
      # macos-13 (this workflow's original osx-x64 pick) was already retired Dec 2025.
      # GitHub is winding x86_64 macOS support down entirely by Fall 2027 — macos-15-intel
      # is the current label, but this leg has a shelf life; osx-arm64 does not.
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: libhyperuuid.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: libhyperuuid.so
          - os: macos-15-intel
            rid: osx-x64
            lib_name: libhyperuuid.dylib
          - os: macos-latest
            rid: osx-arm64
            lib_name: libhyperuuid.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: hyperuuid.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build libhyperuuid (release)
        working-directory: rust
        run: cargo build --release

      - name: Run Rust test suite
        working-directory: rust
        run: cargo test --release

      - name: Collect native artifact
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp rust/target/release/hyperuuid.dll "out/${{ matrix.lib_name }}" ;;
            macOS)   cp rust/target/release/libhyperuuid.dylib "out/${{ matrix.lib_name }}" ;;
            Linux)   cp rust/target/release/libhyperuuid.so "out/${{ matrix.lib_name }}" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: out/${{ matrix.lib_name }}

      # Diagnostic only, Windows only: the win-x64 leg loads hyperuuid.dll fine but .NET
      # can't find uuid_new_v4/v5/v7 inside it (EntryPointNotFoundException, not
      # DllNotFoundException) — a Windows cdylib export-table issue, not a file-placement
      # one. Ground-truth the actual export table before guessing at a fix.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Inspect DLL exports
        if: runner.os == 'Windows'
        shell: pwsh
        run: dumpbin /exports "out/${{ matrix.lib_name }}"

      # This is the actual thing worth confirming: not just that the Rust core cross-target
      # builds, but that .NET running on THIS platform can load libhyperuuid through
      # [LibraryImport] and get correct results — the real P/Invoke marshalling/resolution
      # path per OS, which cargo test above cannot exercise at all.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Place native lib for in-repo testing
        shell: bash
        run: |
          mkdir -p "csharp/HyperUuid/runtimes/${{ matrix.rid }}/native"
          cp "out/${{ matrix.lib_name }}" "csharp/HyperUuid/runtimes/${{ matrix.rid }}/native/"

      - name: Test C# bindings against this platform's native lib
        run: dotnet test --project csharp/HyperUuid.Tests/HyperUuid.Tests.csproj -c Release

  pack-nuget:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts

      # actions/download-artifact@v4 lands each artifact under artifacts/<artifact-name>/<file>.
      # Fan each one out into the csproj's runtimes/**/native/ Pack item so `dotnet pack` picks
      # them all up via the existing wildcard — no csproj changes needed per RID.
      - name: Arrange runtimes/{rid}/native/ layout
        shell: bash
        run: |
          set -euo pipefail
          declare -A LIB_NAMES=(
            [linux-x64]=libhyperuuid.so
            [linux-arm64]=libhyperuuid.so
            [osx-x64]=libhyperuuid.dylib
            [osx-arm64]=libhyperuuid.dylib
            [win-x64]=hyperuuid.dll
          )
          for rid in "${!LIB_NAMES[@]}"; do
            dest="csharp/HyperUuid/runtimes/$rid/native"
            mkdir -p "$dest"
            cp "artifacts/native-$rid/${LIB_NAMES[$rid]}" "$dest/"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # CI-only prerelease version so repeated manual (workflow_dispatch) runs during testing
      # don't collide with an already-pushed version on the GitHub Packages feed, which
      # doesn't allow overwriting an existing version. Real releases (tag push) still need
      # a deliberate version bump in the csproj before tagging.
      - name: Pack
        run: >
          dotnet pack csharp/HyperUuid/HyperUuid.csproj -c Release -o nupkg
          -p:PackageVersion=0.1.0-ci.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkg/*.nupkg

      # Publishes to this repo's GitHub Packages NuGet feed (private by default, scoped to
      # this repo/org — not nuget.org). Proves the whole pipeline for real: if a consumer can
      # `dotnet add package HyperUuid --source https://nuget.pkg.github.com/SkunkWerkx/index.json`
      # and it works, that's stronger evidence than just inspecting the .nupkg's file listing.
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push "nupkg/*.nupkg" --source github --skip-duplicate
