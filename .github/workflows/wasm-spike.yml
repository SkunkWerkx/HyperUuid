name: WASM spike (Rust + .NET) — diagnostic, not the real pipeline

# workflow_dispatch only, deliberately: this is a one-off diagnostic run to see whether
# HyperUuid.WasmSmokeTest's Rust-staticlib + Blazor WebAssembly NativeFileReference build
# succeeds on a mainstream x64 host, after hitting three separate real, verified upstream
# packaging bugs building the same thing on a local linux-arm64 dev machine (missing pic/
# relocatable libs on the .NET 11 preview band's Emscripten pack, and a wasm-opt/emcc version
# skew on the .NET 10 LTS band's pack). Not wired into build-packages.yml — this only runs
# when explicitly triggered.
on:
  workflow_dispatch:

jobs:
  wasm-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten,wasm32-wasip1

      # Official emsdk install method (git clone + install/activate latest) — same as this
      # repo's contributor-machine TOOLCHAIN.md, not a distro package or curl-pipe installer.
      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build Rust core as a wasm32-unknown-emscripten static library
        working-directory: rust
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          # cargo rustc, not cargo build: overrides crate-type to staticlib for just this
          # invocation without touching Cargo.toml's shared [lib] section (cdylib, the default
          # there, produces an already-linked complete .wasm module — NativeFileReference needs
          # an unlinked .a it can link INTO the Blazor app's own final combined build instead).
          cargo rustc --release --target wasm32-unknown-emscripten --crate-type staticlib
          ls -la target/wasm32-unknown-emscripten/release/libhyperuuid.a

      - name: Prove the core crate itself runs under a real WASM host (wasmtime, wasm32-wasip1)
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          # GH Actions runs each `run:` step non-interactively (no ~/.bashrc sourcing), unlike
          # a real login shell — the installer's own bashrc wiring doesn't take effect here, so
          # set PATH directly for the rest of this step instead.
          export PATH="$HOME/.wasmtime/bin:$PATH"
          mkdir -p /tmp/wasm-rust-smoke/src
          cat > /tmp/wasm-rust-smoke/Cargo.toml <<'TOML'
          [package]
          name = "wasm-rust-smoke"
          version = "0.1.0"
          edition = "2024"
          [dependencies]
          hyperuuid = { path = "${{ github.workspace }}/rust" }
          TOML
          cat > /tmp/wasm-rust-smoke/src/main.rs <<'RS'
          use hyperuuid::{v4, v5, v7};
          use std::time::{SystemTime, UNIX_EPOCH};
          fn now_ms() -> u64 {
              SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_millis() as u64
          }
          fn main() {
              let mut failed = false;
              let a = v4::new_v4().unwrap();
              let b = v4::new_v4().unwrap();
              if a == b { failed = true; println!("FAIL: v4 collision"); }
              let v5_id = v5::new_v5(v5::namespace::DNS, b"www.example.com");
              let expected: hyperuuid::Uuid = "2ed6657d-e927-568b-95e1-2665a8aea6a2".parse().unwrap();
              if v5_id != expected { failed = true; println!("FAIL: v5 mismatch"); }
              let before = now_ms();
              let v7_now = v7::new_v7(now_ms()).unwrap();
              let after = now_ms();
              let ms = v7::unix_millis(&v7_now);
              if ms + 2000 < before || ms > after + 2000 { failed = true; println!("FAIL: v7 clock drift"); }
              println!("v4: {} {}", a, b);
              println!("v5: {} matches RFC 9562 Appendix A.4 vector", v5_id);
              println!("v7 (now): {} embeds real clock timestamp {}", v7_now, ms);
              if failed { std::process::exit(1); }
              println!("ALL WASM CHECKS PASSED");
          }
          RS
          cd /tmp/wasm-rust-smoke
          cargo build --release --target wasm32-wasip1
          wasmtime run target/wasm32-wasip1/release/wasm-rust-smoke.wasm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build the Blazor WASM smoke test (NativeFileReference -> the Rust staticlib)
        working-directory: csharp/HyperUuid.WasmSmokeTest
        run: dotnet build -c Release

      - name: Publish (Release build alone doesn't always exercise the full native relink)
        working-directory: csharp/HyperUuid.WasmSmokeTest
        run: dotnet publish -c Release -o publish-out
