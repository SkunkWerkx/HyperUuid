name: Prepare release

# Step one of a release: bump the version in every manifest that carries it as committed
# text (rust/Cargo.toml, the csproj, build.gradle.kts, the gemspec and lib/hyperuuid.rb's
# VERSION constant, together, so they never disagree), refresh the lock files, push the bump
# straight to master and dispatch ci.yml against it. Python needs nothing: pyproject.toml
# sources its version from rust/Cargo.toml. PHP, Swift and Go have no version field, but the
# native libraries committed for them report the crate version (`hyperuuid_version()`), so
# ci.yml's release-mode run on the bump commit (A) is what stage-native-binaries.yml stages
# onto it as B. The order of a release:
#
#   1. this workflow: bump every manifest, push A, dispatch ci.yml on A;
#   2. ci.yml goes green on A, its last job dispatches stage-native-binaries.yml, which
#      waits for the run to complete and commits that run's libraries on top as B;
#   3. a human tags B; release.yml refuses a tag whose ci.yml run or committed libraries were
#      built at a different version, then prepares, and a dispatch publishes (RELEASING.md).
#
# The Forge's hyper_config.py derives the manifest list from .github/hyper.json's crate and
# project names; the body lives in the Forge.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version, e.g. "1.0.0" (no leading "v": that belongs on the git tag, not in any manifest)'
        required: true
        type: string

concurrency:
  group: release-source-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    uses: SkunkWerkx/.github/.github/workflows/hyper-prepare-release.yml@master
    permissions:
      contents: write
      # gh workflow run: the bump commit needs a ci.yml run of its own (see the header).
      actions: write
    with:
      version: ${{ inputs.version }}
