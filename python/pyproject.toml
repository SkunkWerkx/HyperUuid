[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperuuid"
version = "0.1.0"
description = "RFC 9562 UUID v4/v5/v7 generation — high-performance, allocation-free ctypes bindings straight into a native Rust core (libhyperuuid). No runtime bridge."
readme = "README.md"
license = "MIT"
authors = [{ name = "Brian Buvinghausen" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/buvinghausen/SkunkWerx"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hyperuuid"]

[tool.hatch.build.targets.wheel.force-include]
"src/hyperuuid/libhyperuuid.so" = "hyperuuid/libhyperuuid.so"
