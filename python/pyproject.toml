[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hyperuuid"
version = "0.0.1"
description = "RFC 9562 UUID v4/v5/v6/v7 generation — a PyO3 native extension (auto-selected) linking a Rust core directly into CPython, with a zero-compile ctypes fallback. No runtime bridge."
readme = "README.md"
license = "MIT"
authors = [{ name = "Brian Buvinghausen" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["uuid", "rfc9562", "guid", "identifier", "pyo3", "ctypes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/SkunkWerkx/HyperUuid"
Repository = "https://github.com/SkunkWerkx/HyperUuid"
Issues = "https://github.com/SkunkWerkx/HyperUuid/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
bench = ["pyperf>=2.6"]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "hyperuuid._native"
