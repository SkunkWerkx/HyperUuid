[build-system]
# 1.9 is the first maturin with full PEP 639 support — the SPDX `license` string and the
# top-level `license-files` below. An older one does not build this file.
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "hyperuuid"
dynamic = ["version"]
description = "RFC 9562 UUID v4/v5/v6/v7 generation — a PyO3 native extension linking a Rust core directly into CPython. No runtime bridge, no compiler needed to install."
readme = "README.md"
license = "MIT"
# A local copy, not a path up to the repo root: PEP 639 globs forbid `..` outright
# ("the parent directory operator (`..`) at position 0 is not allowed"), and a symlink is
# no better. Same reason rust/ carries its own — git stores one blob for all of them.
license-files = ["LICENSE"]
authors = [{ name = "Brian Buvinghausen" }]
# 3.11 floor: 3.9 reached end of life in October 2025 and 3.10 does on 2026-10-31. The
# extension is built abi3-py311, so one wheel per platform covers the whole floor-and-up range — the
# same floor HyperCast has.
requires-python = ">=3.11"
dependencies = []
keywords = ["uuid", "rfc9562", "guid", "identifier", "pyo3"]
# No `License ::` classifier: PEP 639 deprecates them in favour of the `license` expression
# above, and the two are not meant to be declared together.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SkunkWerkx/HyperUuid"
Repository = "https://github.com/SkunkWerkx/HyperUuid"
Issues = "https://github.com/SkunkWerkx/HyperUuid/issues"

[project.optional-dependencies]
# mypy is what tests/test_typing.py checks a consumer with; that one test skips without it.
test = ["pytest>=8.0", "mypy>=1.11"]
bench = ["pyperf>=2.6"]
# The wasm32-wasip1 build of the same core, run in-process by wasmtime-py — the backend
# HYPERUUID_WASM=1 forces, and the fallback when the `_native` extension fails to import (see
# README's WebAssembly section). Optional because the extension needs nothing at all, and
# wasmtime is a ~10 MB runtime.
wasm = ["wasmtime>=47"]

[tool.maturin]
manifest-path = "../rust/Cargo.toml"
python-source = "src"
module-name = "hyperuuid._native"
features = ["python"]
# The wasm32-wasip1 build of the core (staged under src/hyperuuid/native/ by CI, gitignored
# like every other binding's native staging dir). maturin's python-source walk skips it
# without this, so the wasm backend would import cleanly and then find no module to load.
include = [{ path = "src/hyperuuid/native/wasm32-wasip1/hyperuuid.wasm", format = ["sdist", "wheel"] }]

[tool.ruff.lint]
# Doc-comment enforcement only — the "missing docstring" family of pydocstyle rules
# (D100-D107), not the full pydocstyle convention (imperative mood, blank-line placement,
# etc.), which isn't this project's existing comment style and isn't what "force
# documentation" is asking for.
select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
