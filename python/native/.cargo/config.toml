# macOS: a CPython extension module must not link libpython — the Py* symbols resolve
# from the host interpreter when the module loads, so the linker has to be told to leave
# them undefined (`dynamic_lookup`). maturin and setuptools-rust arrange this themselves;
# a plain `cargo build` (this repo's dev loop and CI) does not, so it's declared here —
# the same mechanism, for the same reason, as ruby/native/.cargo/config.toml. Linux
# permits undefined symbols in shared libraries by default. (Learned the hard way in
# HyperCast's CI bring-up; pre-applied here.)
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]
