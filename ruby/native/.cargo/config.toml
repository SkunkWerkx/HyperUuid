# macOS: a Ruby C extension must not link libruby — the rb_* symbols resolve from the
# host Ruby process when the extension loads, so the linker has to be told to leave them
# undefined (`dynamic_lookup`, the standard flag every macOS Ruby extension builds with,
# and what Magnus's own docs prescribe). Linux permits undefined symbols in shared
# libraries by default, which is why only the Darwin targets need this. (Learned the hard
# way in HyperCast's CI bring-up; pre-applied here.)
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]
